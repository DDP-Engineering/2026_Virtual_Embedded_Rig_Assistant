version: 0.1.0
date: 2026-11-15
entries:
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Workbench }
    text:
      en: Chat with an agent that reads, searches and edits your project documents with your approval.
      ro: Discutați cu un agent care citește, caută și editează documentele proiectului cu acordul dvs.
      de: Ein Agent liest, durchsucht und bearbeitet Ihre Projektdokumente mit Ihrer Zustimmung.
      fr: Un agent lit, recherche et modifie les documents de votre projet avec votre accord.
  - category: new
    topic: { en: Providers, ro: Furnizori, de: Anbieter, fr: Fournisseurs }
    text:
      en: Use OpenAI, a ChatGPT subscription, LM Studio, Ollama or another compatible endpoint.
      ro: Folosiți OpenAI, un abonament ChatGPT, LM Studio, Ollama sau alt endpoint compatibil.
      de: Nutzen Sie OpenAI, ein ChatGPT-Abo, LM Studio, Ollama oder einen anderen kompatiblen Endpunkt.
      fr: Utilisez OpenAI, un abonnement ChatGPT, LM Studio, Ollama ou un autre point d’accès compatible.
  - category: new
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: 37 plugins for electronics design, embedded development, lab instruments, Arduino and IoT.
      ro: 37 de pluginuri pentru proiectare electronică, dezvoltare embedded, laborator, Arduino și IoT.
      de: 37 Plugins für Elektronikdesign, Embedded-Entwicklung, Laborgeräte, Arduino und IoT.
      fr: 37 plugins pour la conception électronique, l’embarqué, les instruments, Arduino et l’IoT.
  - category: new
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Install plugin dependencies from an offline kit on a computer without network.
      ro: Instalați dependențele pluginurilor dintr-un kit offline pe un calculator fără rețea.
      de: Installieren Sie Plugin-Abhängigkeiten aus einem Offline-Paket ohne Netzwerk.
      fr: Installez les dépendances des plugins depuis un kit hors ligne, sans réseau.
  - category: new
    topic: { en: Help, ro: Ajutor, de: Hilfe, fr: Aide }
    text:
      en: Help for VERA and every plugin, opened with the ? button or F1; the agent can read it too.
      ro: Ajutor pentru VERA și fiecare plugin, cu butonul ? sau F1; agentul îl poate citi și el.
      de: Hilfe zu VERA und jedem Plugin über die Schaltfläche ? oder F1; auch der Agent kann sie lesen.
      fr: Aide pour VERA et chaque plugin, via le bouton ? ou F1 ; l’agent peut aussi la lire.
  - category: new
    topic: { en: Appearance and language, ro: Aspect și limbă, de: Darstellung und Sprache, fr: Apparence et langue }
    text:
      en: The interface is available in English, Romanian, German and French.
      ro: Interfața este disponibilă în engleză, română, germană și franceză.
      de: Die Oberfläche ist auf Englisch, Rumänisch, Deutsch und Französisch verfügbar.
      fr: L’interface est disponible en anglais, roumain, allemand et français.
  - category: new
    topic: { en: About, ro: Despre, de: Über, fr: À propos }
    text:
      en: See what changed in each version under Settings, About.
      ro: Vedeți ce s-a schimbat în fiecare versiune în Setări, Despre.
      de: Sehen Sie unter Einstellungen, Über, was sich in jeder Version geändert hat.
      fr: Consultez les nouveautés de chaque version dans Paramètres, À propos.
