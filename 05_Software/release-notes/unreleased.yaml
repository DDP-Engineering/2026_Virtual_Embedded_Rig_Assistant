version: Unreleased
date: null
entries:
  - category: improved
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Turn a saved firmware comparison into a manual test plan with per-case readiness.
      ro: Transformă o comparație de firmware salvată într-un plan cu starea fiecărui caz.
      de: Aus einem gespeicherten Firmware-Vergleich einen Testplan mit Fallstatus erstellen.
      fr: Créez un plan de test depuis une comparaison enregistrée avec l’état de chaque cas.
  - category: fixed
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Saved firmware reports and test plans use the exact line references returned by tools.
      ro: Rapoartele și planurile salvate folosesc referințele exacte furnizate de instrumente.
      de: Firmware-Berichte und Testpläne speichern die genauen Zeilenverweise der Werkzeuge.
      fr: Les rapports et plans enregistrés gardent les références de lignes exactes des outils.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Continue reading files and artifacts without skipping lines between pages.
      ro: Citește în continuare fișierele și artefactele fără să sară linii între pagini.
      de: Beim Weiterblättern in Dateien und Artefakten werden keine Zeilen übersprungen.
      fr: La lecture des fichiers et artefacts reprend sans sauter de lignes entre les pages.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Changes that leave a file identical finish without rewriting it or asking for approval.
      ro: Dacă textul rămâne identic, fișierul nu se rescrie și nu mai cere aprobare.
      de: Bei identischem Inhalt entfallen das erneute Schreiben und die Freigabe.
      fr: Un contenu identique ne déclenche ni réécriture ni demande d’approbation.
  - category: improved
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Large file changes can still be approved when the preview takes too long.
      ro: Modificările mari pot fi aprobate și când previzualizarea durează prea mult.
      de: Große Änderungen bleiben auch bei zu langer Vorschau-Berechnung freigabefähig.
      fr: Les modifications restent approuvables si le calcul de l’aperçu prend trop de temps.
  - category: improved
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Pages from large text files load faster.
      ro: Paginile din fișierele text mari se încarcă mai repede.
      de: Seiten aus großen Textdateien laden schneller.
      fr: Les pages des gros fichiers texte se chargent plus vite.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: VERA reports a saved file even when the change history is pending.
      ro: VERA confirmă salvarea fișierului chiar dacă modificarea nu apare încă în istoric.
      de: VERA bestätigt die gespeicherte Datei auch bei ausstehendem Verlaufseintrag.
      fr: VERA indique que le fichier est enregistré même si l’historique reste en attente.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: VERA identifies UTF-16 text when the file encoding prevents editing.
      ro: VERA identifică textul UTF-16 când această codare împiedică editarea.
      de: VERA erkennt UTF-16-Text, wenn diese Kodierung eine Bearbeitung verhindert.
      fr: VERA identifie le texte UTF-16 lorsque cet encodage empêche la modification.
