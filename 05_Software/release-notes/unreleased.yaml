version: Unreleased
date: null
entries:
  - category: improved
    topic: { en: Chat, ro: Chat, de: Chat, fr: Chat }
    text:
      en: Copy replies or code; Run skips stalled terminals and disables empty or oversized blocks.
      ro: Copiază răspunsuri sau cod; Execută evită terminale blocate și blocuri goale sau prea mari.
      de: Antworten und Code kopieren; Ausführen meidet hängende Terminals sowie leere oder zu lange Blöcke.
      fr: Copiez réponses ou code ; Exécuter évite les terminaux bloqués et le code vide ou trop long.
  - category: new
    topic: { en: Images, ro: Imagini, de: Bilder, fr: Images }
    text:
      en: Attach and reopen chat images. Set image support per model so the agent can inspect them.
      ro: Atașează și redeschide imagini în chat. Alege modelele cu care agentul le poate examina.
      de: Chatbilder anhängen und öffnen. Wählen Sie die Modelle, mit denen der Agent Bilder prüfen kann.
      fr: Joignez et rouvrez des images. Choisissez les modèles avec lesquels l’agent peut les examiner.
  - category: fixed
    topic: { en: Skills, ro: Skills, de: Skills, fr: Compétences }
    text:
      en: Clearer activation and scopes; create and edit instructions or view read-only skills.
      ro: Activare și locații mai clare; creează, editează sau vezi instrucțiunile doar pentru citire.
      de: Klare Aktivierung und Speicherorte; Anweisungen erstellen, bearbeiten oder nur lesen.
      fr: Activation et portée clarifiées ; créez, modifiez ou consultez les instructions en lecture seule.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Banc de travail }
    text:
      en: Choose right-panel tabs and check storage size on demand. Recreate databases from earlier builds.
      ro: Alege filele din dreapta și vezi spațiul la cerere. Recreează bazele din versiunile vechi.
      de: Rechte Tabs wählen und Speicherbedarf abrufen. Datenbanken aus früheren Builds neu erstellen.
      fr: Choisissez les onglets à droite et voyez l’espace à la demande. Recréez les anciennes bases.
  - category: fixed
    topic: { en: Chat, ro: Chat, de: Chat, fr: Chat }
    text:
      en: Tool calls have translated labels, readable plans, optional details and no empty output blocks.
      ro: Apelurile de instrumente au texte traduse, planuri lizibile și detalii fără blocuri goale.
      de: Werkzeugaufrufe zeigen übersetzte Texte, lesbare Pläne und Details ohne leere Ausgabefelder.
      fr: Les outils gardent libellés traduits, plans lisibles et détails, sans bloc de résultat vide.
  - category: fixed
    topic: { en: Settings, ro: Setări, de: Einstellungen, fr: Paramètres }
    text:
      en: Commands aligns Cancel/Save at the top right; About starts with What's new collapsed.
      ro: În Comenzi, Anulare/Salvare sunt sus în dreapta; secțiunea Noutăți este restrânsă inițial.
      de: Befehle zeigt Abbrechen/Speichern oben rechts; Neuigkeiten unter Über ist anfangs eingeklappt.
      fr: Commandes aligne Annuler/Enregistrer en haut à droite ; À propos replie les nouveautés.
  - category: fixed
    topic: { en: Terminal, ro: Terminal, de: Terminal, fr: Terminal }
    text:
      en: Terminal text follows the code/output text size setting immediately and refits the terminal.
      ro: Textul terminalului urmează imediat dimensiunea pentru cod/ieșire și recalculează rândurile.
      de: Terminaltext folgt sofort der Schriftgröße für Code/Ausgabe und passt Zeilen und Spalten an.
      fr: Le terminal suit immédiatement la taille du texte de code/sortie et ajuste lignes et colonnes.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Files uses icons beside search, compact indexing progress and expandable failure details.
      ro: Fișiere are pictograme lângă căutare, progres compact și detalii extensibile pentru erori.
      de: Dateien bietet Symbole neben der Suche, kompakten Indexfortschritt und aufklappbare Fehlerdetails.
      fr: Fichiers regroupe les icônes près de la recherche, la progression et les détails des échecs.
  - category: improved
    topic: { en: Interface, ro: Interfață, de: Oberfläche, fr: Interface }
    text:
      en: Compact panels, clearer run cards, centered chat and renamed Instructions and skills tab.
      ro: Panouri compacte, carduri de rulare clare, chat centrat și tabul Instrucțiuni și skill-uri.
      de: Kompakte Panels, klare Laufkarten, zentrierter Chat und der Tab Anweisungen und Skills.
      fr: Panneaux compacts, exécutions lisibles, chat centré et onglet Instructions et compétences.
  - category: fixed
    topic: { en: Terminal, ro: Terminal, de: Terminal, fr: Terminal }
    text:
      en: Terminal history avoids control characters; closing no longer shows a missing-operation error.
      ro: Istoricul nu mai introduce caractere de control; închiderea terminalului nu mai afișează erori.
      de: Keine Steuerzeichen beim Anzeigen des Verlaufs und keine Fehlermeldung beim Schließen.
      fr: Plus de caractères de contrôle dans l’historique ni d’erreur à la fermeture du terminal.
  - category: fixed
    topic: { en: Commands, ro: Comenzi, de: Befehle, fr: Commandes }
    text:
      en: Stopping a command on Windows also cleans up child processes started during termination.
      ro: Oprirea unei comenzi pe Windows elimină și procesele copil pornite în timpul opririi.
      de: Beim Stoppen eines Windows-Befehls werden auch währenddessen gestartete Kindprozesse beendet.
      fr: L’arrêt d’une commande Windows nettoie aussi les processus enfants lancés pendant l’arrêt.
  - category: new
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Rendered, Text or Hex per extension. Zoom to 400%. In Hex, jump, find and copy bytes or text.
      ro: Randat, Text sau Hex pe extensie. Zoom 400%. În Hex, sari, caută și copiază octeți sau text.
      de: Gerendert, Text, Hex je Endung. Zoom bis 400 %. In Hex springen, Text und Bytes suchen und kopieren.
      fr: Rendu, Texte, Hex par extension. Zoom 400 %. En Hex, sauts, recherche et copie de texte ou d’octets.
  - category: new
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Switch local models per workbench. Both models are included for offline search.
      ro: Schimbă modelul local pe workbench. Ambele modele sunt incluse pentru căutare offline.
      de: Wechseln Sie das Modell je Workbench. Beide Modelle sind für die Offline-Suche enthalten.
      fr: Changez de modèle par banc. Les deux modèles sont inclus pour la recherche hors ligne.
  - category: improved
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Read large text with encoding, wrap, jumps and Find; viewer controls share one compact row.
      ro: Citește texte mari cu codificare, încadrare, salturi și căutare; controalele au un rând compact.
      de: Große Texte mit Kodierung, Umbruch, Sprüngen und Suche; Ansichtsregler in einer kompakten Zeile.
      fr: Grands textes avec encodage, retour à la ligne, sauts et recherche ; commandes sur une ligne.
  - category: improved
    topic: { en: Data & privacy, ro: Date și confidențialitate, de: Daten & Datenschutz, fr: Données et confidentialité }
    text:
      en: Choose masking defaults and workbench overrides; confirm before turning agent masking off.
      ro: Alege mascarea implicită și pe workbench; confirmă înainte de a dezactiva mascarea agentului.
      de: Maskierung für App und Workbench wählen; das Ausschalten beim Agenten bestätigen.
      fr: Choisissez le masquage par application et par banc ; confirmez sa désactivation pour l’agent.
  - category: fixed
    topic: { en: Privacy, ro: Confidențialitate, de: Datenschutz, fr: Confidentialité }
    text:
      en: Agent and export masking now follow their own app and workbench choices.
      ro: Mascarea agentului și a exporturilor respectă alegerile aplicației și ale workbench-ului.
      de: Agenten- und Exportmaskierung folgen nun ihren eigenen App- und Workbench-Einstellungen.
      fr: Le masquage de l’agent et des exports suit leurs choix propres dans l’application et le banc.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Display masking keeps secret-named files visible and opens their original contents.
      ro: Mascarea afișării păstrează fișierele cu nume secrete vizibile și le deschide corect.
      de: Die Anzeigemaskierung lässt Dateien mit geheimen Namen sichtbar und öffnet sie korrekt.
      fr: Le masquage garde visibles les fichiers aux noms secrets et ouvre leur contenu correct.
  - category: fixed
    topic: { en: Commands, ro: Comenzi, de: Befehle, fr: Commandes }
    text:
      en: Commands run under PowerShell Constrained Language Mode; saved prefixes exclude risky git forms.
      ro: Comenzile rulează sub PowerShell Constrained Language Mode; prefixele salvate exclud git riscant.
      de: Befehle laufen im PowerShell Constrained Language Mode; Präfixe decken riskantes git nicht ab.
      fr: Commandes compatibles avec le Constrained Language Mode ; préfixes sans formes git risquées.
  - category: new
    topic: { en: Terminal, ro: Terminal, de: Terminal, fr: Terminal }
    text:
      en: Use interactive terminal tabs; allow agent reads separately for each terminal.
      ro: Folosește terminale interactive; permite citirea de către agent separat pentru fiecare.
      de: Interaktive Terminal-Tabs nutzen; Agentenlesezugriff für jedes Terminal separat erlauben.
      fr: Utilisez des terminaux interactifs ; autorisez la lecture par l’agent pour chacun.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Banc de travail }
    text:
      en: Indexing honors Git ignore and explains skips over a configurable file size limit.
      ro: Indexarea respectă Git ignore și explică omiterile peste limita de mărime configurabilă.
      de: Die Indizierung beachtet Git Ignore und begründet Auslassungen über dem einstellbaren Limit.
      fr: L’indexation suit Git ignore et explique les exclusions au-delà de la taille configurable.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Banc de travail }
    text:
      en: Counts match indexing; large selections wait and show largest folders, with Index anyway.
      ro: Numărul corespunde indexării; selecțiile mari așteaptă, arată folderele mari și permit indexarea.
      de: Anzahl stimmt mit dem Index; große Auswahl wartet, zeigt größte Ordner und erlaubt Indizierung.
      fr: Comptage conforme à l’index ; grande sélection en attente, gros dossiers et indexation possible.
  - category: improved
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Banc de travail }
    text:
      en: Plugin tools are grouped by provider, separate from core tools; saved restrictions stay effective.
      ro: Instrumentele plugin-urilor sunt separate de cele de bază; restricțiile salvate rămân active.
      de: Spezialisierte Werkzeuge stehen bei ihren Plugins, getrennt vom Kern; Einschränkungen bleiben.
      fr: Outils spécialisés avec leurs plugins, séparés des outils de base ; restrictions conservées.
  - category: new
    topic: { en: Sessions, ro: Sesiuni, de: Sitzungen, fr: Sessions }
    text:
      en: "Bookmark messages. Agents delegate inspections and use results. Follow or stop them in Desktop."
      ro: "Marchează mesaje. Agenții deleagă verificări și folosesc rezultate. Urmărește-le sau oprește-le."
      de: "Lesezeichen setzen. Agenten delegieren Prüfungen und werten sie aus. Läufe verfolgen oder stoppen."
      fr: "Ajoutez des signets. Les agents délèguent et utilisent les résultats. Suivez ou arrêtez les tâches."
  - category: improved
    topic: { en: Sessions, ro: Sesiuni, de: Sitzungen, fr: Sessions }
    text:
      en: Bookmark shortcuts and exports; Verbose shows send time. Context summaries survive restarts.
      ro: Scurtături și export de marcaje; Verbose arată ora trimiterii. Rezumatele rămân după repornire.
      de: Lesezeichenkürzel und -export; Sendezeit im Detailchat. Zusammenfassungen bleiben nach Neustart.
      fr: Raccourcis et export de signets ; heure d’envoi en mode détaillé ; résumés gardés au redémarrage.
  - category: improved
    topic: { en: Permissions, ro: Permisiuni, de: Berechtigungen, fr: Autorisations }
    text:
      en: Each Bypass change asks for confirmation; agent file tools refuse VERA application data.
      ro: Fiecare trecere la Bypass cere confirmare; instrumentele de fișiere refuză datele VERA.
      de: Jeder Bypass-Wechsel fragt nach; Dateiwerkzeuge sperren die VERA-Anwendungsdaten.
      fr: Chaque passage à Contournement est à confirmer ; les outils de fichiers refusent les données VERA.
  - category: improved
    topic: { en: Permissions, ro: Permisiuni, de: Berechtigungen, fr: Autorisations }
    text:
      en: Bypass permits outside programs and analysis inputs; leaving it stops running programs.
      ro: Bypass permite programe și intrări de analiză externe; ieșirea oprește programele active.
      de: Bypass erlaubt externe Programme und Analyseeingaben; beim Verlassen werden Programme gestoppt.
      fr: Contournement autorise programmes et analyses externes ; en sortir arrête les programmes.
  - category: new
    topic: { en: Commands, ro: Comenzi, de: Befehle, fr: Commandes }
    text:
      en: Run and monitor commands; choose an installed shell, including Cmd and Git Bash, or a custom path.
      ro: Rulează și urmărește comenzi; alege un shell instalat, inclusiv Cmd și Git Bash, sau o cale proprie.
      de: Befehle ausführen und verfolgen; installierte Shell wie Cmd oder Git Bash oder eigenen Pfad wählen.
      fr: Exécutez et suivez les commandes ; choisissez Cmd, Git Bash, un shell installé ou un chemin.
  - category: improved
    topic: { en: Permissions, ro: Permisiuni, de: Berechtigungen, fr: Autorisations }
    text:
      en: Save command prefixes for Auto-edit; dangerous commands still ask outside Bypass.
      ro: Salvează prefixe pentru Editare automată; comenzile periculoase cer acord în afara Bypass.
      de: Befehlspräfixe für Automatisch bearbeiten speichern; gefährliche Befehle fragen außerhalb Bypass.
      fr: Enregistrez des préfixes en Modification auto ; les commandes risquées demandent hors Contournement.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Banc de travail }
    text:
      en: Add folders for agent file access and command working directories; remove them to revoke access.
      ro: Adaugă foldere pentru fișierele și comenzile agentului; elimină-le pentru a retrage accesul.
      de: Ordner für Agentendateien und Befehle hinzufügen; Entfernen widerruft den Zugriff.
      fr: Ajoutez des dossiers pour les fichiers et commandes de l’agent ; supprimez-les pour retirer l’accès.
  - category: improved
    topic: { en: Runs, ro: Rulări, de: Läufe, fr: Exécutions }
    text:
      en: Run logs and terminal output follow your masking choice, off by default; agent reads stay masked.
      ro: Jurnalele și terminalul urmează mascarea aleasă, implicit oprită; citirile agentului rămân mascate.
      de: "Laufprotokolle und Terminal: Maskierung ist standardmäßig aus; Agentenlesezugriffe bleiben maskiert."
      fr: "Journaux et terminal : masquage désactivé par défaut ; lectures de l’agent toujours masquées."
