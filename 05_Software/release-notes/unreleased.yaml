version: Unreleased
date: null
entries:
  - category: improved
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Choose text encodings and word wrap; Find and Go to line follow wrapped source lines.
      ro: Alege codificarea și încadrarea textului; căutarea și saltul la linie urmăresc liniile sursă.
      de: Textkodierung und Zeilenumbruch wählen; Suche und Zeilensprung folgen den Quellzeilen.
      fr: Choisissez l’encodage et le retour à la ligne ; recherche et saut suivent les lignes source.
  - category: improved
    topic: { en: Data & privacy, ro: Date și confidențialitate, de: Daten & Datenschutz, fr: Données et confidentialité }
    text:
      en: Choose masking defaults and workbench overrides; confirm before turning agent masking off.
      ro: Alege mascarea implicită și pe workbench; confirmă înainte de a dezactiva mascarea agentului.
      de: Maskierung für App und Workbench wählen; das Ausschalten beim Agenten bestätigen.
      fr: Choisissez le masquage par application et par banc ; confirmez sa désactivation pour l’agent.
  - category: fixed
    topic: { en: Privacy, ro: Confidențialitate, de: Datenschutz, fr: Confidentialité }
    text:
      en: Agent and export masking now follow their own app and workbench choices.
      ro: Mascarea agentului și a exporturilor respectă alegerile aplicației și ale workbench-ului.
      de: Agenten- und Exportmaskierung folgen nun ihren eigenen App- und Workbench-Einstellungen.
      fr: Le masquage de l’agent et des exports suit leurs choix propres dans l’application et le banc.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Display masking keeps secret-named files visible and opens their original contents.
      ro: Mascarea afișării păstrează fișierele cu nume secrete vizibile și le deschide corect.
      de: Die Anzeigemaskierung lässt Dateien mit geheimen Namen sichtbar und öffnet sie korrekt.
      fr: Le masquage garde visibles les fichiers aux noms secrets et ouvre leur contenu correct.
  - category: new
    topic: { en: Terminal, ro: Terminal, de: Terminal, fr: Terminal }
    text:
      en: Use interactive terminal tabs; allow agent reads separately for each terminal.
      ro: Folosește terminale interactive; permite citirea de către agent separat pentru fiecare.
      de: Interaktive Terminal-Tabs nutzen; Agentenlesezugriff für jedes Terminal separat erlauben.
      fr: Utilisez des terminaux interactifs ; autorisez la lecture par l’agent pour chacun.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Workbench }
    text:
      en: Indexing skips what the repository's Git ignore rules exclude, such as build output.
      ro: Indexarea omite ce exclud regulile Git ignore ale depozitului, de exemplu rezultatele build-ului.
      de: Die Indizierung überspringt, was die Git-Ignore-Regeln des Repositorys ausschließen, etwa Builds.
      fr: L’indexation ignore ce que les règles Git ignore du dépôt excluent, comme les sorties de build.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Workbench }
    text:
      en: A workbench can set a maximum file size for indexing; larger files show why they were skipped.
      ro: Un workbench poate seta o dimensiune maximă pentru indexare; fișierele mai mari arată motivul.
      de: Eine Workbench kann eine maximale Dateigröße zum Indizieren festlegen; größere zeigen den Grund.
      fr: Un banc peut fixer une taille maximale à indexer ; les fichiers plus grands montrent pourquoi.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Workbench }
    text:
      en: Indexing waits before an unusually large selection and shows its largest folders; index it anyway.
      ro: Indexarea așteaptă la o selecție neobișnuit de mare și arată cele mai mari foldere.
      de: Die Indizierung wartet bei einer ungewöhnlich großen Auswahl und zeigt die größten Ordner.
      fr: L’indexation attend devant une sélection inhabituellement grande et montre les plus gros dossiers.
  - category: improved
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Workbench }
    text:
      en: The document count before saving matches indexing and warns about a too large selection.
      ro: Numărul de documente dinainte de salvare corespunde indexării și avertizează la o selecție mare.
      de: Die Dokumentanzahl vor dem Speichern entspricht der Indizierung und warnt bei zu großer Auswahl.
      fr: Le nombre de documents avant enregistrement suit l’indexation et signale une sélection trop grande.
  - category: improved
    topic: { en: Sessions, ro: Sesiuni, de: Sitzungen, fr: Sessions }
    text:
      en: Session exports retain saved message bookmarks.
      ro: Exporturile sesiunilor păstrează marcajele salvate ale mesajelor.
      de: Sitzungsexporte behalten gespeicherte Nachrichtenlesezeichen bei.
      fr: Les exports de session conservent les signets enregistrés des messages.
  - category: new
    topic: { en: Sessions, ro: Sesiuni, de: Sitzungen, fr: Sessions }
    text:
      en: Bookmark your messages from the conversation or its title and reply preview.
      ro: Marchează mesajele din conversație sau din previzualizarea cu titlu și răspuns.
      de: Setze Lesezeichen an Nachrichten im Gespräch oder in der Titel- und Antwortvorschau.
      fr: Ajoutez des signets aux messages dans la conversation ou l’aperçu du titre et de la réponse.
  - category: improved
    topic: { en: Sessions, ro: Sesiuni, de: Sitzungen, fr: Sessions }
    text:
      en: Find marked messages on the rail and jump between them with editable bookmark shortcuts.
      ro: Găsește mesajele marcate pe margine și sari între ele cu taste configurabile.
      de: Finde markierte Nachrichten auf der Leiste und springe per anpassbaren Tastenkürzeln zu ihnen.
      fr: Repérez les signets sur la barre et passez de l’un à l’autre avec des raccourcis modifiables.
  - category: improved
    topic: { en: Permissions, ro: Permisiuni, de: Berechtigungen, fr: Permissions }
    text:
      en: Each Bypass change asks for confirmation; agent file tools refuse VERA application data.
      ro: Fiecare trecere la Bypass cere confirmare; instrumentele de fișiere refuză datele VERA.
      de: Jeder Bypass-Wechsel fragt nach; Dateiwerkzeuge sperren die VERA-Anwendungsdaten.
      fr: Chaque passage à Bypass demande confirmation ; les outils de fichiers refusent les données VERA.
  - category: improved
    topic: { en: Permissions, ro: Permisiuni, de: Berechtigungen, fr: Permissions }
    text:
      en: Bypass runs declared programs in outside folders and stops them when you leave Bypass.
      ro: Bypass rulează programe declarate în foldere externe și le oprește când ieși din Bypass.
      de: Bypass führt deklarierte Programme in externen Ordnern aus und stoppt sie beim Verlassen.
      fr: Bypass lance les programmes déclarés dans des dossiers externes et les arrête à sa sortie.
  - category: improved
    topic: { en: Permissions, ro: Permisiuni, de: Berechtigungen, fr: Autorisations }
    text:
      en: Bypass also reaches outside analysis, plugin drafts, HIL and electrical inputs.
      ro: Bypass permite și intrări externe pentru analiză, ciorne de plugin, HIL și calcule electrice.
      de: Bypass erlaubt auch externe Eingaben für Analysen, Plugin-Entwürfe, HIL und Elektrik.
      fr: Bypass accepte aussi les entrées externes d’analyse, de plugins, HIL et d’électricité.
  - category: new
    topic: { en: Commands, ro: Comenzi, de: Befehle, fr: Commandes }
    text:
      en: Let the agent run shell commands, monitor background work and stop it when finished.
      ro: Agentul poate executa comenzi shell, urmări lucrul în fundal și opri procesele la final.
      de: Der Agent führt Shell-Befehle aus, überwacht Hintergrundarbeit und beendet sie nach Abschluss.
      fr: L’agent exécute des commandes shell, surveille le travail en arrière-plan et l’arrête à la fin.
  - category: improved
    topic: { en: Permissions, ro: Permisiuni, de: Berechtigungen, fr: Permissions }
    text:
      en: Save command prefixes for Auto-edit; dangerous commands still ask outside Bypass.
      ro: Salvează prefixe pentru Editare automată; comenzile periculoase cer acord în afara Bypass.
      de: Befehlspräfixe für Automatisch bearbeiten speichern; gefährliche Befehle fragen außerhalb Bypass.
      fr: Enregistrez des préfixes pour Modification auto ; les commandes dangereuses demandent hors Bypass.
  - category: new
    topic: { en: Workbench, ro: Workbench, de: Workbench, fr: Workbench }
    text:
      en: Add folders for agent file access and command working directories; remove them to revoke access.
      ro: Adaugă foldere pentru fișierele și comenzile agentului; elimină-le pentru a retrage accesul.
      de: Ordner für Agentendateien und Befehle hinzufügen; Entfernen widerruft den Zugriff.
      fr: Ajoutez des dossiers pour les fichiers et commandes de l’agent ; supprimez-les pour retirer l’accès.
  - category: improved
    topic: { en: Runs, ro: Rulări, de: Läufe, fr: Exécutions }
    text:
      en: Run logs and terminal output follow your masking choice, off by default; agent reads stay masked.
      ro: Jurnalele și terminalul urmează mascarea aleasă, implicit oprită; citirile agentului rămân mascate.
      de: "Laufprotokolle und Terminal: Maskierung ist standardmäßig aus; Agentenlesezugriffe bleiben maskiert."
      fr: "Journaux et terminal : masquage désactivé par défaut ; lectures de l’agent toujours masquées."
