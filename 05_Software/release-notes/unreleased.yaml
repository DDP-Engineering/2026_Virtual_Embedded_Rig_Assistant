entries:
  - category: new
    topic: { en: Chat, ro: Conversație, de: Chat, fr: Chat }
    text:
      en: Open a cited packet from a saved capture in Wireshark Desktop.
      ro: Deschide în Wireshark Desktop un cadru citat dintr-o captură salvată.
      de: Ein zitiertes Paket aus einem gespeicherten Mitschnitt in Wireshark Desktop öffnen.
      fr: Ouvrez une trame citée d’une capture enregistrée dans Wireshark Desktop.
  - category: new
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Inspect saved captures offline with Wireshark, using filters and frame references.
      ro: Inspectează capturi offline cu Wireshark, folosind filtre și referințe la cadre.
      de: Gespeicherte Mitschnitte offline mit Wireshark, Filtern und Paketverweisen prüfen.
      fr: Inspectez les captures hors ligne avec Wireshark, des filtres et des références de trame.
  - category: new
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Analyze traffic, timing and streams in saved Wireshark captures with frame references.
      ro: Analizează traficul, timpii și fluxurile din capturi Wireshark, cu referințe la cadre.
      de: Verkehr, Antwortzeiten und Datenströme in Wireshark-Mitschnitten mit Paketverweisen prüfen.
      fr: Analysez le trafic, les temps de réponse et les flux Wireshark avec des renvois aux trames.
  - category: new
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Analyze DoIP, SOME/IP and Service Discovery in saved captures with PDU and frame references.
      ro: Analizează DoIP, SOME/IP și Service Discovery în capturi salvate, cu referințe la PDU-uri și cadre.
      de: DoIP, SOME/IP und Service Discovery in Mitschnitten mit PDU- und Paketverweisen prüfen.
      fr: Analysez DoIP, SOME/IP et Service Discovery avec des références aux PDU et aux trames.
  - category: new
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Analyze network protocols in saved captures and return redacted evidence with frame links.
      ro: Analizează protocoale din capturi salvate și obține dovezi mascate cu legături la cadre.
      de: Netzwerkprotokolle in Mitschnitten prüfen und maskierte Belege mit Paketverweisen erhalten.
      fr: Analysez les protocoles réseau et obtenez des preuves masquées avec des liens vers les trames.
  - category: new
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Split, merge and clean saved Wireshark captures while keeping the originals.
      ro: Împarte, combină și curăță capturi Wireshark salvate, păstrând originalele.
      de: Wireshark-Mitschnitte teilen, zusammenführen und bereinigen. Originale bleiben erhalten.
      fr: Divisez, fusionnez et nettoyez des captures Wireshark en conservant les originaux.
