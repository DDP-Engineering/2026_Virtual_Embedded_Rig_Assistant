version: Unreleased
date: null
entries:
  - category: new
    topic: { en: Images, ro: Imagini, de: Bilder, fr: Images }
    text:
      en: Set image limits and resend with fewer attachments when the provider rejects the request.
      ro: Configurează limitele imaginilor și retrimite cu mai puține atașamente după un refuz.
      de: Bildlimits einstellen und nach einer Ablehnung mit weniger Anhängen erneut senden.
      fr: Réglez les limites d’images et renvoyez avec moins de pièces jointes après un refus.
  - category: improved
    topic: { en: Sessions, ro: Sesiuni, de: Sitzungen, fr: Sessions }
    text:
      en: Search beside New session. Delegation tracks delivery and keeps the end of long replies.
      ro: Caută lângă Sesiune nouă. Agentul urmărește livrarea și păstrează finalul răspunsului delegat.
      de: Suche neben Neue Sitzung. Delegation verfolgt die Zustellung und behält das Antwortende.
      fr: Loupe près de Nouvelle session. La délégation suit la livraison et garde la fin des réponses.
  - category: improved
    topic: { en: Settings, ro: Setări, de: Einstellungen, fr: Paramètres }
    text:
      en: Manage delegated access and desktop notifications in Data & privacy.
      ro: Găsești accesul pentru sarcini delegate și notificările în Date și confidențialitate.
      de: Delegierten Zugriff und Desktop-Benachrichtigungen unter Daten & Datenschutz verwalten.
      fr: Gérez l’accès délégué et les notifications dans Données et confidentialité.
  - category: improved
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Plugin cards show relevant actions, with help in Details and reinstallation in More actions.
      ro: Cardurile arată acțiunile utile, cu ajutor în Detalii și reinstalare în Mai multe acțiuni.
      de: Plugin-Karten zeigen passende Aktionen, Hilfe in Details und Neuinstallation unter Weitere Aktionen.
      fr: L’aide est dans Détails et la réinstallation dans Plus d’actions.
  - category: improved
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Install verified official skills directly, with a compact confirmation for other packages.
      ro: Instalează direct skill-urile oficiale verificate, cu o confirmare scurtă pentru alte pachete.
      de: Geprüfte offizielle Skills direkt installieren und andere Pakete kompakt bestätigen.
      fr: Installez directement les compétences officielles vérifiées et confirmez les autres paquets.
  - category: improved
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Toggle plugins in a compact workbench list and open Details for agent tools and setup.
      ro: Activează pluginurile din lista compactă a bancului de lucru. Opțiunile sunt în Detalii.
      de: Plugins kompakt in der Werkbank auswählen und Werkzeuge unter Details einstellen.
      fr: Activez les plugins dans une liste compacte et réglez leurs outils dans Détails.
  - category: improved
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Turn a saved firmware comparison into a manual test plan with per-case readiness.
      ro: Transformă o comparație de firmware salvată într-un plan cu starea fiecărui caz.
      de: Aus einem gespeicherten Firmware-Vergleich einen Testplan mit Fallstatus erstellen.
      fr: Créez un plan de test depuis une comparaison enregistrée avec l’état de chaque cas.
  - category: fixed
    topic: { en: Plugins, ro: Pluginuri, de: Plugins, fr: Plugins }
    text:
      en: Firmware reports and plans cite exact lines. Plugin drafts are checked before approval.
      ro: Citări exacte în rapoarte și planuri. Pluginurile de probă sunt verificate înainte de aprobare.
      de: Berichte und Testpläne zitieren exakte Zeilen. Plugin-Entwürfe werden vor der Freigabe geprüft.
      fr: Rapports et plans citent les lignes exactes. Les plugins d’essai sont vérifiés avant approbation.
  - category: fixed
    topic: { en: Chat, ro: Conversație, de: Chat, fr: Chat }
    text:
      en: Stop responds promptly. Invalid replies stay in drafts. Reasoning errors appear above controls.
      ro: Stop răspunde prompt. Ciorna se păstrează. Erorile de reasoning apar deasupra comenzilor.
      de: Stopp reagiert rasch. Entwürfe bleiben. Reasoning-Fehler stehen über der Chatleiste.
      fr: Stop réagit vite. Le brouillon reste. Les erreurs de raisonnement s’affichent au-dessus du chat.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Files and artifacts keep every line. Agents can page through plans, skills and help.
      ro: Fișierele și artefactele păstrează liniile. Agentul citește pe pagini planuri, skill-uri și ajutor.
      de: Dateien und Artefakte behalten alle Zeilen. Pläne, Skills und Hilfe sind seitenweise lesbar.
      fr: Les fichiers et artefacts gardent chaque ligne. Plans, compétences et aide se lisent par pages.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Saves skip unchanged files, shorten long artifact notes, and confirm while history is pending.
      ro: Notele lungi se scurtează. Salvările identice evită rescrierea. Confirmarea nu așteaptă istoricul.
      de: Lange Notizen werden gekürzt. Identische Daten bleiben. Bestätigung auch bei offenem Verlauf.
      fr: Fichiers identiques préservés. Notes longues abrégées. Confirmation même si l’historique attend.
  - category: improved
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Large file changes can still be approved when the preview takes too long.
      ro: Modificările mari pot fi aprobate și când previzualizarea durează prea mult.
      de: Große Änderungen bleiben auch bei zu langer Vorschau-Berechnung freigabefähig.
      fr: Les modifications restent approuvables si le calcul de l’aperçu prend trop de temps.
  - category: improved
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Reading large text files and listing or searching large directories takes less time.
      ro: Citirea fișierelor text mari și listarea sau căutarea în directoare mari durează mai puțin.
      de: Große Textdateien lesen und große Ordner auflisten oder durchsuchen geht schneller.
      fr: Lire les gros fichiers texte et parcourir ou rechercher dans de grands dossiers est plus rapide.
  - category: fixed
    topic: { en: Terminal, ro: Terminal, de: Terminal, fr: Terminal }
    text:
      en: Terminal reads retain the tail and flag cuts. Idle output is sent once. Pastes at the limit work.
      ro: Terminalul păstrează finalul, arată tăierile, evită retrimiterile și acceptă lipirea la limită.
      de: Das Terminal meldet Kürzungen, sendet Ausgabe seltener und erlaubt Einfügen bis zum Limit.
      fr: Le terminal signale les coupes, évite les renvois et accepte les collages jusqu’à la limite.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: Overwrites keep line endings, BOM and encoding. VERA identifies UTF-16 text it cannot edit.
      ro: Suprascrierea păstrează sfârșiturile de linie, BOM-ul și codarea. Textul UTF-16 este semnalat.
      de: Überschreiben erhält Zeilenenden, BOM und Kodierung. VERA meldet nicht editierbares UTF-16.
      fr: L’écrasement garde fins de ligne, BOM et encodage. VERA signale l’UTF-16 non modifiable.
  - category: fixed
    topic: { en: Files, ro: Fișiere, de: Dateien, fr: Fichiers }
    text:
      en: File searches validate paths and filters, keep partial results, count fully and honor Stop.
      ro: Căutarea verifică filtrele, păstrează rezultate parțiale, dă totaluri și răspunde la Stop.
      de: Die Dateisuche prüft Filter, behält Teilergebnisse, zählt vollständig und reagiert auf Stopp.
      fr: La recherche vérifie les filtres, garde les résultats partiels, compte tout et répond à Stop.
  - category: fixed
    topic: { en: Commands, ro: Comenzi, de: Befehle, fr: Commandes }
    text:
      en: Command output keeps its tail after truncation or cancellation. VERA reports failures and timeouts.
      ro: Outputul păstrează finalul după trunchiere sau anulare. VERA raportează erorile și timeouturile.
      de: Ausgabe bleibt bei Abbruch erhalten. Start-/Stoppfehler und Zeitüberschreitungen werden gemeldet.
      fr: La sortie garde sa fin après annulation. Les échecs et les délais dépassés sont signalés.
  - category: improved
    topic: { en: Commands, ro: Comenzi, de: Befehle, fr: Commandes }
    text:
      en: Short commands start faster, even after reducing how many run logs are kept.
      ro: Comenzile scurte pornesc mai repede și după reducerea numărului de jurnale păstrate.
      de: Kurze Befehle starten auch nach dem Senken der Protokollanzahl schneller.
      fr: Les commandes courtes démarrent plus vite, même après réduction du nombre de journaux.
  - category: fixed
    topic: { en: Web access, ro: Acces web, de: Webzugriff, fr: Accès web }
    text:
      en: Browser and web citations stay intact. Exa is faster. Downloads stream to disk and report timeouts.
      ro: Citările web și din browser rămân întregi. Exa e mai rapid. Descărcările pe disc anunță timeoutul.
      de: Browser- und Webzitate bleiben intakt. Exa ist schneller. Downloads melden Zeitlimits.
      fr: Citations web et navigateur intactes. Exa accélère. Téléchargements sur disque et délais signalés.
  - category: fixed
    topic: { en: Documents, ro: Documente, de: Dokumente, fr: Documents }
    text:
      en: Document reads keep citations and pages aligned, and search omits outdated text.
      ro: Citările urmează textul livrat, iar căutarea omite fragmentele din surse modificate.
      de: Zitate folgen dem gelesenen Text. Die Suche lässt veraltete Ausschnitte aus.
      fr: Les citations suivent le texte lu et la recherche écarte les extraits périmés.
  - category: improved
    topic: { en: Documents, ro: Documente, de: Dokumente, fr: Documents }
    text:
      en: Large indexes search faster, document reads use less memory, and slow hybrid searches use keywords.
      ro: Indexuri mari mai rapide, citire cu mai puțină memorie și cuvinte-cheie când căutarea e lentă.
      de: Große Indizes suchen schneller. Lesen spart Speicher. Langsame Hybridsuchen nutzen Stichwörter.
      fr: Grands index plus rapides, lecture moins gourmande en mémoire et mots-clés si la recherche tarde.
