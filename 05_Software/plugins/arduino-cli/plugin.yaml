format: 1
id: arduino-cli
version: 0.3.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Arduino CLI
summary: Build an Arduino sketch, upload it and read what the board prints in one call, with a pinned arduino-cli in VERA's own environment.
description: Native Arduino sketches with a pinned arduino-cli - install cores and libraries (the latest or a named version, with their dependencies) into VERA's own Arduino environment, compile a sketch incrementally into a traceable run folder (flash and RAM, the libraries and core versions used, hashes), upload that build to the board and read its serial output, all in one call when asked. The board comes from the call, from the sketch's sketch.yaml or from the one board that is connected, and a missing header names the libraries that provide it. The Arduino IDE's own folders are never touched; no daemon, bootloader, fuses or OTA.
translations:
  ro:
    summary: "Compilează un sketch Arduino, îl încarcă și citește ce afișează placa, într-un singur apel, cu un arduino-cli fixat în mediul propriu al VERA."
    description: "Sketch-uri Arduino native cu un arduino-cli fixat - instalează core-uri și biblioteci (ultima versiune sau una numită, cu dependențele lor) în mediul Arduino propriu al VERA, compilează incremental un sketch într-un folder de rulare trasabil (flash și RAM, versiunile bibliotecilor și ale core-ului folosite, hash-uri), încarcă acel build pe placă și îi citește ieșirea serială, totul într-un singur apel când i se cere. Placa vine din apel, din sketch.yaml al sketch-ului sau de la singura placă conectată, iar un header lipsă numește bibliotecile care îl oferă. Folderele proprii ale Arduino IDE nu sunt atinse niciodată; fără daemon, bootloader, fuse-uri sau OTA."
  de:
    summary: "Einen Arduino-Sketch bauen, hochladen und lesen, was das Board ausgibt, in einem Aufruf, mit festgelegtem arduino-cli in VERAs eigener Umgebung."
    description: "Native Arduino-Sketches mit festgelegtem arduino-cli - Cores und Bibliotheken (die neueste oder eine benannte Version, mit ihren Abhängigkeiten) in VERAs eigene Arduino-Umgebung installieren, einen Sketch inkrementell in einen nachvollziehbaren Laufordner kompilieren (Flash und RAM, verwendete Bibliotheks- und Core-Versionen, Hashes), diesen Build auf das Board hochladen und dessen serielle Ausgabe lesen, auf Wunsch alles in einem Aufruf. Das Board kommt aus dem Aufruf, aus der sketch.yaml des Sketches oder vom einzigen angeschlossenen Board, und ein fehlender Header nennt die Bibliotheken, die ihn bereitstellen. Die Ordner der Arduino IDE werden nie berührt; kein Daemon, kein Bootloader, keine Fuses und kein OTA."
  fr:
    summary: "Compilez un sketch Arduino, téléversez-le et lisez ce que la carte affiche, en un seul appel, avec un arduino-cli épinglé dans l’environnement propre à VERA."
    description: "Sketches Arduino natifs avec un arduino-cli épinglé - installer des cores et des bibliothèques (la dernière version ou une version nommée, avec leurs dépendances) dans l’environnement Arduino propre à VERA, compiler un sketch de façon incrémentale dans un dossier d’exécution traçable (flash et RAM, versions des bibliothèques et du core utilisées, hashs), téléverser ce build sur la carte et lire sa sortie série, le tout en un seul appel sur demande. La carte vient de l’appel, du sketch.yaml du sketch ou de la seule carte connectée, et un en-tête manquant nomme les bibliothèques qui le fournissent. Les dossiers propres à l’IDE Arduino ne sont jamais touchés ; pas de démon, de bootloader, de fusibles ni d’OTA."
ecosystem: arduino
platforms: [windows-x64, linux-x64]
requires: [serial-monitor]
docs: [README.md, "https://docs.arduino.cc/arduino-cli/"]
programs:
  arduino-cli:
    install:
      find:
        windows: ["%PATH%"]
        linux: ["$PATH", "/usr/local/bin/arduino-cli", "/usr/bin/arduino-cli"]
      hint: "Choose Install programs for the pinned arduino-cli 1.6.0, or install arduino-cli 1.6 or newer (below 2) yourself from https://arduino.github.io/arduino-cli/latest/installation/."
      download:
        windows-x64:
          url: https://github.com/arduino/arduino-cli/releases/download/v1.6.0/arduino-cli_1.6.0_Windows_64bit.zip
          sha256: 2769b9b282ce597db9679d8ec14d726d57004ca4205ef4d7a795bf36b6cdc9d8
          bytes: 20404890
          path: arduino-cli.exe
        linux-x64:
          url: https://github.com/arduino/arduino-cli/releases/download/v1.6.0/arduino-cli_1.6.0_Linux_64bit.tar.gz
          sha256: 321ee249f44c78053234fec0f36101092bc6021bf24939e15e0cc2449c5ed250
          bytes: 20111675
          path: arduino-cli
      preferDownload: true
    version: { args: [version], match: 'Version: (\d+\.\d+\.\d+)', range: '>=1.6,<2' }
    timeout: 60
  arduino-tool:
    subcommandHelp: { flag: --help, commands: [install, attach, upload] }
    install: { script: scripts/arduino_tool.py }
    version: { args: [--version], match: '^arduino-tool (\d+\.\d+\.\d+)' }
    timeout: 1800
    uses: [arduino-cli]
# arduino-cli with its default configuration reads and changes the Arduino IDE's folders and installs profile
# platforms during a compile, so the agent reaches it only through arduino-tool, which runs it with VERA's own
# environment and an offline configuration outside install; `arduino-tool cli -- ...` passes any other command on.
rules:
  # Every direct command is blocked (the highest risk of overlapping rules wins, so no exception is possible);
  # VERA's provisioner probes the version without these rules.
  - match: "arduino-cli *"
    risk: blocked
    note: "arduino-cli by itself would use the Arduino IDE's folders. Use arduino-tool, which runs it in VERA's own Arduino environment; `arduino-tool cli -- <command>` runs any arduino-cli command there."
  - { match: "arduino-tool {--version,--help,-h}", risk: safe }
  - match: "arduino-tool {inspect,report,clean} *"
    risk: safe
    note: Reads a sketch, VERA's Arduino environment or run folders; report writes a new run folder, clean removes only VERA's build cache, kept build folders and the staging folders of ended runs.
  - match: "arduino-tool boards *"
    risk: safe
    note: Looks up installed board definitions offline, or lists the serial ports with the installed discovery tools (which also browse the local network by mDNS; network ports are ignored).
  - match: "arduino-tool {cores,libraries} *"
    risk: safe
    note: Lists or searches the installed packages and the downloaded indexes offline.
  - match: "arduino-tool compile *"
    risk: safe
    note: Runs the installed core's compiler, recipes and hooks on this computer on a copy of the sketch and writes a new run folder; it never installs anything.
    timeout: 1800
  - match: "arduino-tool install *"
    risk: device-read
    note: Downloads from Arduino's index or the named https index into VERA's own Arduino environment - the named core or libraries, the latest version unless one is given, with a library's dependencies and without post-install scripts; the Arduino IDE is not changed.
    timeout: 3600
  - match: "arduino-tool attach *"
    risk: device-read
    note: Writes the sketch's board and port into its sketch.yaml, where later compiles and uploads find them.
  - match: "arduino-tool upload *"
    risk: device-write
    note: Writes the verified binary of the named compile run to the board's flash; the new firmware starts at once and may drive the board's outputs. With --watch it then reads the board's serial port. With --programmer it also overwrites the bootloader.
    timeout: 900
  - match: "arduino-tool compile * --upload *"
    risk: device-write
    note: Compiles the sketch and, when the build passes, writes it to the board's flash; the new firmware starts at once and may drive the board's outputs. With --watch it then reads the board's serial port.
    timeout: 2700
  - match: "arduino-tool {upload,compile} * --programmer *"
    risk: irreversible
    note: An upload through a programmer overwrites the board's bootloader; later uploads over USB need the bootloader burned again with a programmer.
  - match: "arduino-tool examples *"
    risk: safe
    note: Lists the example sketches of the installed libraries.
  - match: "arduino-tool examples copy *"
    risk: device-read
    note: Copies one example of an installed library into the workbench as a new sketch folder; nothing is overwritten.
  - match: "arduino-tool clean * --runs *"
    risk: device-read
    note: Removes arduino-tool's run folders (compile and upload results with their binaries) from the workbench, except the newest ones.
  - match: "arduino-tool cli *"
    risk: device-write
    note: Runs the arduino-cli command after `--` as it is, in VERA's own Arduino environment and in the workbench; depending on the command it may change the environment, the workbench or the board.
    timeout: 1800
  - match: "arduino-tool cli * {burn-bootloader,--programmer,-P} *"
    risk: irreversible
    note: Burning a bootloader or uploading through a programmer overwrites the board's bootloader and fuses.
