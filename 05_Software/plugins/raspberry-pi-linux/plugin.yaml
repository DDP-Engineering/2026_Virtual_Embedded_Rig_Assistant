format: 1
id: raspberry-pi-linux
version: 0.2.1
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Raspberry Pi Linux projects
summary: Run projects, finite tasks and user services on a Raspberry Pi over a pinned SSH connection.
description: Projects, finite tasks and user services on a Raspberry Pi (Raspberry Pi OS 12 64-bit) that VERA reaches over SSH from this computer - the board is a linux-board entry of lab/resources.json whose host key is pinned by fingerprint (a changed key is refused, never accepted), whose identity, unprivileged user and remote root are checked, and whose login uses a key of the system SSH agent. A small helper installed explicitly on the board performs finite operations - deploy a hashed candidate and apply only approved files, run a declared task with a remote handle, PID and budget, start, stop and read listed user services and their logs. No shell, sudo, system service, raw GPIO/I2C/SPI, OS provisioning or reboot.
translations:
  ro:
    summary: "Rulează proiecte, sarcini finite și servicii de utilizator pe un Raspberry Pi, printr-o conexiune SSH fixată."
    description: "Proiecte, sarcini finite și servicii de utilizator pe un Raspberry Pi (Raspberry Pi OS 12 pe 64 de biți) pe care VERA îl accesează prin SSH de pe acest computer - placa este o intrare linux-board din lab/resources.json, cu cheia de host fixată prin amprentă (o cheie schimbată este refuzată, niciodată acceptată), cu identitatea, utilizatorul neprivilegiat și folderul rădăcină la distanță verificate și cu autentificare printr-o cheie din agentul SSH al sistemului. Un helper mic, instalat explicit pe placă, face operații finite - implementează un candidat cu hash și aplică doar fișierele aprobate, rulează o sarcină declarată cu un handle la distanță, PID și buget, pornește, oprește și citește serviciile de utilizator listate și logurile lor. Fără shell, sudo, servicii de sistem, GPIO/I2C/SPI brut, provizionare de sistem sau repornire."
  de:
    summary: "Projekte, begrenzte Aufgaben und Benutzerdienste auf einem Raspberry Pi über eine festgelegte SSH-Verbindung ausführen."
    description: "Projekte, begrenzte Aufgaben und Benutzerdienste auf einem Raspberry Pi (Raspberry Pi OS 12, 64-Bit), den VERA von diesem Computer über SSH erreicht - das Board ist ein linux-board-Eintrag in lab/resources.json, dessen Host-Schlüssel per Fingerabdruck festgelegt ist (ein geänderter Schlüssel wird abgelehnt, nie akzeptiert), dessen Identität, nicht privilegierter Benutzer und Remote-Stammordner geprüft werden und dessen Anmeldung einen Schlüssel des SSH-Agenten des Systems nutzt. Ein explizit auf dem Board installiertes Hilfsprogramm führt begrenzte Operationen aus: einen gehashten Kandidaten übertragen und nur freigegebene Dateien anwenden, eine deklarierte Aufgabe mit Remote-Handle, PID und Budget ausführen, aufgelistete Benutzerdienste starten, stoppen und samt Logs lesen. Keine Shell, kein sudo, keine Systemdienste, kein Raw-GPIO/I2C/SPI, keine OS-Einrichtung und kein Neustart."
  fr:
    summary: "Exécutez des projets, des tâches finies et des services utilisateur sur un Raspberry Pi via une connexion SSH épinglée."
    description: "Projets, tâches finies et services utilisateur sur un Raspberry Pi (Raspberry Pi OS 12 64 bits) que VERA joint en SSH depuis cet ordinateur - la carte est une entrée linux-board de lab/resources.json dont la clé d’hôte est épinglée par empreinte (une clé modifiée est refusée, jamais acceptée), dont l’identité, l’utilisateur non privilégié et la racine distante sont vérifiés, et dont la connexion utilise une clé de l’agent SSH du système. Un petit utilitaire installé explicitement sur la carte effectue des opérations finies - déployer un candidat haché et n’appliquer que les fichiers approuvés, exécuter une tâche déclarée avec un handle distant, un PID et un budget, démarrer, arrêter et lire les services utilisateur listés et leurs journaux. Pas de shell, sudo, service système, GPIO/I2C/SPI brut, provisionnement du système ni redémarrage."
ecosystem: linux
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://www.raspberrypi.com/documentation/computers/remote-access.html", "https://pypi.org/project/asyncssh/2.24.1/"]
settings:
  lab-resources:
    kind: workbench-file
    path: lab/resources.json
    format: lab-resources
    description: The bench registry; declares the board (linux-board) with its host, pinned host key, user, identity and remote root that calls name by alias.
  pi-project:
    kind: workbench-file
    path: "*/vera-pi.json"
    format: json
    optional: true
    description: A project manifest in a project folder of the workbench - the files to deploy, the tasks it may run and the user services it may start.
  ssh-agent:
    kind: value
    value: System SSH agent (SSH_AUTH_SOCK; on Windows the OpenSSH Authentication Agent or Pageant)
    description: The login key stays in the system SSH agent; VERA never handles a password or a key file.
programs:
  pi-tool:
    subcommandHelp: { flag: --help, commands: [install-helper, deploy-candidate, apply-candidate, run-task, service-start, service-stop, stop-owned] }
    install: { script: scripts/pi_tool.py }
    version: { args: [--version], match: '^pi-tool (\d+\.\d+\.\d+)' }
    timeout: 120
    env:
      PI_REGISTRY: "${workbench}/lab/resources.json"
    resources: { option: --board, kinds: [linux-board], grace: 10, cleanup: [stop-owned], cleanupTimeout: 60 }
    # The login key stays in the system SSH agent; pi-tool receives only SSH_AUTH_SOCK (on Windows it also finds
    # Pageant or the OpenSSH agent pipe) and never a password or key file.
    sshAgent: true
# Every board call verifies the pinned host key before authenticating, then runs one of two constant commands on the
# board (install or run the helper of this version); operations, paths and arguments travel on stdin and never reach
# the board's shell. Project code a task or service runs may actuate hardware: the project manifest classifies it.
rules:
  - { match: "pi-tool {--version,--help,-h}", risk: safe }
  - match: "pi-tool {capabilities,inspect-project,report} *"
    risk: safe
    note: Offline. Describes the tool, reads a project manifest and hashes its files, or summarizes run folders into a new run folder; nothing is contacted.
  - match: "pi-tool {check-host-key,identify,task-status,service-status,collect-logs} *"
    risk: device-read
    note: Connects to the declared board over SSH (check-host-key stops before logging in) and reads facts, task or service state and logs; nothing on the board is changed.
  - match: "pi-tool install-helper *"
    risk: device-write
    note: Writes VERA's remote helper of this version into ~/.local/share/vera-pi/ of the board user's home, after checking its SHA-256. No download on the board and no shell script.
  - match: "pi-tool deploy-candidate *"
    risk: device-write
    note: Uploads the project's files into a staging folder below the board's remote root (.vera-pi/candidates) and compares them with the deployed project; no project file on the board is changed.
  - match: "pi-tool apply-candidate *"
    risk: device-write
    note: Replaces the new and changed files of the approved candidate.json in the board's project folder after checking every hash; files changed on the board meanwhile are left alone, and no file is deleted. Show the user the candidate's file list first.
    timeout: 600
  - match: "pi-tool apply-candidate * --overwrite *"
    risk: irreversible
    note: Also replaces the named files that were changed on the board since VERA last applied them; those changes are lost.
    timeout: 600
  - match: "pi-tool run-task *"
    risk: device-write
    note: Runs a task the project manifest declares in the board's project folder under a remote supervisor with the declared budget; project code can move, switch or drive hardware attached to the board (see the manifest's hardware classification). Stop ends the task and confirms it.
    timeout: 3600
  - match: "pi-tool {service-start,service-stop} *"
    risk: device-write
    note: Starts or stops a user service the project manifest lists (systemctl --user, never sudo or a system service); a started service may keep running after the run and may actuate hardware.
  - match: "pi-tool stop-owned *"
    risk: device-write
    note: Stops every task VERA started below the board's remote root that still runs, after checking each recorded PID, start time and boot; VERA runs it as the cleanup after Stop, timeout or a lost connection.
