format: 1
id: ngspice
version: 0.3.1
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: ngspice circuit simulation
summary: Reproducible local circuit simulation with ngspice - analyses, sweeps, Monte Carlo and pass/fail.
description: Reproducible local circuit simulation with ngspice - operating point, DC, AC, transient and noise analyses on your netlist and local models, measurements over declared windows (ripple, overshoot, settling, RMS, average power), pass/fail criteria, parameter and temperature sweeps, seeded Monte Carlo, run comparison and reports. Netlists are checked before the engine runs and every run writes a new folder with the log, series, plot and report. Uses your ngspice or, on Windows, installs the pinned official ngspice-47.
translations:
  ro:
    summary: "Simulare locală reproductibilă de circuite cu ngspice - analize, baleieri, Monte Carlo și trecut/picat."
    description: "Simulare locală reproductibilă de circuite cu ngspice - analize de punct de funcționare, DC, AC, tranzitorii și de zgomot pe netlistul tău și modele locale, măsurători pe ferestre declarate (riplu, supracreștere, stabilizare, RMS, putere medie), criterii de trecere/picare, baleieri de parametri și temperatură, Monte Carlo cu seed, compararea rulărilor și rapoarte. Netlisturile sunt verificate înainte să ruleze motorul, iar fiecare rulare scrie un folder nou cu logul, seriile, graficul și raportul. Folosește ngspice-ul tău sau, pe Windows, instalează build-ul oficial fixat ngspice-47."
  de:
    summary: "Reproduzierbare lokale Schaltungssimulation mit ngspice - Analysen, Sweeps, Monte Carlo und Bestanden/Nicht bestanden."
    description: "Reproduzierbare lokale Schaltungssimulation mit ngspice - Arbeitspunkt-, DC-, AC-, Transienten- und Rauschanalysen Ihrer Netzliste mit lokalen Modellen, Messungen über deklarierte Fenster (Welligkeit, Überschwingen, Einschwingen, Effektivwert, mittlere Leistung), Bestanden/Nicht-bestanden-Kriterien, Parameter- und Temperatur-Sweeps, Monte Carlo mit festem Seed, Vergleich von Läufen und Berichte. Netzlisten werden geprüft, bevor der Simulator läuft, und jeder Lauf schreibt einen neuen Ordner mit Log, Messreihen, Plot und Bericht. Verwendet Ihr ngspice oder installiert unter Windows das festgelegte offizielle ngspice-47."
  fr:
    summary: "Simulation locale et reproductible de circuits avec ngspice - analyses, balayages, Monte Carlo et réussite/échec."
    description: "Simulation locale et reproductible de circuits avec ngspice - analyses de point de fonctionnement, DC, AC, transitoires et de bruit sur votre netlist et vos modèles locaux, mesures sur des fenêtres déclarées (ondulation, dépassement, établissement, RMS, puissance moyenne), critères de réussite/échec, balayages de paramètres et de température, Monte Carlo avec graine, comparaison d’exécutions et rapports. Les netlists sont vérifiées avant l’exécution du moteur et chaque exécution écrit un nouveau dossier avec le journal, les séries, le graphique et le rapport. Utilise votre ngspice ou, sous Windows, installe le ngspice-47 officiel épinglé."
ecosystem: electronics
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://ngspice.sourceforge.io/docs.html"]
programs:
  ngspice:
    install:
      find:
        windows: ["C:/Spice64/bin/ngspice_con.exe", "%ProgramFiles%/Spice64/bin/ngspice_con.exe", "%LOCALAPPDATA%/Programs/Spice64/bin/ngspice_con.exe"]
        linux: ["$PATH", "/usr/bin/ngspice", "/usr/local/bin/ngspice"]
      hint: "On Windows choose Install programs for the pinned official ngspice-47, or extract the official build to C:\\Spice64. On Ubuntu run: sudo apt install ngspice."
      download:
        windows-x64:
          url: https://downloads.sourceforge.net/project/ngspice/ng-spice-rework/47/ngspice-47_64.7z
          sha256: 59225971bd68cdd1199443649aa4615a9e6d684933f205ab49006a3942518f5a
          bytes: 13814879
          path: Spice64/bin/ngspice_con.exe
    version: { args: [-v], match: 'ngspice-(\d+)', range: '>=42' }
    timeout: 60
  ngspice-tool:
    install: { script: scripts/ngspice_tool.py }
    version: { args: [--version], match: '^ngspice-tool (\d+\.\d+\.\d+)' }
    timeout: 1800
    uses: [ngspice]
# A netlist's control block can run shell commands and write files anywhere, so the agent reaches the engine only
# through ngspice-tool, which checks the netlist and its includes first and appends its own control block.
rules:
  # Every direct engine command is blocked (the highest risk of overlapping rules wins, so no exception is possible);
  # ngspice-tool reports the engine version and VERA's provisioner probes it without these rules.
  - match: "ngspice *"
    risk: blocked
    note: "A netlist's control block can run shell commands and write files. Use ngspice-tool, which checks the netlist and its includes, runs ngspice in batch mode on a copy and writes a new run folder."
  - { match: "ngspice-tool {--version,--help,-h}", risk: safe }
  - match: "ngspice-tool {validate,run,sweep,measure,compare,report} *"
    risk: safe
    note: Host simulation. Checks the netlist and its includes before the engine runs, runs ngspice in batch mode on a copy and creates a new run folder under the results directory in the workbench; it never changes the netlist or its models.
    timeout: 1800
