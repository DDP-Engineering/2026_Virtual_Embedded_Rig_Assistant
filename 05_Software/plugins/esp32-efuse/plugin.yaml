format: 1
id: esp32-efuse
version: 0.2.0
name: ESP32 eFuses and image security
summary: Review ESP32 eFuses and prepare secure-boot keys and encrypted images; burns are permanent.
description: Review Espressif eFuses and explicitly requested permanent changes with esp32-efuse-review. Read summaries and raw eFuses with espefuse; prepare local keys, signatures and encrypted images with espsecure. Burns are irreversible and can brick a chip. Enable this Security plugin only when needed.
translations:
  ro:
    summary: "Examinează eFuse-urile ESP32 și pregătește chei de secure boot și imagini criptate; arderile sunt permanente."
    description: "Examinează eFuse-urile Espressif și modificările permanente cerute explicit, cu esp32-efuse-review. Citește rezumate și eFuse-uri brute cu espefuse; pregătește local chei, semnături și imagini criptate cu espsecure. Arderile sunt ireversibile și pot distruge definitiv un cip. Activează acest plugin de securitate doar când este nevoie."
  de:
    summary: "ESP32-eFuses prüfen und Secure-Boot-Schlüssel sowie verschlüsselte Images vorbereiten; Brennvorgänge sind dauerhaft."
    description: "Espressif-eFuses und ausdrücklich angeforderte dauerhafte Änderungen mit esp32-efuse-review prüfen. Zusammenfassungen und rohe eFuses mit espefuse lesen; lokale Schlüssel, Signaturen und verschlüsselte Images mit espsecure vorbereiten. Brennvorgänge sind irreversibel und können einen Chip unbrauchbar machen. Aktivieren Sie dieses Sicherheits-Plugin nur bei Bedarf."
  fr:
    summary: "Examinez les eFuses ESP32 et préparez des clés de secure boot et des images chiffrées ; les programmations sont définitives."
    description: "Examinez les eFuses Espressif et effectuez les modifications permanentes explicitement demandées avec esp32-efuse-review. Lisez les résumés et les eFuses bruts avec espefuse ; préparez localement des clés, des signatures et des images chiffrées avec espsecure. Les programmations sont irréversibles et peuvent rendre une puce inutilisable. N’activez ce plugin de sécurité qu’en cas de besoin."
ecosystem: esp32
platforms: [windows-x64, linux-x64]
programs:
  espefuse:
    install: { pip: "esptool>=5,<6" }
    version: { args: [--help], match: 'espefuse v(\d+\.\d+\.\d+)', range: ">=5,<6" }
    timeout: 120
  espsecure:
    install: { pip: "esptool>=5,<6" }
    version: { args: [--help], match: 'espsecure v(\d+\.\d+\.\d+)', range: ">=5,<6" }
    timeout: 120
rules:
  - { match: "espefuse {--help,-h}", risk: safe }
  - match: "espefuse * {summary,dump,check-error,get-custom-mac,adc-info} *"
    risk: device-read
    note: Resets the chip into its bootloader when connecting to hardware; --virt uses virtual eFuses without a chip connection.
  - match: "espefuse * {burn-*,write-protect-efuse,read-protect-efuse,set-flash-voltage} *"
    risk: irreversible
    note: eFuse bits are one-time programmable. The change can never be undone and may brick the chip.
  - match: "espsecure *"
    risk: safe
    note: Works on local key and image files only; safe describes hardware risk, not filesystem confinement.
  - match: "espsecure * {--hsm,--hsm-config} *"
    risk: blocked
    note: This plugin supports local key and image files only. External HSM operations are outside its scope.
docs:
  - https://docs.espressif.com/projects/esptool/en/latest/esp32/espefuse/index.html
  - https://docs.espressif.com/projects/esptool/en/latest/esp32/espsecure/index.html
