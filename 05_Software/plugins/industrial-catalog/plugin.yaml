format: 1
id: industrial-catalog
version: 0.1.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Industrial catalog and documented selection
summary: Keep manufacturer data for LV switchgear, protection and drives with cited values, and select on firm requirements.
description: Choose low-voltage equipment (contactors, motor circuit breakers, protection, drives, PLC and I/O modules, accessories) on manufacturer evidence. Catalogs are workbench files that keep the manufacturer order code, variant and accessories apart from distributor SKUs, with every parameter cited by source, revision and page or table under its conditions. VERA's industrial_catalog tool selects on firm requirements, explains each elimination, marks absent or unconfirmed values unknown and applies coordination tables only to the products and voltages they name. Nothing is scraped, ordered or replaced in a schematic.
translations:
  ro:
    summary: "Păstrează datele producătorilor pentru aparataj JT, protecții și variatoare cu valori citate și selectează pe cerințe ferme."
    description: "Alege echipamente de joasă tensiune (contactoare, disjunctoare pentru motoare, protecții, variatoare, module PLC și I/O, accesorii) pe baza dovezilor de la producător. Cataloagele sunt fișiere din workbench care păstrează codul de comandă al producătorului, varianta și accesoriile separat de SKU-urile distribuitorilor, fiecare parametru fiind citat prin sursă, revizie și pagină sau tabel, în condițiile sale. Instrumentul industrial_catalog al VERA selectează pe cerințe ferme, explică fiecare eliminare, marchează valorile absente sau neconfirmate ca necunoscute și aplică tabelele de coordonare doar produselor și tensiunilor pe care le numesc. Nu se extrage, nu se comandă și nu se înlocuiește nimic într-o schemă."
  de:
    summary: "Hält Herstellerdaten zu NS-Schaltgeräten, Schutz und Antrieben mit zitierten Werten bereit und wählt anhand fester Anforderungen aus."
    description: "Wählt Niederspannungsgeräte (Schütze, Motorschutzschalter, Schutzgeräte, Antriebe, SPS- und E/A-Module, Zubehör) anhand von Herstellernachweisen aus. Kataloge sind Workbench-Dateien, die Bestellnummer des Herstellers, Variante und Zubehör getrennt von Händler-Artikelnummern führen; jeder Parameter ist mit Quelle, Revision und Seite oder Tabelle unter seinen Bedingungen belegt. Das VERA-Werkzeug industrial_catalog wählt anhand fester Anforderungen aus, erklärt jeden Ausschluss, markiert fehlende oder unbestätigte Werte als unbekannt und wendet Koordinationstabellen nur auf die Produkte und Spannungen an, die sie nennen. Nichts wird abgegriffen, bestellt oder in einem Schaltplan ersetzt."
  fr:
    summary: "Conserve les données fabricant de l’appareillage BT, des protections et des variateurs avec des valeurs citées et sélectionne selon des exigences fermes."
    description: "Choisit des équipements basse tension (contacteurs, disjoncteurs-moteurs, protections, variateurs, modules d’automate et d’E/S, accessoires) d’après les preuves du fabricant. Les catalogues sont des fichiers du banc de travail qui tiennent la référence de commande du fabricant, la variante et les accessoires à part des SKU des distributeurs, chaque paramètre étant cité par source, révision et page ou tableau, dans ses conditions. L’outil industrial_catalog de VERA sélectionne selon des exigences fermes, explique chaque élimination, marque les valeurs absentes ou non confirmées comme inconnues et n’applique les tableaux de coordination qu’aux produits et tensions qu’ils nomment. Rien n’est aspiré, commandé ni remplacé dans un schéma."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
docs: [README.md]
