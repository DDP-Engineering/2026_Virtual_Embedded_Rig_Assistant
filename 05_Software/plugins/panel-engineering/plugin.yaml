id: panel-engineering
version: 0.1.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Panel engineering
summary: "Check control panels: BOM with accessories, terminals, 24 V budget, 2D rail layout, dissipation and enclosure temperature, plus an assembly verification report."
description: "Plan and check a control panel with VERA's panel_engineering tools. A panel file describes the enclosure and plate, rails, ducts, zones with your segregation and access rules, equipment, terminal strips, the 24 V supply, scenarios, reserve and thermal conditions. The check reconciles the BOM with the motor-starting assemblies, the electrical model and QElectroTech schematics, accepts an accessory only when the catalog lists it for its host, counts terminals, budgets the 24 V supply, places each device on the rails with its real dimensions and flags collisions or missing data, sums the losses per scenario and estimates the enclosure air temperature with the stated heat-balance method. Short-circuit withstand and busbars stay not evaluated without assembly data. The verification report shows what is covered and what stays open; no IEC 61439 conformity is claimed. Views draft equipment, show what a changed device affects and export the BOM (CSV) and the layout (SVG)."
translations:
  ro:
    summary: "Verifică tablouri de comandă: materiale cu accesorii, borne, buget 24 V, amplasare 2D pe șine, disipare și temperatura carcasei, plus raport de verificare."
    description: "Planifică și verifică un tablou de comandă cu instrumentele panel_engineering ale VERA. Un fișier de tablou descrie carcasa și placa, șinele, canalele, zonele cu regulile de segregare și acces, aparatajul, șirurile de borne, sursa de 24 V, scenariile, rezerva și condițiile termice. Verificarea reconciliază lista de materiale cu ansamblurile de pornire, modelul electric și schemele QElectroTech, acceptă un accesoriu doar când catalogul îl listează pentru aparatul gazdă, numără bornele, face bugetul sursei de 24 V, amplasează fiecare aparat pe șine cu dimensiunile reale și semnalează coliziuni sau date lipsă, însumează pierderile pe scenarii și estimează temperatura aerului din carcasă cu metoda de bilanț termic declarată. Rezistența la scurtcircuit și barele rămân neevaluate fără datele ansamblului. Raportul arată ce este acoperit și ce rămâne deschis; nu se declară conformitate IEC 61439. Vizualizările propun aparatajul, arată ce afectează un aparat schimbat și exportă lista (CSV) și amplasarea (SVG)."
  de:
    summary: "Prüft Schaltschränke: Stückliste mit Zubehör, Klemmen, 24-V-Bilanz, 2D-Aufbau auf Tragschienen, Verlustleistung und Gehäusetemperatur sowie Nachweisbericht."
    description: "Plant und prüft einen Schaltschrank mit den panel_engineering-Werkzeugen. Eine Schrankdatei beschreibt Gehäuse und Montageplatte, Tragschienen, Kanäle, Zonen mit Ihren Trenn- und Zugangsregeln, Betriebsmittel, Klemmleisten, die 24-V-Versorgung, Szenarien, Reserve und thermische Bedingungen. Die Prüfung gleicht die Stückliste mit den Starterbaugruppen, dem Elektromodell und QElectroTech-Plänen ab, akzeptiert Zubehör nur, wenn der Katalog es für das Trägergerät nennt, zählt Klemmen, bilanziert die 24-V-Versorgung, setzt jedes Gerät mit seinen echten Maßen auf die Schienen und meldet Kollisionen oder fehlende Daten, summiert die Verluste je Szenario und schätzt die Lufttemperatur im Gehäuse mit der angegebenen Wärmebilanz. Kurzschlussfestigkeit und Sammelschienen bleiben ohne Baugruppendaten unbewertet. Der Bericht zeigt Abgedecktes und Offenes; keine IEC-61439-Konformität wird erklärt. Ansichten entwerfen Betriebsmittel, zeigen Folgen eines geänderten Geräts und exportieren Stückliste (CSV) und Aufbau (SVG)."
  fr:
    summary: "Vérifie des armoires : nomenclature, accessoires, bornes, bilan 24 V, implantation 2D sur rails, dissipation, température et rapport de vérification."
    description: "Planifie et vérifie une armoire avec les outils panel_engineering. Un fichier d'armoire décrit l'enveloppe et la plaque, les rails, les goulottes, les zones avec vos règles de séparation et d'accès, équipements, borniers, alimentation 24 V, scénarios, réserve et conditions thermiques. La vérification rapproche la nomenclature des ensembles de démarrage, du modèle électrique et des schémas QElectroTech, n'accepte un accessoire que si le catalogue le liste pour son hôte, compte les bornes, fait le bilan 24 V, place chaque appareil sur les rails avec ses vraies dimensions et signale collisions ou données manquantes, somme les pertes par scénario et estime la température de l'air de l'enveloppe par la méthode de bilan thermique. Court-circuit et jeux de barres restent non évalués sans données d'ensemble. Le rapport montre ce qui reste ouvert ; aucune conformité CEI 61439 n'est déclarée. Les vues proposent les équipements, montrent l'effet d'un changement et exportent la nomenclature (CSV) et l'implantation (SVG)."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
docs: [README.md]
