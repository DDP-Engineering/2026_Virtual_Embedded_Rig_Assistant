format: 1
id: wokwi
version: 0.2.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Wokwi cloud simulation
summary: Run firmware simulations and scenarios in Wokwi's cloud with a pinned wokwi-cli after approval.
description: Firmware simulation jobs and finite scenarios in Wokwi's cloud with the pinned wokwi-cli 0.29.1 - inspect a project, validate its diagram offline, prepare a job of exact copies (firmware, ELF, diagram, scenario) bound by hash with the send list, account, limits and time budget, run it once in the cloud after approval, then collect pass, fail, timeout and error outcomes with serial output, VCD and screenshots, and report. The Wokwi token stays in VERA's credential store and reaches only an approved run of this plugin on its input. A cloud simulation is not an electrical test or a test on the real board.
translations:
  ro:
    summary: "Rulează simulări de firmware și scenarii în cloudul Wokwi cu un wokwi-cli fixat, după aprobare."
    description: "Joburi de simulare de firmware și scenarii finite în cloudul Wokwi, cu wokwi-cli 0.29.1 fixat - inspectează un proiect, îi validează diagrama offline, pregătește un job din copii exacte (firmware, ELF, diagramă, scenariu) legate prin hash, cu lista de trimitere, contul, limitele și bugetul de timp, îl rulează o singură dată în cloud după aprobare, apoi colectează rezultatele trecut, picat, timeout și eroare cu ieșirea serială, VCD și capturi de ecran și face un raport. Tokenul Wokwi rămâne în depozitul de credențiale al VERA și ajunge doar la o rulare aprobată a acestui plugin, pe intrarea programului. O simulare în cloud nu este un test electric și nici un test pe placa reală."
  de:
    summary: "Firmware-Simulationen und Szenarien nach Freigabe in der Cloud von Wokwi mit festgelegtem wokwi-cli ausführen."
    description: "Firmware-Simulationsjobs und begrenzte Szenarien in der Cloud von Wokwi mit dem festgelegten wokwi-cli 0.29.1 - ein Projekt untersuchen, sein Diagramm offline validieren, einen Job aus exakten Kopien (Firmware, ELF, Diagramm, Szenario) vorbereiten, per Hash an Sendeliste, Konto, Grenzwerte und Zeitbudget gebunden, ihn nach Freigabe einmal in der Cloud ausführen, dann die Ergebnisse Bestanden, Nicht bestanden, Zeitüberschreitung und Fehler mit serieller Ausgabe, VCD und Screenshots abholen und berichten. Das Wokwi-Token bleibt im Zugangsdatenspeicher von VERA und erreicht nur einen freigegebenen Lauf dieses Plugins über seine Eingabe. Eine Cloud-Simulation ist kein elektrischer Test und kein Test auf dem echten Board."
  fr:
    summary: "Exécutez des simulations de firmware et des scénarios dans le cloud de Wokwi avec un wokwi-cli épinglé, après approbation."
    description: "Tâches de simulation de firmware et scénarios finis dans le cloud de Wokwi avec wokwi-cli 0.29.1 épinglé - examiner un projet, valider son diagramme hors ligne, préparer une tâche de copies exactes (firmware, ELF, diagramme, scénario) liées par hash avec la liste des envois, le compte, les limites et le budget de temps, l’exécuter une seule fois dans le cloud après approbation, puis récupérer les résultats réussi, échoué, délai dépassé et erreur avec la sortie série, le VCD et les captures d’écran, et rédiger un rapport. Le jeton Wokwi reste dans le magasin d’identifiants de VERA et n’est transmis qu’à une exécution approuvée de ce plugin, sur son entrée. Une simulation dans le cloud n’est ni un test électrique ni un test sur la vraie carte."
ecosystem: arduino
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://docs.wokwi.com/wokwi-ci/cli-usage", "https://github.com/wokwi/wokwi-cli/releases/tag/v0.29.1"]
settings:
  wokwi-token:
    kind: secret
    scope: wokwi
    description: A Wokwi CI token stored under the reference a job names as its account; only an approved run-scenario receives it, on its input.
programs:
  wokwi-cli:
    install:
      find:
        windows: ["%PATH%"]
        linux: ["$PATH", "/usr/local/bin/wokwi-cli"]
      hint: "Choose Install programs for the pinned wokwi-cli 0.29.1 from its GitHub release."
      download:
        windows-x64:
          url: https://github.com/wokwi/wokwi-cli/releases/download/v0.29.1/wokwi-cli-win-x64.exe
          sha256: 45292e3c4f32ba4cfbcc7a457a6df48aad95fdb3269a218cb83423da9dc483b2
          bytes: 46728248
          path: wokwi-cli.exe
        linux-x64:
          url: https://github.com/wokwi/wokwi-cli/releases/download/v0.29.1/wokwi-cli-linuxstatic-x64
          sha256: 3c9d6da007d008a3822ab468318037285440055132c59fd659d7306e40f14258
          bytes: 56591935
          path: wokwi-cli
      preferDownload: true
    version: { args: [--short-version], match: '^(\d+\.\d+\.\d+) \(', range: '>=0.29.1,<0.29.2' }
    timeout: 60
  wokwi-tool:
    install: { script: scripts/wokwi_tool.py }
    version: { args: [--version], match: '^wokwi-tool (\d+\.\d+\.\d+)' }
    timeout: 120
    uses: [wokwi-cli]
    # A call naming --credential REF receives the stored token wokwi:REF as one line on stdin, only while this
    # official plugin is enabled for the workbench; never in argv, environment, logs or results. wokwi-tool gives it
    # to the one wokwi-cli child it starts, as WOKWI_CLI_TOKEN in that child's environment only.
    credentials: { option: --credential, scope: wokwi }
# wokwi-cli simulates the project folder it is given (reading wokwi.toml, chips and an sdcard folder by itself) and
# offers init, chip compilation and an MCP server, so the agent reaches it only through wokwi-tool, which runs it on a
# job folder of exact copies.
rules:
  # Every direct command is blocked (the highest risk of overlapping rules wins); VERA's provisioner probes the version
  # without these rules.
  - match: "wokwi-cli *"
    risk: blocked
    note: "wokwi-cli would upload whatever its project folder holds and offers an MCP server. Use wokwi-tool, which prepares an exact job and runs it once after approval."
  - { match: "wokwi-tool {--version,--help,-h}", risk: safe }
  - match: "wokwi-tool {capabilities,inspect-project,validate-diagram} *"
    risk: safe
    note: Offline. Reads the project, firmware and diagram and runs wokwi-cli's offline diagram linter; nothing is written or sent.
  - match: "wokwi-tool {prepare-job,collect-results,report} *"
    risk: safe
    note: Offline. prepare-job copies the firmware, ELF, diagram and scenario into a new run folder and lists what a cloud run would send; collect-results and report read run folders and write results there or in a new folder. The project is never changed and nothing is sent.
  - match: "wokwi-tool run-scenario *"
    risk: irreversible
    note: Sends the job's diagram, firmware and ELF to Wokwi's cloud servers (wss://wokwi.com) with the stored Wokwi token and runs the simulation once; the transmitted files cannot be recalled and the run counts against the Wokwi account's plan. Show the job's send list, account, limits and time budget to the user first. It is a cloud simulation, not an electrical test or a test on the real board.
    timeout: 1900
