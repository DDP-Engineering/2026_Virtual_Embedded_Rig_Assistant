format: 1
id: electrical-documentation
version: 0.1.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Electrical documentation
summary: "Material, wire, cable, terminal, label and I/O lists from the model, panel and schematics, cross-checked, with revision, change report and CSV/XLSX/PDF."
description: "Derive the project documentation with VERA's electrical_documentation tools, only from what is already identified: the electrical model, a stored panel check, the QElectroTech schematics you name and, for PLC tags, a tag file you import explicitly. Every row names its source file and hash. The check finds duplicate wire numbers and connections, unnumbered wires, labels in neither the panel nor the model, starter connections the schematic does not draw, cables missing an end and I/O whose device, terminal, address or tag do not line up, also against the tag file. Differences are reported, never corrected in your files. The revision comes from the model's document object, never invented; a change report names changed rows, affected objects and stale results. Exports are new CSV, XLSX and PDF files with project, revision, run and model hash in the header; nothing is printed, ordered or sent."
translations:
  ro:
    summary: "Liste de materiale, conexiuni, cabluri, borne, etichete și I/O din model, tablou și scheme, verificate încrucișat, cu revizie, raport și CSV/XLSX/PDF."
    description: "Generează documentația proiectului cu instrumentele electrical_documentation, doar din ce este deja identificat: modelul electric, o verificare de tablou salvată, schemele QElectroTech numite și, pentru taguri PLC, un fișier de taguri importat explicit. Fiecare rând își numește fișierul sursă și hash-ul. Verificarea găsește numere de fir și conexiuni duplicate, fire nenumerotate, etichete absente din tablou și din model, conexiuni ale pornitoarelor nedesenate, cabluri fără un capăt și I/O la care aparatul, borna, adresa sau tagul nu corespund, și față de fișierul de taguri. Diferențele sunt raportate, nu corectate în fișiere. Revizia vine din obiectul document al modelului, nu este inventată; raportul de modificări arată rândurile schimbate, obiectele afectate și rezultatele depășite. Exporturile sunt fișiere noi CSV, XLSX și PDF cu proiect, revizie, rulare și hash-ul modelului în antet; nimic nu este printat, comandat sau trimis."
  de:
    summary: "Material-, Draht-, Kabel-, Klemmen-, Beschriftungs- und E/A-Listen aus Modell, Schrank und Plänen, abgeglichen, mit Revision, Änderungsbericht und CSV/XLSX/PDF."
    description: "Erzeugt die Projektdokumentation mit den electrical_documentation-Werkzeugen nur aus Bekanntem: Elektromodell, gespeicherte Schrankprüfung, die genannten QElectroTech-Pläne und für SPS-Tags eine ausdrücklich importierte Tag-Datei. Jede Zeile nennt Quelldatei und Hash. Die Prüfung findet doppelte Drahtnummern und Verbindungen, Drähte ohne Nummer, Kennzeichen weder im Schrank noch im Modell, nicht gezeichnete Starterverbindungen, Kabel ohne ein Ende und E/A, bei denen Gerät, Klemme, Adresse oder Tag nicht passen, auch zur Tag-Datei. Unterschiede werden gemeldet, nie in Ihren Dateien korrigiert. Die Revision kommt aus dem Dokumentobjekt des Modells, nie erfunden; ein Änderungsbericht nennt geänderte Zeilen, betroffene Objekte und veraltete Ergebnisse. Exporte sind neue CSV-, XLSX- und PDF-Dateien mit Projekt, Revision, Lauf und Modell-Hash im Kopf; nichts wird gedruckt, bestellt oder gesendet."
  fr:
    summary: "Listes de matériel, fils, câbles, bornes, étiquettes et E/S issues du modèle, de l'armoire et des schémas, recoupées, avec révision, rapport et CSV/XLSX/PDF."
    description: "Établit la documentation du projet avec les outils electrical_documentation, seulement à partir de l'existant : modèle électrique, vérification d'armoire enregistrée, schémas QElectroTech nommés et, pour les tags API, un fichier de tags importé explicitement. Chaque ligne nomme son fichier source et son hash. La vérification trouve fils et connexions en double, fils sans numéro, repères absents de l'armoire et du modèle, connexions de démarreur non dessinées, câbles sans une extrémité et E/S dont appareil, borne, adresse ou tag ne concordent pas, aussi avec le fichier de tags. Les écarts sont signalés, jamais corrigés dans vos fichiers. La révision vient de l'objet document du modèle, jamais inventée ; un rapport nomme lignes changées, objets touchés et résultats périmés. Les exports sont de nouveaux fichiers CSV, XLSX et PDF avec projet, révision, exécution et hash du modèle en en-tête ; rien n'est imprimé, commandé ni envoyé."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
docs: [README.md]
