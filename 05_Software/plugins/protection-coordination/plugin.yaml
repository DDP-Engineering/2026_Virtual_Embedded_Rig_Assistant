format: 1
id: protection-coordination
version: 0.1.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Protection and coordination
summary: Fuse and breaker checks on a network result - breaking capacity, overload, disconnection, let-through energy, coordination from manufacturer tables.
description: Check candidate fuses and circuit breakers from an industrial catalog per circuit with VERA's protection_coordination tool, against a current electrical-network result - rated voltage, poles, breaking capacity of the kind the profile names (Icu, Ics or Icn; fuses by their rated breaking capacity), Ib <= In <= Iz and I2 <= 1.45 Iz, automatic disconnection from cited tripping bands, let-through energy against k²S² and RCD type and sensitivity - and selectivity, cascading or starter coordination only from the manufacturer's tables for exactly those products. Results are stored with their inputs, so a model change marks them stale; missing data stays unknown, coordination is never read from curve overlap and no device is configured.
translations:
  ro:
    summary: "Verifică siguranțe și disjunctoare pe un rezultat de rețea - rupere, suprasarcină, deconectare, energie I²t, coordonare din tabelele producătorului."
    description: "Verifică siguranțe fuzibile și disjunctoare candidate dintr-un catalog industrial, pe circuit, cu instrumentul protection_coordination al VERA, față de un rezultat curent al rețelei electrice - tensiune nominală, poli, capacitatea de rupere de tipul numit de profil (Icu, Ics sau Icn; siguranțele după capacitatea lor nominală de rupere), Ib <= In <= Iz și I2 <= 1,45 Iz, deconectarea automată din benzi de declanșare citate, energia lăsată să treacă față de k²S² și tipul și sensibilitatea RCD - iar selectivitatea, cascadarea sau coordonarea demaroarelor numai din tabelele producătorului pentru exact acele produse. Rezultatele se salvează cu intrările lor, astfel încât o modificare a modelului le marchează ca vechi; datele lipsă rămân necunoscute, coordonarea nu se citește niciodată din suprapunerea curbelor și niciun dispozitiv nu este configurat."
  de:
    summary: "Prüft Sicherungen und Leistungsschalter am Netzergebnis - Ausschaltvermögen, Überlast, Abschaltung, Durchlassenergie, Koordination aus Herstellertabellen."
    description: "Prüft Kandidaten für Sicherungen und Leistungsschalter aus einem Industriekatalog je Stromkreis mit dem VERA-Werkzeug protection_coordination gegen ein aktuelles Ergebnis des elektrischen Netzes - Bemessungsspannung, Pole, Ausschaltvermögen der vom Profil genannten Art (Icu, Ics oder Icn; Sicherungen nach ihrem Bemessungsausschaltvermögen), Ib <= In <= Iz und I2 <= 1,45 Iz, automatische Abschaltung aus zitierten Auslösebändern, Durchlassenergie gegen k²S² sowie RCD-Typ und Empfindlichkeit - und Selektivität, Back-up-Schutz oder Starterkoordination nur aus den Herstellertabellen für genau diese Produkte. Ergebnisse werden mit ihren Eingaben gespeichert, sodass eine Modelländerung sie als veraltet markiert; fehlende Daten bleiben unbekannt, Koordination wird nie aus der Überlappung von Kennlinien gelesen und kein Gerät wird konfiguriert."
  fr:
    summary: "Vérifie fusibles et disjoncteurs sur un résultat de réseau - pouvoir de coupure, surcharge, coupure, I²t, coordination selon les tableaux du fabricant."
    description: "Vérifie des fusibles et disjoncteurs candidats d’un catalogue industriel, circuit par circuit, avec l’outil protection_coordination de VERA, par rapport à un résultat de réseau électrique à jour - tension assignée, pôles, pouvoir de coupure du type que nomme le profil (Icu, Ics ou Icn ; fusibles selon leur pouvoir de coupure assigné), Ib <= In <= Iz et I2 <= 1,45 Iz, coupure automatique à partir de bandes de déclenchement citées, énergie traversante par rapport à k²S² et type et sensibilité du différentiel - et sélectivité, filiation ou coordination des démarreurs uniquement d’après les tableaux du fabricant pour exactement ces produits. Les résultats sont enregistrés avec leurs entrées, de sorte qu’un changement du modèle les marque périmés ; les données manquantes restent inconnues, la coordination n’est jamais déduite du recouvrement des courbes et aucun appareil n’est configuré."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
docs: [README.md]
