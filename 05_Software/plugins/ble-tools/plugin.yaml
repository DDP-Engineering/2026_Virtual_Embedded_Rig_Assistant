format: 1
id: ble-tools
version: 0.2.1
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: BLE tools (discovery and GATT)
summary: Scan for Bluetooth Low Energy devices and run controlled GATT reads, writes and notifications on known profiles.
description: Bounded Bluetooth Low Energy discovery and controlled GATT operations on known device profiles through Bleak 3.1.0 (WinRT on Windows 11, BlueZ on Linux) - scan for a bounded time, identify a device declared in lab/resources.json by its address against a profile that declares its services, characteristics, payload types, byte order, units, limits, allowed operations and pairing, list its services, read or record notifications of declared characteristics and send a named, classified write once. A name or RSSI never identifies a device. No pairing, PIN entry, raw write, firmware update, advertising, Bluetooth Classic or Bluetooth setting change; pairing is the user's step in the operating system.
translations:
  ro:
    summary: "Caută dispozitive Bluetooth Low Energy și rulează citiri, scrieri și notificări GATT controlate pe profiluri cunoscute."
    description: "Descoperire Bluetooth Low Energy limitată și operații GATT controlate pe profiluri de dispozitiv cunoscute, prin Bleak 3.1.0 (WinRT pe Windows 11, BlueZ pe Linux) - scanează pentru un timp limitat, identifică după adresă un dispozitiv declarat în lab/resources.json față de un profil care îi declară serviciile, caracteristicile, tipurile de payload, ordinea octeților, unitățile, limitele, operațiile permise și asocierea, îi listează serviciile, citește sau înregistrează notificări ale caracteristicilor declarate și trimite o singură dată o scriere cu nume, clasificată. Un nume sau un RSSI nu identifică niciodată un dispozitiv. Fără asociere, introducerea PIN-ului, scriere brută, actualizare de firmware, advertising, Bluetooth Classic sau modificarea setărilor Bluetooth; asocierea este pasul utilizatorului, în sistemul de operare."
  de:
    summary: "Nach Bluetooth-Low-Energy-Geräten suchen und kontrollierte GATT-Lese-, Schreib- und Notification-Vorgänge auf bekannten Profilen ausführen."
    description: "Begrenzte Bluetooth-Low-Energy-Erkennung und kontrollierte GATT-Operationen auf bekannten Geräteprofilen über Bleak 3.1.0 (WinRT unter Windows 11, BlueZ unter Linux) - für eine begrenzte Zeit suchen, ein in lab/resources.json deklariertes Gerät über seine Adresse gegen ein Profil identifizieren, das Services, Characteristics, Nutzdatentypen, Bytereihenfolge, Einheiten, Grenzwerte, erlaubte Operationen und Pairing deklariert, seine Services auflisten, deklarierte Characteristics lesen oder ihre Notifications aufzeichnen und einen benannten, eingestuften Schreibvorgang einmal senden. Name oder RSSI identifizieren nie ein Gerät. Kein Pairing, keine PIN-Eingabe, kein Raw-Write, kein Firmware-Update, kein Advertising, kein Bluetooth Classic und keine Änderung von Bluetooth-Einstellungen; das Pairing ist der Schritt des Benutzers im Betriebssystem."
  fr:
    summary: "Recherchez des appareils Bluetooth Low Energy et exécutez des lectures, écritures et notifications GATT contrôlées sur des profils connus."
    description: "Découverte Bluetooth Low Energy limitée et opérations GATT contrôlées sur des profils d’appareils connus avec Bleak 3.1.0 (WinRT sous Windows 11, BlueZ sous Linux) - rechercher pendant une durée limitée, identifier par son adresse un appareil déclaré dans lab/resources.json d’après un profil qui déclare ses services, caractéristiques, types de charge utile, ordre des octets, unités, limites, opérations autorisées et appairage, lister ses services, lire ou enregistrer les notifications des caractéristiques déclarées et envoyer une seule fois une écriture nommée et classée. Un nom ou un RSSI n’identifie jamais un appareil. Pas d’appairage, de saisie de code PIN, d’écriture brute, de mise à jour de firmware, d’advertising, de Bluetooth Classic ni de modification des paramètres Bluetooth ; l’appairage est une étape de l’utilisateur dans le système d’exploitation."
ecosystem: iot
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://bleak.readthedocs.io/en/latest/", "https://pypi.org/project/bleak/3.1.0/"]
settings:
  lab-resources:
    kind: workbench-file
    path: lab/resources.json
    format: lab-resources
    description: The bench registry; declares each Bluetooth LE device (ble-device) by address and profile that calls name by alias.
programs:
  ble-tool:
    subcommandHelp: { flag: --help, commands: [read-characteristic, subscribe-notifications, write-characteristic, release] }
    install: { script: scripts/ble_tool.py }
    version: { args: [--version], match: '^ble-tool (\d+\.\d+\.\d+)' }
    timeout: 120
    env:
      BLE_REGISTRY: "${workbench}/lab/resources.json"
    resources: { option: --device, kinds: [ble-device], grace: 5, cleanup: [release], cleanupTimeout: 30 }
# A device call connects only to the address lab/resources.json declares, with pairing off, and checks the device's
# GATT database against the profile before any characteristic is used. A read is never classified safe: a GATT read
# can change a device, which the profile states per characteristic (sideEffects).
rules:
  - { match: "ble-tool {--version,--help,-h}", risk: safe }
  - match: "ble-tool {capabilities,report} *"
    risk: safe
    note: Offline. Describes the backend, platform support and a device profile, or summarizes run folders; report writes a new run folder.
  - match: "ble-tool scan *"
    risk: device-read
    note: Uses this computer's Bluetooth adapter to listen for advertisements for at most --duration seconds and connects to nothing; --active also sends scan requests to the advertisers. The adapter's settings are not changed.
  - match: "ble-tool {identify,discover-services,read-characteristic,subscribe-notifications} *"
    risk: device-read
    note: Connects once to the declared device (pairing off), checks its GATT database and identity against the profile and reads declared characteristics without side effects; subscribe enables notifications on one characteristic for a bounded time and turns them off before disconnecting. discover-services reads no value.
    timeout: 3600
  - match: "ble-tool {read-characteristic,subscribe-notifications} * --side-effects *"
    risk: device-write
    note: Reads or subscribes to a characteristic the profile declares state-changing (a read-to-clear value, a stream that powers a sensor).
    timeout: 3600
  - match: "ble-tool write-characteristic *"
    risk: device-write
    note: Sends one named write operation of the profile to the confirmed device, once and never retried; a configure or actuate write changes a setting or moves, switches or drives hardware. Stop or a disconnect does not undo it.
  - match: "ble-tool release *"
    risk: device-write
    note: Ends a connection this computer still holds to the declared device (on Linux by one connect and disconnect). VERA runs it as the cleanup after Stop, timeout or a crash of a write.
  - match: "ble-tool write-characteristic * --persistent *"
    risk: irreversible
    note: Sends a persistent write the device stores and keeps after a reset (configuration in its non-volatile memory).
