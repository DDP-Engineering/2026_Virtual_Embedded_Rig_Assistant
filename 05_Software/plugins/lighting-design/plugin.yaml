name: Lighting design
summary: Estimate interior lighting from IES or LDT photometry and verify it against a photometric engine report such as DIALux evo.
description: Design interior lighting with VERA's lighting_design tool from a lighting project file (rectangular room, reflectances, calculation plane, luminaire types with IES LM-63 or EULUMDAT photometry, positions and orientations, scenarios, maintenance factor and user-entered requirements with their source). The preliminary level gives a lumen-method estimate with cited utilisation factors and the direct component on the calculation grid, with diagnostics for wrong scale, units, orientation and photometry. The verification level maps the values of a demonstrated photometric engine's report for the same room - DIALux evo through an assisted flow - and only then gives maintained illuminance, uniformity and glare verdicts. VERA computes no uniformity or UGR itself, runs no engine and writes no proprietary project format; emergency and exterior lighting are separate profiles not supported yet.
translations:
  ro:
    summary: "Estimează iluminatul interior din fotometrie IES sau LDT și îl verifică față de un raport de motor fotometric, cum ar fi DIALux evo."
    description: "Proiectează iluminatul interior cu instrumentul lighting_design al VERA, pornind de la un fișier de proiect de iluminat (încăpere dreptunghiulară, reflectanțe, plan de calcul, tipuri de corpuri cu fotometrie IES LM-63 sau EULUMDAT, poziții și orientări, scenarii, factor de mentenanță și cerințe introduse de utilizator, cu sursa lor). Nivelul preliminar dă o estimare prin metoda fluxului util cu factori de utilizare citați și componenta directă pe grila de calcul, cu diagnostice pentru scară, unități, orientare și fotometrie greșite. Nivelul de verificare mapează valorile raportului unui motor fotometric demonstrat pentru aceeași încăpere - DIALux evo printr-un flux asistat - și abia apoi dă verdicte pentru iluminarea menținută, uniformitate și orbire. VERA nu calculează ea însăși uniformitatea sau UGR, nu rulează niciun motor și nu scrie niciun format de proiect proprietar; iluminatul de siguranță și cel exterior sunt profiluri separate, încă neacceptate."
  de:
    summary: "Schätzt die Innenbeleuchtung aus IES- oder LDT-Photometrie und prüft sie gegen den Bericht einer photometrischen Engine wie DIALux evo."
    description: "Plant Innenbeleuchtung mit dem VERA-Werkzeug lighting_design aus einer Beleuchtungsprojektdatei (rechteckiger Raum, Reflexionsgrade, Berechnungsebene, Leuchtentypen mit IES-LM-63- oder EULUMDAT-Photometrie, Positionen und Ausrichtungen, Szenarien, Wartungsfaktor und vom Benutzer eingetragene Anforderungen mit ihrer Quelle). Die vorläufige Stufe liefert eine Schätzung nach dem Wirkungsgradverfahren mit zitierten Nutzungsgraden und den Direktanteil auf dem Berechnungsraster, mit Diagnosen für falschen Maßstab, falsche Einheiten, Ausrichtung und Photometrie. Die Verifikationsstufe ordnet die Werte des Berichts einer erprobten photometrischen Engine für denselben Raum zu - DIALux evo über einen assistierten Ablauf - und gibt erst dann Urteile zu Wartungswert der Beleuchtungsstärke, Gleichmäßigkeit und Blendung. VERA berechnet Gleichmäßigkeit und UGR nicht selbst, führt keine Engine aus und schreibt kein proprietäres Projektformat; Notbeleuchtung und Außenbeleuchtung sind eigene Profile und noch nicht unterstützt."
  fr:
    summary: "Estime l’éclairage intérieur à partir d’une photométrie IES ou LDT et le vérifie par rapport au rapport d’un moteur photométrique tel que DIALux evo."
    description: "Conçoit l’éclairage intérieur avec l’outil lighting_design de VERA à partir d’un fichier de projet d’éclairage (local rectangulaire, réflectances, plan de calcul, types de luminaires avec photométrie IES LM-63 ou EULUMDAT, positions et orientations, scénarios, facteur de maintenance et exigences saisies par l’utilisateur avec leur source). Le niveau préliminaire donne une estimation par la méthode du flux utile avec des facteurs d’utilisation cités et la composante directe sur la grille de calcul, avec diagnostics d’échelle, d’unités, d’orientation et de photométrie. Le niveau de vérification associe les valeurs du rapport d’un moteur photométrique éprouvé pour le même local - DIALux evo via un flux assisté - et ne donne qu’ensuite des verdicts sur l’éclairement maintenu, l’uniformité et l’éblouissement. VERA ne calcule pas elle-même l’uniformité ni l’UGR, n’exécute aucun moteur et n’écrit aucun format de projet propriétaire ; l’éclairage de sécurité et extérieur n’est pas encore pris en charge."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
