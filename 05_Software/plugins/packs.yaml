# Ecosystem packs: the Plugins page shows each pack as checkable groups (spec REQ-DATA-b40d3f9b §1.1).
# JTAG debug joins when its plugin exists here.
- id: esp32
  name: ESP32 (Espressif)
  groups:
    - { name: Core, plugins: [serial-monitor, esp32-esptool], default: true }
    - { name: ESP-IDF build, plugins: [esp32-idf], default: true }
    - { name: Security (irreversible), plugins: [esp32-efuse], default: false }
- id: general
  name: Firmware analysis
  groups:
    - { name: Captured firmware comparison and manual test planning, plugins: [analysis-skills], default: true }
    - { name: ELF analysis, plugins: [binutils], default: true }
    - { name: Debug probes and RTT, plugins: [probe-rs], default: true }
    - { name: Signal capture and bench instruments, plugins: [sigrok], default: true }
    - { name: Version control, plugins: [git], default: true }
