# Ecosystem packs: the Plugins page shows each pack as checkable groups (spec REQ-DATA-b40d3f9b §1.1).
# JTAG debug joins when its plugin exists here.
- id: esp32
  name: ESP32 (Espressif)
  groups:
    - { name: Core, plugins: [serial-monitor, esp32-esptool], default: true }
    - { name: ESP-IDF build, plugins: [esp32-idf], default: true }
    - { name: Security (irreversible), plugins: [esp32-efuse], default: false }
- id: general
  name: Firmware analysis
  groups:
    - { name: Captured firmware comparison and manual test planning, plugins: [analysis-skills], default: true }
    - { name: ELF analysis, plugins: [binutils], default: true }
    - { name: Debug probes and RTT, plugins: [probe-rs], default: true }
    - { name: Signal capture and bench instruments, plugins: [sigrok], default: true }
    - { name: Version control, plugins: [git], default: true }
- id: wireshark
  name: Wireshark
  groups:
    - { name: Capture analysis, plugins: [wireshark-tshark], default: true }
- id: can
  name: CAN
  groups:
    - { name: Bus capture and transmit, plugins: [can-python], default: true }
    - { name: DBC decoding, plugins: [can-dbc], default: true }
- id: microchip
  name: Microchip (AVR, PIC)
  groups:
    - { name: Programming (pymcuprog), plugins: [microchip-pymcuprog], default: true }
- id: stm32
  name: STM32 (ST)
  groups:
    - { name: Programming (STM32CubeProgrammer), plugins: [stm32-cubeprog], default: true }
- id: electronics
  name: Electronics design
  groups:
    - { name: Calculations, plugins: [electronics-calc], default: true }
    - { name: Schematic and PCB (KiCad), plugins: [kicad], default: true }
    - { name: Component selection, plugins: [parts-search], default: true }
    - { name: Simulation (ngspice), plugins: [ngspice], default: true }
    - { name: "Simulation (LTspice, Windows)", plugins: [ltspice], default: false }
- id: arduino
  name: Arduino
  groups:
    - { name: Sketches (Arduino CLI), plugins: [arduino-cli], default: true }
