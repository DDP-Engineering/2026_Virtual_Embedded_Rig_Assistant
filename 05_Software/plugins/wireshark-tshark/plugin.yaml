format: 1
id: wireshark-tshark
version: 0.11.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Wireshark (TShark)
summary: Analyse network capture files and capture live traffic with TShark.
description: Analyse network capture files with TShark (filters, field export, protocol statistics, packet details) and capture live traffic from an interface. Use for questions about .pcap/.pcapng captures of a board's Ethernet, Wi-Fi or USB traffic.
translations:
  ro:
    summary: "Analizează fișiere de captură de rețea și capturează trafic live cu TShark."
    description: "Analizează fișiere de captură de rețea cu TShark (filtre, export de câmpuri, statistici de protocol, detalii de pachete) și capturează trafic live de pe o interfață. Folosește-l pentru întrebări despre capturi .pcap/.pcapng ale traficului Ethernet, Wi-Fi sau USB al unei plăci."
  de:
    summary: "Netzwerk-Aufzeichnungsdateien analysieren und Live-Verkehr mit TShark aufzeichnen."
    description: "Netzwerk-Aufzeichnungsdateien mit TShark analysieren (Filter, Feldexport, Protokollstatistiken, Paketdetails) und Live-Verkehr von einer Schnittstelle aufzeichnen. Für Fragen zu .pcap/.pcapng-Aufzeichnungen des Ethernet-, WLAN- oder USB-Verkehrs eines Boards."
  fr:
    summary: "Analysez des fichiers de capture réseau et capturez du trafic en direct avec TShark."
    description: "Analysez des fichiers de capture réseau avec TShark (filtres, export de champs, statistiques de protocoles, détail des paquets) et capturez du trafic en direct sur une interface. Pour les questions sur des captures .pcap/.pcapng du trafic Ethernet, Wi-Fi ou USB d’une carte."
ecosystem: wireshark
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://www.wireshark.org/docs/man-pages/tshark.html"]
programs:
  tshark:
    optionSyntax: tshark
    install:
      find:
        windows: ["%PATH%", "%ProgramFiles%/Wireshark/tshark.exe"]
        linux: ["$PATH", "/usr/bin/tshark"]
      hint: "Install Wireshark (Windows: includes TShark and offers Npcap) from https://www.wireshark.org/download.html, or your distribution's tshark package."
    version: { args: [--version], match: '^TShark \(Wireshark\) (\d+\.\d+\.\d+)' }
    timeout: 300
  capinfos:
    install:
      find:
        windows: ["%PATH%", "%ProgramFiles%/Wireshark/capinfos.exe"]
        linux: ["$PATH", "/usr/bin/capinfos"]
      hint: "Install the Wireshark capture-file utilities from Wireshark or your distribution."
    version: { args: [--version], match: '^Capinfos \(Wireshark\) (\d+\.\d+\.\d+)' }
  editcap:
    install:
      find:
        windows: ["%PATH%", "%ProgramFiles%/Wireshark/editcap.exe"]
        linux: ["$PATH", "/usr/bin/editcap"]
      hint: "Install the Wireshark capture-file utilities from Wireshark or your distribution."
    version: { args: [--version], match: '^Editcap \(Wireshark\) (\d+\.\d+\.\d+)' }
  mergecap:
    install:
      find:
        windows: ["%PATH%", "%ProgramFiles%/Wireshark/mergecap.exe"]
        linux: ["$PATH", "/usr/bin/mergecap"]
      hint: "Install the Wireshark capture-file utilities from Wireshark or your distribution."
    version: { args: [--version], match: '^Mergecap \(Wireshark\) (\d+\.\d+\.\d+)' }
  text2pcap:
    install:
      find:
        windows: ["%PATH%", "%ProgramFiles%/Wireshark/text2pcap.exe"]
        linux: ["$PATH", "/usr/bin/text2pcap"]
      hint: "Install text2pcap from Wireshark or your distribution's Wireshark command-line tools."
    version: { args: [--version], match: '^Text2pcap \(Wireshark\) (\d+\.\d+\.\d+)' }
# tshark syntax projects option roles: <info> exits before capturing, <file> reads -r, <write> names an output
# file or folder (-w, --export-objects, --export-tls-session-keys, --log-file), <capture> opens an interface (or
# the default one when no capture file is read), <execute> loads a Lua script, <unknown> is an unrecognised option.
# The capture-file utilities read saved files; all but capinfos write a new one.
rules:
  - { match: "capinfos *", risk: safe, note: "Reads saved capture files and prints their format, packet count, times and hashes." }
  - { match: "{editcap,mergecap,text2pcap} *", risk: device-read, note: "Writes the capture file the command names from saved captures or a hexdump - a cut, a merge or a conversion; the path may lie outside the workbench." }
  - { match: "tshark * <info> *", risk: safe }
  - { match: "tshark * <file> *", risk: safe, note: Reads a saved capture file. }
  - { match: "tshark * <write> *", risk: device-read, note: "Writes the file or folder that -w, --export-objects, --export-tls-session-keys or --log-file names; it may lie outside the workbench." }
  - match: "tshark * <capture> *"
    risk: device-read
    note: Captures live traffic. Without -r tshark captures on the first interface. Needs Npcap on Windows or dumpcap capture permissions on Linux; extcap interfaces such as sshdump or rpcap reach other hosts.
  - { match: "tshark * <unknown> *", risk: device-write, note: An option this plugin does not recognise; check it against tshark -h. }
  - { match: "tshark * <execute> *", risk: device-write, note: "Loads the Lua script that -X lua_script names into TShark, for example the dissector of a project's own protocol. A Lua script can run any code on this computer." }
  - { match: "tshark * <credentials> *", risk: blocked, note: RPCAP passwords on the command line would be stored in run logs. Configure remote capture outside VERA. }
