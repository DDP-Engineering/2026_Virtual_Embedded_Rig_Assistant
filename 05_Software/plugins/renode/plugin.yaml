format: 1
id: renode
version: 0.3.1
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Renode virtual boards
summary: Run firmware on supported Renode virtual boards, capture the UART and run approved test sets.
description: Run a firmware ELF on an explicitly supported virtual board with the pinned Renode 1.17.0 - list the supported profiles, check a firmware against a profile's architecture, memory map and boot address before anything runs, boot it headless and capture its UART, and run approved test sets (UART lines, timer ticks, declared button and UART stimuli, the modeled LED) with separate virtual and real time budgets. Only approved platform profiles run; the agent never reaches the Renode monitor, scripts, sockets or host devices, unmodeled peripherals make a result incomplete, and every run folder states what was simulated and what a simulation does not cover.
translations:
  ro:
    summary: "Rulează firmware pe plăci virtuale Renode suportate, capturează UART-ul și rulează seturi de teste aprobate."
    description: "Rulează un ELF de firmware pe o placă virtuală suportată explicit, cu Renode 1.17.0 fixat - listează profilurile suportate, verifică un firmware față de arhitectura, harta de memorie și adresa de boot ale unui profil înainte să ruleze ceva, îl pornește headless și îi capturează UART-ul și rulează seturi de teste aprobate (linii UART, tick-uri de timer, stimuli declarați de buton și UART, LED-ul modelat) cu bugete separate de timp virtual și real. Rulează doar profilurile de platformă aprobate; agentul nu ajunge niciodată la monitorul Renode, la scripturi, socket-uri sau dispozitive ale gazdei, perifericele nemodelate fac rezultatul incomplet, iar fiecare folder de rulare declară ce s-a simulat și ce nu acoperă o simulare."
  de:
    summary: "Firmware auf unterstützten virtuellen Renode-Boards ausführen, den UART aufzeichnen und freigegebene Testsätze ausführen."
    description: "Ein Firmware-ELF mit dem festgelegten Renode 1.17.0 auf einem explizit unterstützten virtuellen Board ausführen - die unterstützten Profile auflisten, eine Firmware vor jedem Lauf gegen Architektur, Speicherabbild und Boot-Adresse eines Profils prüfen, sie ohne Oberfläche starten, ihren UART aufzeichnen und freigegebene Testsätze ausführen (UART-Zeilen, Timer-Ticks, deklarierte Taster- und UART-Stimuli, die modellierte LED), mit getrennten Budgets für virtuelle und reale Zeit. Nur freigegebene Plattformprofile laufen; der Agent erreicht nie Renode-Monitor, Skripte, Sockets oder Host-Geräte, nicht modellierte Peripherie macht ein Ergebnis unvollständig, und jeder Laufordner nennt, was simuliert wurde und was eine Simulation nicht abdeckt."
  fr:
    summary: "Exécutez un firmware sur des cartes virtuelles Renode prises en charge, capturez l’UART et lancez des jeux de tests approuvés."
    description: "Exécutez un ELF de firmware sur une carte virtuelle explicitement prise en charge avec Renode 1.17.0 épinglé - lister les profils pris en charge, vérifier un firmware par rapport à l’architecture, à la carte mémoire et à l’adresse de démarrage d’un profil avant toute exécution, le démarrer sans interface et capturer son UART, et exécuter des jeux de tests approuvés (lignes UART, ticks de timer, stimuli déclarés de bouton et d’UART, la LED modélisée) avec des budgets de temps virtuel et réel distincts. Seuls les profils de plateforme approuvés s’exécutent ; l’agent n’accède jamais au moniteur Renode, aux scripts, aux sockets ni aux périphériques de l’hôte, les périphériques non modélisés rendent un résultat incomplet, et chaque dossier d’exécution indique ce qui a été simulé et ce qu’une simulation ne couvre pas."
ecosystem: lab
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://renode.readthedocs.io/en/latest/introduction/testing.html", "https://renode.readthedocs.io/en/latest/introduction/supported-boards.html"]
programs:
  renode:
    install:
      find:
        windows: ["%PATH%", "%ProgramFiles%/Renode/bin/Renode.exe", "%ProgramFiles%/Renode/renode.exe"]
        linux: ["$PATH", "/usr/bin/renode", "/opt/renode/renode"]
      hint: Choose Install programs for the pinned Renode 1.17.0 portable package, or put a Renode 1.17.0 installation on PATH.
      download:
        windows-x64:
          url: https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.windows-portable.zip
          sha256: 18bcf145422039e8702c3e5f9864c7787561bfd5deb7a3ee6e168ecf19e2b9db
          bytes: 106735414
          path: renode_1.17.0-portable/renode.exe
        linux-x64:
          url: https://github.com/renode/renode/releases/download/v1.17.0/renode-1.17.0.linux-portable.tar.gz
          sha256: 4ba7c68b59e2447f188ef4b4b112fcccd2802582c460beedceb63b84e5605a5f
          bytes: 63459129
          path: renode_1.17.0-portable/renode
    version: { args: [--version], match: 'Renode v?(\d+\.\d+\.\d+)', range: '==1.17.0' }
    timeout: 60
  renode-sim:
    install: { script: scripts/renode_sim.py }
    version: { args: [--version], match: '^renode-sim (\d+\.\d+\.\d+)' }
    timeout: 600
    uses: [renode]
# The agent never reaches Renode directly: its monitor runs Python, includes scripts, downloads files and opens
# sockets, PTYs, TAP devices and GDB servers. renode-sim composes the monitor commands from an approved profile and
# fixed templates (the highest risk of all matching rules wins, so no exception to this block is possible); VERA's
# provisioner probes the engine version itself.
rules:
  - match: "renode *"
    risk: blocked
    note: The Renode monitor can run Python, include scripts, download files and open sockets or host devices. Use renode-sim, which runs approved profiles headless with UARTs on files in the run folder.
  - { match: "renode-sim {--version,--help,-h}", risk: safe }
  - match: "renode-sim {tools,profiles}"
    risk: safe
    note: Reports the engine version or the supported profiles; simulates nothing.
  - match: "renode-sim {tools,profiles,validate,report} *"
    risk: safe
    note: Reads profiles, a workbench ELF or a run folder; validate starts no simulation, report writes report files into the run folder.
  - match: "renode-sim {run,capture-uart,test} *"
    risk: safe
    timeout: 3600
    note: Host simulation. Runs the firmware on the virtual board of an approved profile in the pinned Renode, headless, with no device, network listener or host file outside the new run folder; the result is virtual evidence, not a hardware test.
