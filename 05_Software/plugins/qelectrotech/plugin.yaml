format: 1
id: qelectrotech
version: 0.1.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: QElectroTech schematics
summary: Read QElectroTech projects into the electrical model and draft DOL, reversing and star-delta schematics with checked connections and interlocks.
description: Read native QElectroTech .qet projects strictly with VERA's qelectrotech tools - folios, symbols, conductors and potentials, devices with their linked contacts and cross-references - and reconcile the devices with the electrical project model's references. Draft a two-folio schematic (power and control circuit) for a motor from a current motor-drives result with the DOL, reversing or star-delta template; the candidate is read back and checked before you approve it - every phase connection, every electrical interlock as an NC contact on each coil path, the overload contact, the contact links. Edit labels and other element information in an existing project with its base hash, keeping every other byte. A check stores numbering, cross-references and the device list against the model with the project's hash. Open the candidates in QElectroTech yourself; VERA starts no program.
translations:
  ro:
    summary: "Citește proiecte QElectroTech în modelul electric și propune scheme DOL, inversare și stea-triunghi cu conexiuni și interblocări verificate."
    description: "Citește strict proiecte native QElectroTech .qet cu instrumentele qelectrotech ale VERA - foi, simboluri, conductoare și potențiale, aparate cu contactele lor legate și referințele încrucișate - și reconciliază aparatele cu referințele modelului electric al proiectului. Propune o schemă pe două foi (circuit de forță și de comandă) pentru un motor dintr-un rezultat motor-drives curent, cu șablonul DOL, inversare sau stea-triunghi; candidatul este recitit și verificat înainte de aprobare - fiecare conexiune pe fază, fiecare interblocare electrică ca un contact NC pe fiecare cale a bobinei, contactul releului termic, legăturile contactelor. Modifică etichete și alte informații ale elementelor într-un proiect existent cu hash-ul de bază, păstrând ceilalți octeți. O verificare salvează numerotarea, referințele încrucișate și lista aparatelor față de model, cu hash-ul proiectului. Deschideți singuri candidații în QElectroTech; VERA nu pornește niciun program."
  de:
    summary: "Liest QElectroTech-Projekte ins Elektromodell und entwirft Direktstart-, Wende- und Stern-Dreieck-Pläne mit geprüften Verbindungen und Verriegelungen."
    description: "Liest native QElectroTech-Projekte (.qet) streng mit den qelectrotech-Werkzeugen von VERA - Blätter, Symbole, Leiter und Potenziale, Geräte mit ihren verknüpften Kontakten und Querverweisen - und gleicht die Geräte mit den Kennzeichen des elektrischen Projektmodells ab. Entwirft für einen Motor aus einem aktuellen motor-drives-Ergebnis einen zweiblättrigen Plan (Haupt- und Steuerstromkreis) mit der Vorlage Direktstart, Wendestarter oder Stern-Dreieck; der Kandidat wird vor Ihrer Freigabe zurückgelesen und geprüft - jede Phasenverbindung, jede elektrische Verriegelung als Öffner in jedem Spulenpfad, der Kontakt des Überlastrelais, die Kontaktverknüpfungen. Ändert Kennzeichen und andere Elementinformationen in einem bestehenden Projekt mit seinem Basis-Hash und lässt alle übrigen Bytes unverändert. Eine Prüfung speichert Nummerierung, Querverweise und Geräteliste gegen das Modell mit dem Hash des Projekts. Öffnen Sie die Kandidaten selbst in QElectroTech; VERA startet kein Programm."
  fr:
    summary: "Lit des projets QElectroTech dans le modèle électrique et propose des schémas direct, inverseur et étoile-triangle aux connexions et verrouillages vérifiés."
    description: "Lit strictement des projets natifs QElectroTech .qet avec les outils qelectrotech de VERA - folios, symboles, conducteurs et potentiels, appareils avec leurs contacts liés et renvois - et rapproche les appareils des repères du modèle électrique du projet. Propose un schéma sur deux folios (circuit de puissance et de commande) pour un moteur à partir d’un résultat motor-drives à jour, avec le modèle démarrage direct, inverseur ou étoile-triangle ; le candidat est relu et vérifié avant votre approbation - chaque connexion de phase, chaque verrouillage électrique comme contact NF sur chaque chemin de bobine, le contact du relais thermique, les liens des contacts. Modifie les repères et d’autres informations d’éléments dans un projet existant avec son hash de base, en conservant tous les autres octets. Une vérification enregistre la numérotation, les renvois et la liste des appareils par rapport au modèle avec le hash du projet. Ouvrez vous-même les candidats dans QElectroTech ; VERA ne lance aucun programme."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://qelectrotech.org"]
