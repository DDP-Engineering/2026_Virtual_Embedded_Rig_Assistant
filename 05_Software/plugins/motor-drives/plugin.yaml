format: 1
id: motor-drives
version: 0.1.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Motor starting and drives
summary: Compare DOL, reversing, star-delta, softstarter and VFD per motor, size the starter or drive and give a logical connection and interlock scheme.
description: Compare direct-on-line, reversing, star-delta, softstarter and variable-speed drive per motor with VERA's motor_drives tool, against the process function and a current protection-coordination result - motor nameplate, load torque and inertia, acceleration, starts per hour, panel ambient and altitude, motor cable. It proposes the simplest feasible method, sizes contactors by utilisation category, the overload relay, a softstarter or a drive by current and overload (never by power alone) with cited derating, and returns a logical connection and interlock scheme for a later ECAD adapter. Results are stored with their inputs, so a model change marks them stale; missing data stays unknown, no device is configured and no safety function is claimed.
translations:
  ro:
    summary: "Compară DOL, inversare, stea-triunghi, softstarter și variator pe motor, dimensionează demarorul sau variatorul și dă schema de conexiuni și interblocări."
    description: "Compară pornirea directă, inversarea sensului, stea-triunghi, softstarterul și variatorul de turație pentru fiecare motor, cu instrumentul motor_drives al VERA, față de funcția procesului și un rezultat curent de protecție și coordonare - plăcuța motorului, cuplul și inerția sarcinii, accelerarea, pornirile pe oră, temperatura ambiantă și altitudinea tabloului, cablul motorului. Propune cea mai simplă metodă fezabilă, dimensionează contactoarele pe categorii de utilizare, releul termic, un softstarter sau un variator după curent și suprasarcină (niciodată doar după putere), cu declasare citată, și returnează o schemă logică de conexiuni și interblocări pentru un adaptor ECAD ulterior. Rezultatele se salvează cu intrările lor, astfel încât o modificare a modelului le marchează ca vechi; datele lipsă rămân necunoscute, niciun dispozitiv nu este configurat și nu se pretinde nicio funcție de siguranță."
  de:
    summary: "Vergleicht Direktstart, Wendestarter, Stern-Dreieck, Sanftanlasser und Umrichter je Motor, bemisst Starter oder Antrieb, liefert ein Verriegelungsschema."
    description: "Vergleicht Direktstart, Wendestarter, Stern-Dreieck, Sanftanlasser und drehzahlveränderbaren Antrieb je Motor mit dem VERA-Werkzeug motor_drives gegen die Prozessfunktion und ein aktuelles Ergebnis von Schutz und Koordination - Motortypenschild, Lastmoment und Trägheit, Hochlauf, Starts pro Stunde, Umgebungstemperatur und Aufstellhöhe des Schaltschranks, Motorkabel. Es schlägt die einfachste machbare Methode vor, bemisst Schütze nach Gebrauchskategorie, das Überlastrelais, einen Sanftanlasser oder einen Antrieb nach Strom und Überlast (nie allein nach Leistung) mit zitierter Leistungsminderung und liefert ein logisches Anschluss- und Verriegelungsschema für einen späteren ECAD-Adapter. Ergebnisse werden mit ihren Eingaben gespeichert, sodass eine Modelländerung sie als veraltet markiert; fehlende Daten bleiben unbekannt, kein Gerät wird konfiguriert und keine Sicherheitsfunktion wird beansprucht."
  fr:
    summary: "Compare DOL, inverseur, étoile-triangle, démarreur progressif et variateur par moteur, dimensionne l’équipement, donne un schéma de raccordement."
    description: "Compare le démarrage direct, l’inversion de sens, l’étoile-triangle, le démarreur progressif et le variateur de vitesse pour chaque moteur, avec l’outil motor_drives de VERA, par rapport à la fonction du procédé et à un résultat de protection et coordination à jour - plaque signalétique du moteur, couple et inertie de la charge, accélération, démarrages par heure, température ambiante et altitude de l’armoire, câble moteur. Il propose la méthode réalisable la plus simple, dimensionne les contacteurs par catégorie d’emploi, le relais de surcharge, un démarreur progressif ou un variateur selon le courant et la surcharge (jamais selon la seule puissance), avec déclassement cité, et fournit un schéma logique de raccordement et de verrouillage pour un futur adaptateur ECAD. Les résultats sont enregistrés avec leurs entrées, de sorte qu’un changement du modèle les marque périmés ; les données manquantes restent inconnues, aucun appareil n’est configuré et aucune fonction de sécurité n’est revendiquée."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
docs: [README.md]
