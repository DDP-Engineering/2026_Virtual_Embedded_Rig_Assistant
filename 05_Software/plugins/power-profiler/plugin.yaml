format: 1
id: power-profiler
version: 0.2.1
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Power profiling
summary: Measure a board's current, power and energy with a Joulescope JS220 and analyse the captures offline.
description: Measure a board's current, voltage, power, energy and charge with a Joulescope JS220 through the official pyjoulescope_driver - captures on the meter's own sample clock with gaps and overflow kept explicit (never zero), firmware build identity, GPI markers for events - and analyse them offline - mean/min/max current, energy and charge integrals, time in states, energy per event, A/B firmware comparison that separates setup differences from firmware changes (judged by lab-validate), and a battery-life interval with its assumptions. The meter is reserved for the run, opened without its defaults, its current path never switched, and changed settings restored and read back.
translations:
  ro:
    summary: "Măsoară curentul, puterea și energia unei plăci cu un Joulescope JS220 și analizează capturile offline."
    description: "Măsoară curentul, tensiunea, puterea, energia și sarcina electrică ale unei plăci cu un Joulescope JS220 prin pyjoulescope_driver oficial - capturi pe ceasul de eșantionare propriu al aparatului, cu golurile și depășirile păstrate explicit (niciodată zero), identitatea build-ului de firmware, markeri GPI pentru evenimente - și le analizează offline - curent mediu/minim/maxim, integrale de energie și sarcină, timp în stări, energie per eveniment, comparație de firmware A/B care separă diferențele de montaj de modificările de firmware (evaluată de lab-validate) și un interval de autonomie a bateriei cu ipotezele lui. Aparatul este rezervat pe durata rulării, deschis fără setările implicite, calea de curent nu este comutată niciodată, iar setările modificate sunt restaurate și citite înapoi."
  de:
    summary: "Strom, Leistung und Energie eines Boards mit einem Joulescope JS220 messen und die Aufzeichnungen offline analysieren."
    description: "Strom, Spannung, Leistung, Energie und Ladung eines Boards mit einem Joulescope JS220 über den offiziellen pyjoulescope_driver messen - Aufzeichnungen mit dem eigenen Abtasttakt des Messgeräts, Lücken und Überläufe explizit (nie null), Identität des Firmware-Builds, GPI-Marker für Ereignisse - und offline analysieren: mittlerer/minimaler/maximaler Strom, Energie- und Ladungsintegrale, Zeit in Zuständen, Energie pro Ereignis, A/B-Firmware-Vergleich, der Aufbauunterschiede von Firmware-Änderungen trennt (bewertet durch lab-validate), und ein Intervall der Batterielaufzeit mit Annahmen. Das Messgerät wird für den Lauf reserviert, ohne Standardwerte geöffnet, sein Strompfad nie geschaltet, und geänderte Einstellungen werden wiederhergestellt und zurückgelesen."
  fr:
    summary: "Mesurez le courant, la puissance et l’énergie d’une carte avec un Joulescope JS220 et analysez les captures hors ligne."
    description: "Mesurez le courant, la tension, la puissance, l’énergie et la charge d’une carte avec un Joulescope JS220 via le pyjoulescope_driver officiel - captures sur l’horloge d’échantillonnage propre à l’appareil, avec trous et dépassements explicites (jamais des zéros), identité du build du firmware, marqueurs GPI pour les événements - et analysez-les hors ligne - courant moyen/min/max, intégrales d’énergie et de charge, temps passé dans chaque état, énergie par événement, comparaison de firmwares A/B qui distingue les différences de montage des modifications du firmware (évaluée par lab-validate), et intervalle d’autonomie de batterie avec ses hypothèses. L’appareil de mesure est réservé pour l’exécution, ouvert sans ses réglages par défaut, son chemin de courant n’est jamais commuté, et les réglages modifiés sont rétablis et relus."
ecosystem: lab
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://github.com/jetperch/joulescope_driver", "https://pypi.org/project/pyjoulescope-driver/2.5.5/"]
settings:
  lab-resources:
    kind: workbench-file
    path: lab/resources.json
    format: lab-resources
    description: The bench registry; declares the power monitor (power-monitor) that captures name by alias.
programs:
  power-profile:
    install: { script: scripts/power_profile.py }
    version: { args: [--version], match: '^power-profile (\d+\.\d+\.\d+)' }
    timeout: 120
    env:
      POWER_PROFILE_REGISTRY: "${workbench}/lab/resources.json"
    resources: { option: --meter, kinds: [power-monitor], grace: 10, cleanup: [release], cleanupTimeout: 30 }
  power-analyze:
    install: { script: scripts/power_analyze.py }
    version: { args: [--version], match: '^power-analyze (\d+\.\d+\.\d+)' }
    timeout: 600
# The highest risk of all matching rules wins. A capture configures the meter (sample rate, current and voltage
# range): that changes the burden in series with the DUT, so it is device-write, never a plain read.
rules:
  - { match: "power-profile {--version,--help,-h}", risk: safe }
  - match: "power-profile tools"
    risk: safe
    note: Imports pyjoulescope_driver and checks the USB prerequisites (WinUSB, udev rule); opens no device and changes no driver or rule.
  - match: "power-profile tools --list *"
    risk: device-read
    note: Lists the connected Joulescope device paths through the driver's USB enumeration; opens none of them.
  - match: "power-profile identify *"
    risk: device-read
    note: Opens the declared meter without applying its defaults and reads its versions and range settings; changes nothing.
  - match: "power-profile capture *"
    risk: device-write
    timeout: 3600
    note: Sets the meter's sample rate and current/voltage range (which changes the burden in series with the DUT), streams current, voltage, power and the chosen GPI markers, then restores the previous settings and reads them back. It never switches the DUT's current path, never drives an output and never updates the meter's firmware.
  - match: "power-profile release *"
    risk: device-write
    note: VERA's cleanup after an interrupted capture - switches the meter's signals off and its current range back to auto-ranging, then reads it back; it never switches the current path.
  - { match: "power-analyze {--version,--help,-h}", risk: safe }
  - match: "power-analyze {acquisition,inspect} *"
    risk: safe
    note: Offline. Checks an acquisition plan against the meter profile, or reads a capture folder; writes nothing.
  - match: "power-analyze {import,measure-energy,segment,compare,battery,report} *"
    risk: safe
    note: Offline analysis. Reads the named files and run folders in the workbench (hash-checked), never changes them, and creates a new run folder under the results directory (default embedded-lab-results); no device, network or other program.
