format: 1
id: microchip-pymcuprog
version: 1.0.0
name: Microchip pymcuprog (AVR, PIC)
description: Identify, program, verify and erase Microchip AVR (UPDI) and PIC parts with pymcuprog through a Curiosity Nano/Xplained nEDBG kit, PICkit 4 or MPLAB Snap (AVR mode), Atmel-ICE or a SerialUPDI adapter, and read or change fuses. Use to flash a hex image or inspect a part's memories.
ecosystem: microchip
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://github.com/microchip-pic-avr-tools/pymcuprog"]
programs:
  pymcuprog:
    optionSyntax: pymcuprog
    install: { pip: "pymcuprog>=3.19,<4" }
    version: { args: [--version], match: '^pymcuprog version (\d+(?:\.\d+)+)', range: ">=3.19,<4" }
    timeout: 300
# pymcuprog syntax projects the action followed by roles: <info> (-h, -V, -R), <protect> (fuse, lock-bit, config-word or
# all-memory writes, every hex-file write, protection-memory erases), <high-voltage> (-H), <locked> (-U, -C) and
# <unknown> (an argument pymcuprog would reject). Irreversible rules start with the action, the typed word.
rules:
  - { match: "pymcuprog * <info> *", risk: safe }
  - { match: "pymcuprog makeuf2 *", risk: safe, note: Converts a hex file to UF2 without a tool and writes the .uf2 file without approval. }
  - { match: "pymcuprog {ping,read,verify,getvoltage,getsupplyvoltage,getusbvoltage} *", risk: device-read }
  - { match: "pymcuprog reset *", risk: device-read, note: Resets the target by entering and leaving programming mode. }
  - { match: "pymcuprog {write,erase,reboot-debugger} *", risk: device-write, note: "Changes flash, EEPROM or user-row contents that a new write restores." }
  - { match: "pymcuprog * <locked> *", risk: device-write, note: Erases or writes a locked UPDI device; the chip erase clears its flash. }
  - { match: "pymcuprog * <unknown> *", risk: device-write, note: An argument pymcuprog 3.19 does not accept; check pymcuprog --help. }
  - match: "pymcuprog {write,erase} * <protect> *"
    risk: irreversible
    note: Writes fuses, config words or lock bits (an Intel hex file can carry them, and a write without -m targets all memories). A wrong fuse can disable UPDI or reset; lock bits enable code protection.
  - match: "pymcuprog setsupplyvoltage *"
    risk: irreversible
    note: Changes the kit's target supply voltage; a voltage the part or circuit cannot take can damage it.
  - match: "pymcuprog {ping,erase,read,write,verify,getvoltage,getsupplyvoltage,getusbvoltage,setsupplyvoltage,reboot-debugger,reset,makeuf2} * <high-voltage> *"
    risk: irreversible
    note: Applies a UPDI high-voltage (12 V) pulse to the reset/UPDI pin; only parts and boards that tolerate it survive.
