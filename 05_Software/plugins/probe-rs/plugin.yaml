format: 1
id: probe-rs
version: 0.3.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: probe-rs
summary: Flash, inspect, test and profile ARM, RISC-V and Xtensa targets and follow their RTT log through debug probes.
description: Identify, flash and verify, reset, read and back up memory, stream RTT, catch faults with a stack trace, run on-target tests and profile ARM, RISC-V and supported Xtensa targets through local debug probes.
translations:
  ro:
    summary: "Programează, inspectează, testează și profilează ținte ARM, RISC-V și Xtensa și urmărește jurnalul RTT prin probe-uri de depanare."
    description: "Identifică, programează și verifică, resetează, citește și salvează memoria, transmite RTT, prinde fault-uri cu stack trace, rulează teste pe placă și profilează ținte ARM, RISC-V și Xtensa suportate, prin probe-uri de depanare locale."
  de:
    summary: "ARM-, RISC-V- und Xtensa-Targets flashen, untersuchen, testen und profilieren und ihr RTT-Log verfolgen, über Debug-Probes."
    description: "Identifizieren, flashen und verifizieren, zurücksetzen, Speicher lesen und sichern, RTT streamen, Faults mit Stacktrace abfangen, Tests auf dem Target ausführen und Profile erstellen auf ARM-, RISC-V- und unterstützten Xtensa-Targets über lokale Debug-Probes."
  fr:
    summary: "Flashez, inspectez, testez et profilez des cibles ARM, RISC-V et Xtensa et suivez leur journal RTT via des sondes de débogage."
    description: "Identifiez, flashez et vérifiez, réinitialisez, lisez et sauvegardez la mémoire, diffusez le RTT, interceptez les fautes avec leur pile d’appels, exécutez des tests sur la cible et profilez des cibles ARM, RISC-V et Xtensa prises en charge via des sondes de débogage locales."
ecosystem: general
platforms: [windows-x64, linux-x64, linux-arm64]
programs:
  probe-rs:
    subcommandHelp:
      flag: --help
      commands: [info, reset, download, verify, erase, run, attach, trace, itm, benchmark, profile, read, write, mi]
    install:
      find:
        windows: ["%PATH%", "~/.cargo/bin"]
        linux: ["$PATH", "~/.cargo/bin"]
      hint: Install programs for the pinned portable release, or put probe-rs 0.32.0 on PATH or in ~/.cargo/bin. See https://probe.rs/docs/getting-started/probe-setup/ for user-managed drivers and device permissions.
      download:
        windows-x64:
          url: https://github.com/probe-rs/probe-rs/releases/download/v0.32.0/probe-rs-tools-x86_64-pc-windows-msvc.zip
          sha256: 56fc0564cc23d604b27dc2d57606194159c49f951999f3e47bd2cbffcba64103
          bytes: 11502414
          path: probe-rs.exe
        linux-x64:
          url: https://github.com/probe-rs/probe-rs/releases/download/v0.32.0/probe-rs-tools-x86_64-unknown-linux-gnu.tar.xz
          sha256: c2ccc46049e52a5d403ef212078cd637ecda55b662708327960558f83e851ff5
          bytes: 22506272
          path: probe-rs-tools-x86_64-unknown-linux-gnu/probe-rs
        linux-arm64:
          url: https://github.com/probe-rs/probe-rs/releases/download/v0.32.0/probe-rs-tools-aarch64-unknown-linux-gnu.tar.xz
          sha256: 7c818cfd77808e806bf8f4d108c9137910b4fb28e0fe5c464d39782dbbc8af31
          bytes: 21444944
          path: probe-rs-tools-aarch64-unknown-linux-gnu/probe-rs
    version: { args: [--version], match: 'probe-rs (\d+\.\d+\.\d+)', range: '==0.32.0' }
    timeout: 120
# The highest matching risk wins. "info" is matched as the command only (first, or after global options), so
# "chip info <name>", which reads the built-in registry, stays safe. Flashing, reading memory, tests, RTT and
# profiling get longer time limits than the 120 seconds of the quick commands.
rules:
  - { match: "probe-rs * {--version,-V,--help,-h,help} *", risk: safe }
  - { match: "probe-rs * chip *", risk: safe, note: Lists or describes supported targets; no hardware. }
  - { match: "probe-rs * list *", risk: safe, note: Lists attached probes without connecting to a target. }
  - { match: "probe-rs info *", risk: device-read, note: Connects to the target; may halt it briefly. }
  - { match: "probe-rs {--*,-r*} * info *", risk: device-read, note: Connects to the target; may halt it briefly. }
  - { match: "probe-rs * {mi,trace} *", risk: device-read, note: Connects to the target; may halt it briefly. }
  - { match: "probe-rs * {read,verify} *", risk: device-read, timeout: 1800, note: Connects to the target; may halt it briefly. }
  - { match: "probe-rs * attach *", risk: device-read, timeout: 3600, note: Connects to the target and halts it on a fault or a reset. }
  - { match: "probe-rs * profile *", risk: device-read, timeout: 1800, note: Samples the running firmware; the naive method halts the core for every sample. }
  - { match: "probe-rs * reset *", risk: device-read, note: Resets the target; stored firmware is unchanged. }
  - { match: "probe-rs * {download,erase} *", risk: device-write, timeout: 1800, note: Overwrites flash or RAM on the target. }
  - { match: "probe-rs * run *", risk: device-write, timeout: 3600, note: Overwrites flash or RAM on the target. }
  - { match: "probe-rs * benchmark *", risk: device-write, note: Overwrites flash or RAM on the target. }
  - { match: "probe-rs * --flash *", risk: device-write, note: Flashes the ELF before profiling. }
  - { match: "probe-rs * itm *", risk: device-write, note: Connects to the target and configures its trace hardware. }
  - match: "probe-rs * write *"
    risk: device-write
    note: Writes arbitrary memory. A write to a flash controller or option register can enable permanent read protection, and a write to a GPIO register drives pins.
  - { match: "probe-rs * {debug,gdb,dap-server,serve,complete} *", risk: blocked, note: "Interactive, opens a server or changes shell configuration." }
  - { match: "probe-rs * --host *", risk: blocked, note: Remote probe servers are not supported by this plugin. }
