format: 1
id: gdb-debug
version: 0.2.0
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: GDB debugging
summary: Inspect firmware ELF files and debug a Cortex-M target through a probe in supervised GDB sessions.
description: Inspect firmware ELF files offline (architecture, hash, symbols, DWARF) and debug a Cortex-M target through a declared probe with finite, supervised GDB sessions - snapshot of registers, backtrace, locals, permitted RAM and decoded fault state with symbols checked against the target's flash, a hardware breakpoint with a timeout, bounded stepping - with OpenOCD from verified profiles on 127.0.0.1 only, no GDB console, scripts or monitor commands, the probe reserved for the run and the declared halt/resume policy applied at every exit.
translations:
  ro:
    summary: "Inspectează fișiere ELF de firmware și depanează o țintă Cortex-M printr-un probe, în sesiuni GDB supravegheate."
    description: "Inspectează offline fișiere ELF de firmware (arhitectură, hash, simboluri, DWARF) și depanează o țintă Cortex-M printr-un probe declarat, în sesiuni GDB finite și supravegheate - snapshot al registrelor, backtrace, variabile locale, RAM permis și starea de fault decodată, cu simbolurile verificate față de flash-ul țintei, un breakpoint hardware cu timeout, pas cu pas limitat - cu OpenOCD din profiluri verificate doar pe 127.0.0.1, fără consolă GDB, scripturi sau comenzi monitor, cu probe-ul rezervat pe durata rulării și politica declarată de oprire/reluare aplicată la fiecare ieșire."
  de:
    summary: "Firmware-ELF-Dateien untersuchen und ein Cortex-M-Target über eine Probe in überwachten GDB-Sitzungen debuggen."
    description: "Firmware-ELF-Dateien offline untersuchen (Architektur, Hash, Symbole, DWARF) und ein Cortex-M-Target über eine deklarierte Probe in begrenzten, überwachten GDB-Sitzungen debuggen - Snapshot von Registern, Backtrace, lokalen Variablen, erlaubtem RAM und dekodiertem Fault-Zustand mit gegen den Flash des Targets geprüften Symbolen, ein Hardware-Breakpoint mit Zeitlimit, begrenztes Schrittweise-Ausführen - mit OpenOCD aus geprüften Profilen nur auf 127.0.0.1, ohne GDB-Konsole, Skripte oder Monitor-Befehle, mit für den Lauf reservierter Probe und der deklarierten Halt/Resume-Regel bei jedem Beenden."
  fr:
    summary: "Examinez des fichiers ELF de firmware et déboguez une cible Cortex-M via une sonde dans des sessions GDB supervisées."
    description: "Examinez hors ligne des fichiers ELF de firmware (architecture, hash, symboles, DWARF) et déboguez une cible Cortex-M via une sonde déclarée dans des sessions GDB finies et supervisées - instantané des registres, backtrace, variables locales, RAM autorisée et état de faute décodé, avec des symboles vérifiés par rapport à la flash de la cible, un point d’arrêt matériel avec délai d’expiration, un pas à pas limité - avec OpenOCD à partir de profils vérifiés sur 127.0.0.1 uniquement, sans console GDB, scripts ni commandes monitor, la sonde réservée pour l’exécution et la politique d’arrêt/reprise déclarée appliquée à chaque sortie."
ecosystem: lab
platforms: [windows-x64, linux-x64]
docs: [README.md, "https://sourceware.org/gdb/current/onlinedocs/gdb.html/GDB_002fMI.html", "https://openocd.org/doc/html/GDB-and-OpenOCD.html"]
settings:
  lab-resources:
    kind: workbench-file
    path: lab/resources.json
    format: lab-resources
    optional: true
    description: The bench registry; declares the debug probe (probe) a debug session names by alias. Not needed without a probe.
programs:
  arm-none-eabi-gdb:
    install:
      find:
        windows: ["%PATH%", "C:/ST/STM32CubeCLT*/GNU-tools-for-STM32/bin", "C:/ST/STM32CubeIDE*/STM32CubeIDE/plugins/com.st.stm32cube.ide.mcu.externaltools.gnu-tools-for-stm32*/tools/bin", "~/.platformio/packages/toolchain-gccarmnoneeabi*/bin", "~/.local/xPacks/@xpack-dev-tools/arm-none-eabi-gcc/*/.content/bin", "~/.local/xPacks/xpack-arm-none-eabi-gcc-*/bin", "%APPDATA%/xPacks/@xpack-dev-tools/arm-none-eabi-gcc/*/.content/bin", "%APPDATA%/xPacks/xpack-arm-none-eabi-gcc-*/bin", "%ProgramFiles%/Arm GNU Toolchain arm-none-eabi/*/bin"]
        linux: ["$PATH", "/usr/bin/gdb-multiarch", "/opt/st/stm32cubeclt*/GNU-tools-for-STM32/bin", "~/.platformio/packages/toolchain-gccarmnoneeabi*/bin", "~/.local/xPacks/@xpack-dev-tools/arm-none-eabi-gcc/*/.content/bin", "~/.local/xPacks/xpack-arm-none-eabi-gcc-*/bin", "/opt/arm-gnu-toolchain-*/bin"]
      hint: Install the Arm GNU Toolchain (arm-none-eabi-gdb 12 or newer, for example the xPack arm-none-eabi-gcc 15.2.1-1.1) and put its bin folder on PATH; on Ubuntu run sudo apt install gdb-multiarch.
    version: { args: [--version], match: 'GNU gdb[^\n]*?(\d+\.\d+)', range: '>=12' }
    timeout: 60
  openocd:
    install:
      find:
        windows: ["%PATH%", "~/.local/xPacks/@xpack-dev-tools/openocd/*/.content/bin", "%APPDATA%/xPacks/@xpack-dev-tools/openocd/*/.content/bin", "%APPDATA%/xPacks/xpack-openocd-*/bin", "~/.platformio/packages/tool-openocd*/bin"]
        linux: ["$PATH", "/usr/bin/openocd", "/usr/local/bin/openocd", "~/.local/xPacks/@xpack-dev-tools/openocd/*/.content/bin", "~/.platformio/packages/tool-openocd*/bin"]
      hint: Install OpenOCD 0.12.0 or newer (for example the xPack OpenOCD) and put its bin folder on PATH; on Ubuntu run sudo apt install openocd. Probe drivers and USB permissions stay yours to set up.
    version: { args: [--version], match: 'Open On-Chip Debugger (\d+\.\d+\.\d+)', range: '>=0.12.0' }
    timeout: 60
  gdb-elf:
    install: { script: scripts/gdb_elf.py }
    version: { args: [--version], match: '^gdb-elf (\d+\.\d+\.\d+)' }
    timeout: 60
  gdb-debug:
    install: { script: scripts/gdb_debug.py }
    version: { args: [--version], match: '^gdb-debug (\d+\.\d+\.\d+)' }
    timeout: 300
    uses: [arm-none-eabi-gdb, openocd]
    env:
      GDB_DEBUG_REGISTRY: "${workbench}/lab/resources.json"
    resources: { option: --probe, kinds: [probe], grace: 30, cleanup: [release], cleanupTimeout: 30 }
# The agent never reaches GDB or OpenOCD directly: a GDB console runs scripts, shell and monitor commands, and OpenOCD
# runs Tcl and opens network ports. gdb-debug drives both through a fixed command set (the highest risk of all
# matching rules wins, so no exception to these blocks is possible); VERA's provisioner probes their versions itself.
rules:
  - match: "arm-none-eabi-gdb *"
    risk: blocked
    note: A GDB console can run scripts, Python, shell and monitor commands. Use gdb-debug, which drives GDB/MI with a fixed command set.
  - match: "openocd *"
    risk: blocked
    note: OpenOCD runs Tcl and opens network ports. Use gdb-debug, which starts it from a verified profile on 127.0.0.1 only.
  - { match: "gdb-elf {--version,--help,-h}", risk: safe }
  - match: "gdb-elf {inspect,diagnose} *"
    risk: safe
    note: Reads a workbench ELF (and a saved gdb-debug run folder); starts no process and opens no device.
  - { match: "gdb-debug {--version,--help,-h}", risk: safe }
  - match: "gdb-debug tools"
    risk: safe
    note: Asks the installed GDB and OpenOCD for their versions and GDB for its architecture support; opens no probe.
  - match: "gdb-debug release *"
    risk: safe
    note: VERA's cleanup after an interrupted session; starts nothing and does not touch the target.
  - match: "gdb-debug {snapshot,break,step} *"
    risk: device-write
    note: Connects through the declared probe and halts the core; break and step run firmware until the breakpoint, timeout or step ends; the declared --on-exit policy (halted or resume) is applied at the end. Nothing is written to target memory or flash.
  - match: "gdb-debug break *"
    risk: device-write
    timeout: 3600
  - match: "gdb-debug * --firmware-effect actuates *"
    risk: irreversible
    note: The firmware drives actuators. Halting it can leave an output in its last state, and running or resuming it lets it act on the hardware.
