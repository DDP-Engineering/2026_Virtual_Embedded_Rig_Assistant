format: 1
id: esp32-esptool
version: 0.2.1
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: ESP32 esptool
summary: Identify, flash, verify, erase and read Espressif chips over a serial port with esptool.
description: Identify, flash, erase and read Espressif chips over a serial port with esptool v5. Use for any ESP32 programming task, such as confirming the chip type, writing the images of an ESP-IDF build, verifying them or erasing the flash.
translations:
  ro:
    summary: "Identifică, programează, verifică, șterge și citește cipuri Espressif printr-un port serial, cu esptool."
    description: "Identifică, programează, șterge și citește cipuri Espressif printr-un port serial, cu esptool v5. Folosește-l pentru orice sarcină de programare ESP32, de exemplu confirmarea tipului cipului, scrierea imaginilor unui build ESP-IDF, verificarea lor sau ștergerea flash-ului."
  de:
    summary: "Espressif-Chips über einen seriellen Port mit esptool identifizieren, flashen, verifizieren, löschen und auslesen."
    description: "Espressif-Chips über einen seriellen Port mit esptool v5 identifizieren, flashen, löschen und auslesen. Für jede ESP32-Programmieraufgabe, etwa den Chiptyp bestätigen, die Images eines ESP-IDF-Builds schreiben, sie verifizieren oder den Flash löschen."
  fr:
    summary: "Identifiez, flashez, vérifiez, effacez et lisez des puces Espressif sur un port série avec esptool."
    description: "Identifiez, flashez, effacez et lisez des puces Espressif sur un port série avec esptool v5. Pour toute tâche de programmation ESP32, comme confirmer le type de puce, écrire les images d’un build ESP-IDF, les vérifier ou effacer la flash."
ecosystem: esp32
platforms: [windows-x64, linux-x64]
requires: [serial-monitor]
programs:
  esptool:
    install: { pip: "esptool>=5,<6" }
    version: { args: [version], match: 'v(\d+\.\d+\.\d+)', range: ">=5,<6" }
    timeout: 120
rules:
  - { match: "esptool {version,--help,-h}", risk: safe }
  - { match: "esptool * {merge-bin,image-info,elf2image} *", risk: safe }
  - match: "esptool * {chip-id,read-mac,flash-id,read-mem,read-flash-status,read-flash-sfdp,get-security-info,read-sdc-chip-info,verify-sdc-certificate,run} *"
    risk: device-read
    note: Resets the chip into its bootloader.
  - match: "esptool * {read-flash,verify-flash,dump-mem} *"
    risk: device-read
    timeout: 1800
    note: Resets the chip into its bootloader.
  - match: "esptool * {write-flash,erase-flash,erase-region} *"
    risk: device-write
    timeout: 1800
    note: Overwrites firmware or data stored on the chip.
  - match: "esptool * load-ram *"
    risk: device-write
    note: Runs code loaded into the chip's RAM instead of its firmware until the next reset; the approval binds that image's hash.
  - match: "esptool * {write-mem,write-flash-status} *"
    risk: irreversible
    note: Writes chip registers or the flash status register directly; eFuse bits set this way can never be cleared, and some flash chips have one-time lock bits.
  - match: "esptool * --force *"
    risk: irreversible
    note: --force skips esptool's security checks; on a chip with secure boot or flash encryption the write or erase can make it unbootable for good.
  - match: "esptool * {--encrypt,--encrypt-files} *"
    risk: irreversible
    note: --encrypt and --encrypt-files write images through the chip's flash encryption; with eFuse settings that do not fit, the chip cannot boot what was written.
  - match: "esptool * --ignore-flash-enc-efuse *"
    risk: irreversible
    note: --ignore-flash-enc-efuse skips esptool's check of the flash-encryption eFuses; an encrypted write to a chip that is not set up for it can leave it unbootable.
docs:
  - https://docs.espressif.com/projects/esptool/en/latest/
