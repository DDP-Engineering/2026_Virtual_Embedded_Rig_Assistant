format: 1
id: power-quality-pfc
version: 0.1.1
license: LicenseRef-PolyForm-Noncommercial-1.0.0
name: Power quality and reactive compensation
summary: Import P/Q/S and harmonic measurements, size a fixed or automatic capacitor bank and check overcompensation, equipment and resonance.
description: Evaluate reactive power compensation at one board with VERA's power_quality tool - per network scenario and per measured interval (CSV or JSON with declared time, units and sign conventions) the active and fundamental reactive power, the displacement factor and the total power factor under distortion, the kvar need to a target, a fixed or automatic bank of equal steps with a control-logic proposal, overcompensation at light load, capacitor, detuned reactor, capacitor contactor and step protection checks against cited catalog data (combinations only from cited tables) and the parallel resonance from the network fault level and the measured harmonic orders. Missing data stays unknown; no step is switched, no regulator is set and no filter is designed. Capacitor banks here are reactive compensation, not batteries or UPS.
translations:
  ro:
    summary: "Importă măsurători P/Q/S și de armonici, dimensionează o baterie fixă sau automată de condensatoare și verifică supracompensarea, echipamentele și rezonanța."
    description: "Evaluează compensarea puterii reactive la un tablou cu instrumentul power_quality al VERA - pe scenariu de rețea și pe interval măsurat (CSV sau JSON cu timp, unități și convenții de semn declarate) puterea activă și puterea reactivă fundamentală, factorul de deplasare și factorul de putere total în prezența distorsiunilor, kvar necesari până la o țintă, o baterie fixă sau automată de trepte egale cu o propunere de logică de comandă, supracompensarea la sarcină mică, verificări ale condensatorului, bobinei de antirezonanță, contactorului pentru condensatoare și protecției treptelor față de datele de catalog citate (combinații doar din tabele citate) și rezonanța paralelă din nivelul de scurtcircuit al rețelei și ordinele armonice măsurate. Datele lipsă rămân necunoscute; nu se comută nicio treaptă, nu se setează niciun regulator și nu se proiectează niciun filtru. Bateriile de condensatoare de aici sunt compensare de putere reactivă, nu baterii sau UPS."
  de:
    summary: "Importiert P/Q/S- und Oberschwingungsmessungen, bemisst eine feste oder automatische Kondensatoranlage und prüft Überkompensation, Betriebsmittel und Resonanz."
    description: "Bewertet die Blindleistungskompensation an einer Verteilung mit dem VERA-Werkzeug power_quality - je Netzszenario und gemessenem Intervall (CSV oder JSON mit deklarierter Zeit, Einheiten und Vorzeichenkonventionen) Wirkleistung und Grundschwingungs-Blindleistung, Verschiebungsfaktor und Gesamtleistungsfaktor unter Verzerrung, kvar-Bedarf bis zu einem Ziel, eine feste oder automatische Anlage aus gleichen Stufen mit Vorschlag für die Regellogik, Überkompensation bei Schwachlast, Prüfungen von Kondensator, Verdrosselung, Kondensatorschütz und Stufenschutz gegen zitierte Katalogdaten (Kombinationen nur aus zitierten Tabellen) sowie die Parallelresonanz aus Kurzschlussleistung des Netzes und gemessenen Oberschwingungsordnungen. Fehlende Daten bleiben unbekannt; es wird keine Stufe geschaltet, kein Regler eingestellt und kein Filter entworfen. Kondensatoranlagen sind hier Blindleistungskompensation, keine Batterien oder USV."
  fr:
    summary: "Importe des mesures P/Q/S et d’harmoniques, dimensionne une batterie fixe ou automatique et contrôle surcompensation, équipements et résonance."
    description: "Évalue la compensation de l’énergie réactive à un tableau avec l’outil power_quality de VERA - par scénario de réseau et par intervalle mesuré (CSV ou JSON avec temps, unités et conventions de signe déclarés) la puissance active et la puissance réactive fondamentale, le facteur de déplacement et le facteur de puissance total en présence de distorsion, les kvar nécessaires jusqu’à une cible, une batterie fixe ou automatique de gradins égaux avec une proposition de logique de commande, la surcompensation à faible charge, des contrôles du condensateur, de la self, du contacteur et de la protection de gradin sur des données de catalogue citées et la résonance parallèle déduite du niveau de court-circuit du réseau et des rangs d’harmoniques mesurés. Les données manquantes restent inconnues ; aucun gradin n’est commuté, aucun régulateur n’est réglé et aucun filtre n’est conçu. Les batteries de condensateurs servent ici à la compensation, pas au stockage d’énergie."
ecosystem: electrical
platforms: [windows-x64, linux-x64]
docs: [README.md]
