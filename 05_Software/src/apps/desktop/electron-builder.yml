appId: engineering.ddp.vera
productName: VERA
asar: true
# Both native dependencies use N-API prebuilds; keep their upstream bytes.
npmRebuild: false
directories:
  app: src/apps/desktop
  output: release_tmp
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/node-addon-api/**'
  - '!node_modules/onnxruntime-node/script/**'
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/**
  - node_modules/onnxruntime-node/bin/**
  - node_modules/@img/**
  - '**/*.node'
  - resources/models/**
# Models are already real files here, outside ASAR.
# These paths are relative to generated staging, populated from src/models.
extraResources:
  - from: resources/models
    to: models
    filter:
      - '**/*'
  - from: resources/model-manifest.json
    to: model-manifest.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  signAndEditExecutable: false
nsis:
  perMachine: false
  oneClick: true
  allowElevation: false
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
