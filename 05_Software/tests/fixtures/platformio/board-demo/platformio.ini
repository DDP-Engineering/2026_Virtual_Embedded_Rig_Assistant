; Fixture project of the platformio plugin tests (LAB-08). Two STM32F4DISCOVERY environments (the second extends the
; first) and a native host-test environment; common settings come from common.ini through extra_configs.
; default_envs is set on purpose: VERA never uses it.
[platformio]
extra_configs = common.ini
default_envs = disco

[env]
test_framework = unity

[env:disco]
platform = platformio/ststm32@20.0.0
board = disco_f407vg
framework = cmsis
upload_protocol = stlink
build_flags = ${common_mcu.build_flags} -DFW_VERSION=\"1.2.3\"
test_build_src = no

[env:disco_fast]
extends = env:disco
build_flags = ${common_mcu.build_flags} -DFW_VERSION=\"1.2.4\" -DFAST_TICKS

[env:native]
platform = platformio/native@1.2.1
build_src_filter = -<*>
