title = "Run to a hardware breakpoint within a bounded time"

status = "active"

requirement = """
When `gdb-debug break --at <location> --timeout <s>` runs, the helper shall insert one hardware breakpoint, continue the core, report a hit only for a stop of that breakpoint number, interrupt the core when the timeout or a Stop comes first, take a snapshot and delete the breakpoint before applying the exit policy.
"""

