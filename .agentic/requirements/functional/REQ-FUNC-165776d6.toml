id = "REQ-FUNC-165776d6"

title = "Re-bind the board identity to its port after an upload"

status = "active"

requirement = """
When an upload ends, the arduino-tool helper shall list the ports again and record the port that now carries the board's identity, the port it used when several ports share that identity and it is among them, none with a warning when the identity is absent or only on several other ports, and none with a ports-unlisted warning marking the port unknown when the ports cannot be listed, keeping the upload's own outcome.
"""

verification = "The fake upload reports updated_upload_port COM7 and the second board list shows the identity on COM7: port.after is COM7 and port.reported COM7; when the identity is absent afterwards port.after is null and warning identity-not-found says so; after an upload to one of two CH340 ports the only warning is board-unverified; when the board list after the upload fails, the upload still exits 0 with result.json status pass, port.after null and warning ports-unlisted."

affected_paths = ["05_Software/plugins/arduino-cli/scripts/arduino_support/upload.py"]

linked_tests = ["05_Software/tests/plugins/arduino-cli.test.ts"]


