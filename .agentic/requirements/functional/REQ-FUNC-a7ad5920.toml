title = "Execute enabled file tools in full filesystem Bypass mode"

status = "active"

requirement = """
While a writable VERA session is in Bypass mode, the agent shall execute its enabled ordinary file tools without approval prompts using absolute or workbench-relative filesystem paths, including outside and normally ignored locations, subject to OS permissions and existing tool integrity limits, with that extra authority revoked when the mode changes.
"""

verification = "Use owned temporary workbench and sibling directories to read/list/glob/grep/write/edit in Bypass, including ignored metadata; assert automatic exact durable grants and mode persistence. Downgrade during queued/in-flight work and confirm external operations stop or are denied; existing modes still reject escapes. Native replay exercises actual isolated grep and external changes; recovery only reconciles hashes without writing files."

