title = "Map the folios, symbols, conductors and potentials of a QElectroTech project"

status = "active"

requirement = """
When VERA reads a well-formed QElectroTech project, it shall list every folio with its order and title, every element with its UUID, type, folio and information, every embedded element definition with its link type, kind and terminals, every conductor with both ends resolved by element and terminal UUID or by the legacy terminal id, and the electrical potentials joined by conductors and linked folio reports, and shall report each unresolved type, terminal or link as a problem instead of dropping it.
"""

verification = "Unit tests on the candidate fixtures and on inline projects: folio, element and conductor counts equal the file's; a conductor with element1/terminal1 UUIDs and one with a legacy numeric terminal id resolve to the same terminals; a report pair joins the potentials of two folios; a conductor naming an unknown terminal and an element of a non-embedded type appear as problems with their UUIDs."

