title = "Map wokwi-cli's end to distinct pass, fail and timeout outcomes"

status = "active"

requirement = """
When wokwi-cli exits, wokwi-tool shall report outcome passed (status pass) for exit 0, virtual-timeout for exit 42 with the timeout message, fail-text for an unexpected text and assertion-failed for a scenario assertion error, the last three with status fail and exit 1, never treating a timeout as pass.
"""

