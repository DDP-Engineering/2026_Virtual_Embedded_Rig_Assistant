requirement = "When a caller queries packets, VERA shall return an ordered bounded page with explicit coverage and a continuation bound to the capture, tool version, profile, filter, selected fields and scan window, reading the frames of the window that follows the given starting frame so that a capture longer than one window is read window by window."
