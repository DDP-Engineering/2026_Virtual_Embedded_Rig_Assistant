title = "Send one line and read the reply"
status = "active"
requirement = "When the serial-monitor script runs with send, it shall write the text (after replacing \\xNN, \\r, \\n, \\t, \\0, \\e and \\\\ when --escape is given) followed by the chosen line ending, CR LF by default, or the bytes given in hexadecimal with --hex without a line ending, to the port once and then read the reply as a capture does, for one second unless a duration is given; without --port it shall hand the bytes to the one running capture of the same user, or the one named with --capture, which writes them, notes them in its own output and copies what it reads back to the sender, and it shall exit 3 when no such capture or more than one is running."
verification = "The fake records one write of 'help' plus CR LF for --text help, and 'help' alone for --eol none; stdout holds the fake's reply and the summary names duration or until. Boundary: send opens like capture (dtr True, rts False, then dtr False) and never asserts RTS."
