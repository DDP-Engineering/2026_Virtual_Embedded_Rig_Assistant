title = "Keep session subscriptions with the owning workbench"

status = "active"

requirement = "While a renderer subscription to a session is open, the desktop app shall keep delivering that session's events in order from the session's own workbench when another workbench comes to the foreground or the owner returns to it, until the subscription ends, the window reloads or the owner workbench is released."

verification = "Main replay test: subscribe to A's session through the router, open B while A's turn streams, release the turn; every stored event arrives once in sequence order and the final message arrives; boundary: after A's runtime is released, a rename of A's session in the reopened A reaches neither subscription. Registry test: bringing another runtime to the foreground clears no subscription."

