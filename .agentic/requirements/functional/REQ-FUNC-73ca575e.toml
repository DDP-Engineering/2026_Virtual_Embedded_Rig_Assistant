title = "Wait for hosted response headers up to the resolved time"

status = "active"

requirement = """
When VERA sends a request to a hosted provider, it shall wait for the response headers up to the resolved Hosted header wait, an integer from 10 to 300 seconds with default 30, while a custom endpoint keeps its own configured wait.
"""

verification = "With 10, a hosted provider whose headers arrive after 12 seconds fails with the timeout error naming 10 seconds; a custom endpoint with its own wait is unaffected."

