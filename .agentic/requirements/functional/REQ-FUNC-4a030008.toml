title = "Retain the resolved number of daily structured log files"
status = "active"
requirement = """
When the host records a log entry, VERA shall append a timestamped level-tagged JSON line to its UTC daily log and retain the newest daily files up to the resolved Log retention (an integer from 1 to 90 days, default 7, set for the application), pruning older ones with the first entry that can read the retention, on a day change and with the next entry after the value changes, and pruning none while the retention cannot be read yet.
"""
verification = "Record all levels across nine days; parse lines and verify the newest seven logs by default and the newest three with the next entry after the retention is set to 3; a logger whose retention getter throws keeps all nine files and prunes to the resolved five with the first entry after it resolves; unrelated-file preservation; failed writes recover."
