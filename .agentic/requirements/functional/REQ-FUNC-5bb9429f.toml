title = "Normalise command tokens before rule matching"
status = "active"
requirement = "When a command line is matched against plugin rules, the matcher shall compare the program name and each argument lowercased with every underscore replaced by a hyphen and with each argument of the form --name=value split into --name and value, and shall normalise pattern tokens the same way."
verification = "Rule `esptool * {write-flash} *` classifies `esptool --chip esp32 write_flash 0x0 a.bin` and `esptool WRITE-FLASH` alike; rule `tool * --driver x *` matches both `tool --driver=X` and `tool --driver x`; boundary: `-d=x` (single dash) stays one token and does not match `-d x`."
