title = "Read a declared characteristic a bounded number of times and decode it"

status = "active"

requirement = "When ble-tool read-characteristic names a profile characteristic whose operations include read, it shall read it --count times (1 to 100) at --interval seconds (0.1 to 60) and record for each read the raw bytes as hex, the length, the receive time and the value decoded by the profile's payload schema with its unit."

verification = "A fake temperature of 0x0915 little endian with scale 0.01 reads as 23.25 degC three times with --count 3; a characteristic without the read operation is refused operation-not-allowed before connecting."

