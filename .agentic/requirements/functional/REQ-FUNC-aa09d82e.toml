title = "Install a download archive program"
status = "active"
requirement = "When the user installs a download program whose URL path ends in .zip, .tar.gz, .tgz or .tar.xz, the provisioner shall download the file for the current platform, verify its SHA-256, extract it into runtime/downloads/<sha256>/ and resolve the program to the manifest path inside that folder, reusing an existing folder of the same hash without downloading."
verification = "Unit test with an injected fetch serving a zip built in the test, and an integration test extracting a tar.gz and a tar.xz built with the system tar: the program resolves to downloads/<sha256>/<path>; a second install with the folder present does not call fetch."
