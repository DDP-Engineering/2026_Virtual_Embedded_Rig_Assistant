title = "Summarize a turn that reaches its tool-call limit"

status = "active"

requirement = "When an agent turn reaches its tool-call limit, the runtime shall return the executed results to the model in one final request without tools that asks for a brief summary of what is done and what remains, and end the turn with stop reason limit marked as a tool-call limit."

verification = "Script a model that calls a tool on every step with a limit of 2: assert two executions, a third request offered no tools whose answer is emitted as the last assistant message, and turn.done with stopReason limit and limit toolCalls; boundary: a model that still calls a tool in the final request gets it recorded as not executed, and a context-budget limit carries no toolCalls mark."

