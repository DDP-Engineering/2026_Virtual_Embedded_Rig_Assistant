title = "Check a resistor's dissipation against its derated power rating"

status = "active"

requirement = """
Where a `resistor` request gives a rated power, the script shall return the allowed power - the rating, or with a derating line the rating reduced linearly from full power at `fullPowerUpTo` to zero at `zeroPowerAt` for the ambient temperature - the utilization, and a `power-rating` check that passes when the dissipation does not exceed the allowed power.
"""

verification = "0.2 W in a 0.25 W resistor derated from 70 °C to 155 °C passes at 25 °C (allowed 0.25 W), has allowed power 0.125 W and fails at 112.5 °C, and has allowed power 0 W at 160 °C; without `ratedPower` the check is `not-evaluated`; `derating` without `tAmbient` is `insufficient`; `tAmbient` without `derating` is not used and says so in a warning."

