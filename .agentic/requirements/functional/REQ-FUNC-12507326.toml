When motor_drives sizes the proposed assembly, VERA shall check each contactor against its position current in the utilisation category of the method (AC-3, AC-4 for inching, AC-1 for an external bypass), the overload relay setting range and its cited tripping band against the start, the mechanical interlock accessory for reversing and star-delta and the softstarter rating after cited derating, and shall give unknown when a cited value or accessory is missing.
"""

