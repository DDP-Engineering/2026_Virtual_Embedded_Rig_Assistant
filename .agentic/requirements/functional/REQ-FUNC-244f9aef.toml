title = "Obtain and reuse supplier access tokens and refresh them once when refused"

status = "active"

requirement = """
The host shall obtain DigiKey and TME access tokens with the stored credential, request at most one token at a time per supplier, reuse it until 60 s before it expires, and request a new one once when a search answers 401.
"""

verification = "Two concurrent searches from two sessions cause one token request; a search after the expiry margin requests a new token; a 401 search answer causes one token request and one repeated search."

