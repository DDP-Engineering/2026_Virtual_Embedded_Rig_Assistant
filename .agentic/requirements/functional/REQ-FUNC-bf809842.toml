title = "Save bounded session artifacts"
status = "active"
requirement = "When artifact_save receives a valid file name and UTF8 content up to5MiB, the session tool shall save the content sequentially and return its artifact reference and byte count. A name that only needs accents removed or spaces, punctuation and folder separators replaced shall be saved under that portable name, which the result states; a name differing only in letter case shall name the existing artifact. The tool shall refuse a name that is not a file name (empty, a traversal, a drive, a device name, no letter or digit left), oversize content, and an existing name whose stored content or description differs unless overwrite is true."
verification = "Real SessionService/registry replay saves empty/Unicode/exact-limit content; traversal/drive/device names, UTF8 overlimit and a duplicate with other content produce actionable isError; names with spaces, accents, separators or over 100 characters are saved under a portable name returned as savedAs; a name differing in case is refused naming the existing artifact and replaces it with overwrite; an identical save succeeds without overwrite and rewrites nothing; a rename refused because another program holds the file is retried and then reported without system paths; ask/read-only session mode needs no approval; actual fixture directory keeps replay/auto pathological/normal grep routing and selects save-artifact for Save summary."
