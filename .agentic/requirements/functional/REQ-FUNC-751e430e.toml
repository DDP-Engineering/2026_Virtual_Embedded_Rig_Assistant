title = "Re-install managed programs"

status = "active"

requirement = """
When the user chooses Re-install on an installed plugin, the provisioner shall install again every program VERA manages (pip and script with uv --reinstall, downloads fetched again, verified against their SHA-256 and swapped in for VERA's copy), skip find programs, keep the existing copy when the new one fails, and change nothing else.
"""

verification = "Core provisioning test: a single-file download whose stored copy was damaged is downloaded again by reinstall and reports ready with the original bytes; a reinstall whose download fails reports the problem and keeps the old copy; pip runs `uv tool install --reinstall`; find programs are not touched. Shared IPC test for plugins.reinstall; renderer test for the Re-install button."

