title = "Refuse invalid log content"
status = "active"
requirement = "If a log exceeds 50 MiB, parse_log shall return INVALID with a stable reason. Bytes that are not valid UTF8 shall become replacement characters in their line, and a line over 16 KiB shall be analysed by its first 16 KiB with the preview marked truncated; neither shall refuse the log. A log that starts with a UTF-16 byte order mark shall be read as UTF-16."
verification = "Test an oversize file; stray bytes between good lines count one unparsed line; an overlong line among good lines is clipped and the others count, including multi-byte boundaries; UTF-16 little and big endian captures give the same events."
