title = "Detect programs that open workbench entries"

status = "active"

requirement = "When asked which programs can open workbench entries, the desktop app shall report VS Code, Cursor and Notepad++ only when their executables exist in their standard install folders or on PATH, on Windows a terminal, Windows Terminal when installed and otherwise PowerShell, and the Open with dialog when rundll32.exe exists, and on Linux a terminal when x-terminal-emulator is on PATH."

verification = "Main unit test with injected environment and file checks: Code.exe under LOCALAPPDATA is found; code.cmd on PATH resolves to its Code.exe; Cursor is found under Program Files and from the cursor.cmd in resources\\app\\bin on PATH; a missing Cursor is not reported; Notepad++ under Program Files is found; wt.exe in WindowsApps is the terminal, else PowerShell with cmd.exe; rundll32.exe under System32 adds other; on linux code and cursor on PATH are reported and x-terminal-emulator on PATH is the terminal, other never; a link (as an app execution alias is) counts as present; shared contract test for the channel."

affected_paths = ["05_Software/src/apps/desktop/src/main/openers.ts", "05_Software/src/apps/desktop/src/main/index.ts", "05_Software/src/libraries/shared/src/ipc.ts", "05_Software/src/libraries/shared/src/documents.ts"]

