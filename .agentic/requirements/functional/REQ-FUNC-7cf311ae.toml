title = "Ask for the typed confirmation in the CLI"
status = "active"
requirement = "When the CLI receives a run_program approval that needs a typed confirmation, it shall show the risk, the command line, the notes and the named files and approve only when the user types the confirmation word at the interactive prompt, denying it under --approve all, --approve none or without a terminal."
verification = "promptApproval with an irreversible run_program request writes risk, command and files, answers `a` with a request to type burn-key, re-asks after a wrong word, approves after `BURN_KEY` and returns the typed text; flagDecision, which the run command uses, denies such a request under --approve all or none and without a terminal while other approvals keep their flag decisions."
