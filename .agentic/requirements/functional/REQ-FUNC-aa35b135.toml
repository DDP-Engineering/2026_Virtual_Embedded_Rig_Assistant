schema = 1

id = "REQ-FUNC-aa35b135"

title = "Extract documents within the resolved Document extraction time limit"

status = "active"

requirement = """
When a PDF or Office document is extracted for indexing, or a downloaded PDF is parsed, VERA shall give the extraction the resolved Document extraction time limit, an integer from 30 to 1800 seconds with default 120 set for the application, as its base deadline (PDFs still scale with size up to the larger of the base and 15 minutes), each extraction reading the value current when it starts.
"""

verification = "Core test: an extractor whose base getter reads 50 ms then 5000 ms times out the first slow job and completes the next; the indexer message carries the application value; a download save passes the session's value to the PDF parser."

