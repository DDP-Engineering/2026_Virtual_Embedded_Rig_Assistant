title = "Apply an approved candidate over the source board through the write flow"

status = "active"

requirement = """
When the agent calls apply_candidate for a kicad-layout run folder whose checks pass and the change is approved in ask mode or allowed by auto-edit or bypass mode, VERA shall write the candidate's bytes over the source board atomically through the write queue and record the change with the source's and the candidate's SHA-256.
"""

verification = "Core unit tests with a run folder fixture: in ask mode the approval request carries tool apply_candidate, the target path, both hashes, the byte count and a diff; after approval the target's bytes equal the candidate's and the change is recorded as applied; in auto-edit and in bypass mode it applies without a prompt (decided by the mode); the result names the path and hash. Real KiCad: the applied board reopens in the PCB editor and its footprints match the report."

