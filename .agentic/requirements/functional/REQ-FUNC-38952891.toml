title = "Identify the board, its health, operating system, architecture, user and remote root"

status = "active"

requirement = "When identify runs on a trusted connection, pi-tool shall report the board model, serial number, machine id, OS identity and version, architecture, kernel, Python version, login user and uid, boot id, helper version, the remote root check with its path and the board's health (temperature, decoded throttling state, memory, disk, load, uptime and running VERA tasks, with warnings for under-voltage, 80 C or more and less than 200 MB free), and shall end blocked with identity-mismatch when a declared serial, machine id or model differs from the board's, and (a defensive check behind the server's own refusal of another user) when the login user differs or is root."

verification = "identify in the WSL remote reports machine id, architecture, OS id, the user and uid, rootCheck ok with the folder's path and a health block with memory and disk; a registry machineId differing by one digit and a declared model the board lacks give identity-mismatch; a registry user the server does not accept ends auth-failed before the helper runs. The throttling state needs a Raspberry Pi and is not exercised."

