title = "Refuse a second holder of a resource in one process"

status = "active"

requirement = """
If a run claims an identity key that an unfinished run of the same runner holds, through any alias or from any session, or that an unfinished run names as a serial port, then the runner shall refuse it with BUSY naming the resource and the holding run before anything is spawned.
"""

verification = "Runner tests start a held background run for `psu` and request `psu`, the alias `psu-lan` with the same serial number, and a second session: each is BUSY with resource and handle and the fake host records no spawn; a serial-monitor style run naming COM3 blocks an ASRL3 instrument claim and the reverse; different keys run concurrently."

