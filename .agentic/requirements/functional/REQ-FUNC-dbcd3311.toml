title = "Give every run a standard input that ends at once"
status = "active"
requirement = "When a run starts, the process host shall give the program a standard input that ends at once - closed for a run without input, or exactly the run's input followed by end of input - so that a program reading standard input never waits."
verification = "Run the echo-program fixture in read-stdin mode through each compiled host with a 10 s timeout; it reports 0 bytes read and exits 0 well before the timeout, so the run is not timed out. With input, NodeProcessHost pipes stdin, writes the input once and closes it (node-process-host.test.ts), and mqtt-tool started by the real ProgramRunner reads exactly the credential line (mqtt-tools.test.ts)."
