title = "Probe a program's version and check its supported range"
status = "active"
requirement = "When the provisioner probes a program, it shall run the executable with its leading arguments and the manifest's version arguments, take the first capture of version.match from the output as the program's version and report the program ready when that version satisfies version.range or no range is declared."
verification = "Unit tests: probe output 'git version 2.44.0' with match 'git version (\\d+\\.\\d+\\.\\d+)' and range >=2.40 gives ready 2.44.0; the same without a range gives ready; range checks compare dotted numbers numerically (2.10 > 2.9)."
