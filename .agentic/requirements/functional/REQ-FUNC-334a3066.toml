title = "Refuse interleaved use of a resource inside a plan"

status = "active"

requirement = """
If a plan step names a serial port, probe or registry resource that a background step of the same plan still uses, then VERA shall refuse the plan at compilation.
"""

verification = "A test compiles a background serial capture on COM5 followed by a serial send on COM5 before its await and expects the refusal; the same send after the await compiles."

