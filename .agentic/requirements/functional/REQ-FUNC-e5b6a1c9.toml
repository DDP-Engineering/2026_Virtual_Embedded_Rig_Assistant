id = "REQ-FUNC-e5b6a1c9"

title = "Bounded whole-history compaction with a verbatim recent tail"

status = "active"

requirement = """
Above 80% of the input budget, the runtime shall summarize the history before the current user instruction from the earliest unsummarized message up to a cut index where every earlier tool call has its result and the message at the index is not a tool result, including turns split by queued steering, aborted turns and limit turns, keeping verbatim the most recent history of min(20,000 tokens, 20% of the input budget) counted like the request while the unreduced view fits the budget, with at most five summary passes per request, each covering the previous summary and the next history that fits, continuing while the view does not fit or remains above the trigger, preserving decisions, outstanding work, exact source refs and current instructions in the derived view while retaining the full durable transcript; all requests use current context/output limits and safety margin, and unavailable or failed summaries fall back to M1 reduction and explicit context-limit semantics.
"""

verification = "Replay many turns in a small window, including a turn split by a delivered queued message, an aborted turn and a limit turn: the passes summarize them, never separate a tool call from its result and leave the view at or below the trigger; in a 200,000-token window with an exact counter the verbatim tail holds 20,000 tokens, within per-message framing, and less than one more exchange; inspect every summary/normal request budget, preserved decisions/refs/current input and the unchanged full transcript; first-turn, oversized input, smaller model, invalid/failed summary and abort keep the M1 outcomes; thirty long exchanges stop after five passes."

