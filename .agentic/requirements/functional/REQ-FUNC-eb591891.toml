title = "Route workbench-scoped session requests to the named workbench"

status = "active"

requirement = "When a session list, sizes, search, move, create, image attach or image capability request names a workbench ID, the desktop app shall run it in the open workbench runtime with that ID, using the foreground runtime first, whichever workbench is in the foreground."

verification = "Router test with two runtimes: a request naming background A's ID runs in A and one naming foreground B's ID runs in B; boundary: a request without a workbench ID runs in the foreground runtime."

