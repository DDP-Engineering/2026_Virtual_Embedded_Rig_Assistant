title = "Remove a set of bookmarks atomically"

status = "active"

requirement = """
When the engineer removes one bookmark or a selected set, including Select all over the filtered rows, the session engine shall remove exactly those bookmarks in one transaction, refusing the whole request when any message is not a user message of the session, and never delete a message.
"""

verification = "Core test: removing two of three bookmarks leaves the third and every message; a request naming an unknown message leaves all three bookmarks and fails INVALID. Renderer test: Select all with an active filter selects only matching rows, and Remove selected sends exactly their ids."

