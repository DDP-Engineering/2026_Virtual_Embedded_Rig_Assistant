title = "Recover coherently from document publication during search"
status = "active"
requirement = """
When source publication changes a document search revision during ranking or hit validation, the search shall discard the affected attempt and use a coherent published snapshot, preserving applicable source and locator checks.
"""
verification = "Pause semantic rank and then Files source validation, publish a document, release the pause, and assert that each response only uses a validated revision and rejects stale references."
