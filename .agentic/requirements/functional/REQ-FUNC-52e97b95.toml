id = "REQ-FUNC-52e97b95"

title = "Refuse a new turn at the app-wide concurrent-turn limit"

status = "active"

requirement = """
When a message would start a new top-level or delegated turn while the active turns across every open workbench equal or exceed the resolved Concurrent turns limit, VERA shall refuse it with the error TURN_LIMIT carrying the limit, before it records a user message or event or sends a provider request.
"""

verification = "Core test with two services sharing one admission of limit 3: three turns run, a fourth send in either service fails TURN_LIMIT with params.limit 3, its session gains no event or message row and the gateway sees no fourth request; after one turn ends the next send starts a turn."

