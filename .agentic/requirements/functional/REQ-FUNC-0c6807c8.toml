title = "Inspect a firmware ELF offline"

status = "active"

requirement = """
When `gdb-elf inspect <elf>` names a workbench ELF file, the helper shall report its SHA-256, size, class, byte order, machine and ARM architecture profile, entry point, loadable segments, symbol counts, build id and the presence, DWARF versions, compilation units, producers and optimisation level of its debug information, without starting any other process.
"""

verification = "Integration tests inspect committed fixture ELFs built with zig cc 0.13.0 for Cortex-M4 (DWARF 4, two units, C11; clang records no -O level, so optimization is unknown with a limit), Cortex-M0+ (no debug sections) and RISC-V, and check the SHA-256 against the file; internals.py checks the -O parsing of GCC producer strings; the opt-in VERA_GDB_ORACLE_PYTHON test compares entry, machine, CPU attributes, symbol counts, units, DWARF versions and producers with pyelftools 0.32."

