title = "Bound large session fields sent to the renderer"

status = "active"

requirement = """
When main sends a session snapshot (session.get) or a session event to the renderer, VERA shall replace each tool preview or approval diff longer than 8 KiB and each tool argument value whose compact JSON is longer than 4 KiB (UTF-8 bytes) with its prefix cut at a character boundary, after scrubbing, and record the full byte size in the item's truncated field, while stored events, export and the agent's context keep the full content.
"""

