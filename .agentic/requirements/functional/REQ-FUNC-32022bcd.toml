title = "Open a candidate copy of a board in KiCad's PCB editor"

status = "active"

requirement = """
When the agent runs `kicad-layout-tool open --board FILE`, the helper shall copy the board and its project context into a new run folder, start KiCad's PCB editor on the copy, bind to the KiCad API whose open document is that copy, save the copy through KiCad and record the source and candidate hashes, the inventory and the DRC of the copy, leaving the source unchanged.
"""

verification = "Real KiCad on Windows: open on the fixture board exits 0 within 60 s with a PCB editor window on the copy; state.json's source SHA-256 equals the source file's and its candidate SHA-256 the saved copy's; board.json lists the fixture's footprints, nets and copper layers; drc-before.json exists; the source board and project files keep their hashes and no KiCad lock file appears beside them."

