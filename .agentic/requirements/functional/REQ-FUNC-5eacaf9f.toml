title = "End worker tasks at the resolved worker deadline"

status = "active"

requirement = """
When a grep or parse_log worker task runs longer than the resolved Worker deadline, an integer from 5 to 120 seconds with default 10 set for the application, VERA shall stop the task and report the timeout, a task keeping the deadline it started with.
"""

verification = "With a pool reading 5 s, a task blocked past 5 s ends with the timeout result; changing the value while a task runs leaves that task's deadline and applies to the next task."

