title = "Stop runs on session stop, workbench close and app exit"
status = "active"
requirement = "When a session is stopped, a workbench is released or the application exits, the runner shall stop every run of that session, of that workbench, or every run, respectively, and the desktop app and the CLI shall invoke these stops."
verification = "Unit: runs in two sessions and two workbenches; stopSession, stopWorkbench and stopAll stop exactly the matching runs and leave the others running. Registry tests: releasing a workbench runtime (Close, release of an idle workbench on navigation, release of a settled background workbench) stops the runs of its folder after its sessions drain and before its workbench closes, and a runtime retained in the background keeps its runs. Inspection: the desktop session.stop handler calls SessionService.stop, which stops the session's runs through the runner's stopSession; the before-quit drain runs stopAll first; CLI run.ts registers stopAll among its closing resources."
affected_paths = ["05_Software/src/libraries/core/src/plugins/runner.ts", "05_Software/src/apps/desktop/src/main/index.ts", "05_Software/src/apps/cli/src/run.ts", "05_Software/src/apps/desktop/src/main/workbench-runtimes.ts"]
linked_tests = ["05_Software/src/libraries/core/src/plugins/runner.test.ts", "05_Software/src/apps/desktop/src/main/workbench-runtimes.test.ts::releases an idle workbench as soon as another workbench opens", "05_Software/src/apps/desktop/src/main/workbench-runtimes.test.ts::closes only the current workbench while background workbenches keep running", "05_Software/src/apps/desktop/src/main/workbench-runtimes.replay.test.ts::continues a replay turn in A after B opens while B runs its own turn, then releases A", "05_Software/src/apps/desktop/src/main/workbench-runtimes.test.ts::keeps a busy workbench in the background and releases it once its work settles", "05_Software/src/apps/desktop/src/main/workbench-runtimes.replay.test.ts::closes the foreground workbench while a background turn continues and completes"]
