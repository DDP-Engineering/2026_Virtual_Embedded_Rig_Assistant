title = "Relate a chosen documentation folder to the workbench"

status = "active"

requirement = "When asked to relate a picked folder to a workbench folder, VERA shall return the picked folder's path relative to the workbench folder in forward-slash form, accepting a workbench folder reached through an alias above it; if the picked path is relative, then VERA shall reject it with INVALID; if it does not exist, then VERA shall reject it with NOT_FOUND; and if it is the workbench folder itself, lies outside it, is reached through a symbolic link inside the workbench (including one that loops back to the workbench folder or above) or is excluded by the workbench ignore rules, then VERA shall reject it with DENIED."

verification = "Core tests: <root>/manuals/st returns 'manuals/st'; a folder reached through a junction above the root is accepted; the root, an outside folder, a junction inside the root carrying the target's name and a junction looping back to the root give DENIED; a '..x' folder is accepted; service tests: an ignored folder gives DENIED, a relative path INVALID."

