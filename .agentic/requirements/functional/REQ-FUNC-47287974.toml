title = "Send attached entries as @path mentions"

status = "active"

requirement = "When the user sends a message with attached entries, the desktop app shall send the text followed, on a new line, by one @path mention per entry separated by spaces, writing a path that contains whitespace as @\"path\", or the mentions alone when the text is empty, and shall clear the chips once the send is accepted and keep them when it fails."

verification = "Unit test of the mention builder: plain paths, a path with a space and empty text; renderer test: sending 'Summarize' with docs/a.pdf attached invokes session.send with 'Summarize' and '@docs/a.pdf' on the next line and clears the chip; a rejected send keeps the chip and the text; with only an attachment the message is '@docs/a.pdf'."

affected_paths = ["05_Software/src/apps/desktop/src/renderer/components/session/composer.tsx", "05_Software/src/apps/desktop/src/renderer/lib/attachments.ts"]

