requirement = "When install-helper runs, pi-tool shall write the bundled remote helper to `~/.local/share/vera-pi/<version>/vera_pi_remote.py` on the board through the constant install command, which checks the received bytes against the bundled SHA-256 before writing, and shall report installed or already-installed with the path and hash; no other operation installs or updates it."

verification = "install-helper against the test server creates the file with the bundled hash and mode 0600; a second call reports already-installed, and after the file changed it reports replaced; identify before install ends helper-missing."

