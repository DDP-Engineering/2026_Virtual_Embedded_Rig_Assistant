title = "Install the remote helper when it is missing or differs"

status = "active"

requirement = "When a board call finds the remote helper missing or different from the bundled one, pi-tool shall write the bundled helper to `~/.local/share/vera-pi/<version>/vera_pi_remote.py` on the board through the constant install command, which checks the received bytes against the bundled SHA-256 before writing, repeat the call once and report the warning helper-installed; install-helper does the same on request and reports installed, replaced or already-installed with the path and hash."

verification = "The first identify against the test server creates the file with the bundled hash and mode 0600 and warns helper-installed; install-helper then reports already-installed; after the file changed, the next identify passes, warns helper-installed and the file holds the bundled hash again."

affected_paths = ["05_Software/plugins/raspberry-pi-linux/scripts/pi_support/remote.py", "05_Software/plugins/raspberry-pi-linux/scripts/pi_support/operations.py"]

