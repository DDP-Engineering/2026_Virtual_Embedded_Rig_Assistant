title = "End a silent model stream after the resolved no-output timeout"

status = "active"

requirement = """
When a model stream sends no output for the resolved Model no-output timeout, an integer from 30 to 3600 seconds with default 300 set per session or application, VERA shall end the request with the timeout error.
"""

