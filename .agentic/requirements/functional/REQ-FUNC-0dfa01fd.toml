title = "Release an idle workbench runtime"

status = "active"

requirement = "When the current workbench has no owned work as another workbench opens, or when the last owned work of a background workbench settles, the desktop app shall release that workbench by closing its sessions, stopping its plugin program runs and releasing its lock and database."
verification = "Registry tests with scripted runtimes: an idle foreground is released during navigation in the order sessions close, program stop for its folder, workbench close; a busy retained runtime is released only after its host signals settled and reports idle; a runtime that has work again, or is brought back to the foreground, before its queued release runs is kept; a failed release is logged and the runtime stays retained. Main test with real runtimes: A's lock file disappears after its held turn completes. SessionsHost test: a settled observer that throws does not fail the host operation."
affected_paths = ["05_Software/src/apps/desktop/src/main/workbench-runtimes.ts", "05_Software/src/apps/desktop/src/main/sessions.ts", "05_Software/src/apps/desktop/src/main/index.ts", "05_Software/src/libraries/core/src/sessions/service.ts", "05_Software/src/apps/desktop/src/main/display-documents.ts"]
linked_tests = ["05_Software/src/apps/desktop/src/main/workbench-runtimes.test.ts::keeps a busy workbench in the background and releases it once its work settles", "05_Software/src/apps/desktop/src/main/workbench-runtimes.test.ts::releases an idle workbench as soon as another workbench opens", "05_Software/src/apps/desktop/src/main/workbench-runtimes.test.ts::logs a failed release and keeps that workbench for the exit drain", "05_Software/src/apps/desktop/src/main/workbench-runtimes.replay.test.ts::continues a replay turn in A after B opens while B runs its own turn, then releases A", "05_Software/src/libraries/core/src/sessions/service.test.ts::reports active work as unsettled and signals the host once the turn settles", "05_Software/src/apps/desktop/src/main/display-documents.test.ts::ends identities only when their own workbench closes", "05_Software/tests/e2e/workbench-runtimes.spec.ts", "05_Software/src/apps/desktop/src/main/workbench-runtimes.test.ts::keeps a runtime that has work again or is back in the foreground when its queued release runs", "05_Software/src/apps/desktop/src/main/workbench-runtimes.replay.test.ts::keeps a held turn through failed opens, a return to its workbench and a reopen in place", "05_Software/src/apps/desktop/src/main/sessions.test.ts::resolves host operations when the settled observer throws"]


