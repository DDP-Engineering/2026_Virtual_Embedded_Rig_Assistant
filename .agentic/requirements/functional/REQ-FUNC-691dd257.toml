title = "Kill the process tree on Stop or abort"
status = "active"
requirement = "When Stop is requested for a run or the caller's abort signal fires, the runner shall kill the program's whole process tree and finish the run with stopped set."
verification = "A fake child that exits while its pipes stay open settles the host exit after the close grace and destroys the pipes, so timeout and Stop always finish. Start the echo fixture in grandchild mode as a background run through each compiled host, wait for its grandchild id, call stop; the result has stopped true and the grandchild no longer exists. A foreground run whose abort signal fires, an already aborted signal and a Stop that arrives before the spawn all finish with stopped true; the last two spawn nothing."
