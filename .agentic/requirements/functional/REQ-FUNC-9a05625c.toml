schema = 1

id = "REQ-FUNC-9a05625c"

title = "Stop indexing a selection above the workbench file limit"

status = "active"

requirement = """
When a reconciliation or Reindex selects more indexable documents than the workbench file limit (the larger of docs.maxFiles and 120 % of the approved count, rounded down), the Ingester shall create, change or remove no document row and shall emit an index.guard event with the selected count, that limit and the top folders.
"""

verification = "Core test over a generated temporary workbench of 12,000 small Markdown files with docs.maxFiles 10,000: the guard event reports files 12,000 and limit 10,000, no document row exists and no document was opened after Reindex; a workbench with rows indexed earlier keeps them unchanged when its selection grows past the limit."

affected_paths = ["05_Software/src/apps/desktop/src/main/index.ts", "05_Software/src/apps/desktop/src/main/events.ts", "05_Software/src/libraries/core/src/knowledge/ingest.ts", "05_Software/src/libraries/core/src/knowledge/guard.ts", "05_Software/src/libraries/core/src/workbench/service.ts", "05_Software/src/libraries/shared/src/events.ts", "05_Software/src/libraries/shared/src/documents.ts"]

linked_tests = ["05_Software/src/libraries/core/src/knowledge/ingest-guard.test.ts::stops an oversized selection before indexing anything and indexes after Index anyway", "05_Software/src/libraries/core/src/knowledge/guard.test.ts::stops only a selection above the limit", "05_Software/src/libraries/shared/src/documents-ipc.test.ts::carries the count guard on docs.volume and index.guard and approves only a positive count", "05_Software/src/apps/desktop/src/main/events.test.ts::transports ingest progress and redacts document paths while preserving status/hash/reason"]


