id = "REQ-FUNC-80b2033a"
title = "Match rule patterns against the whole command line"
status = "active"
requirement = "The matcher shall treat a rule pattern as space-separated tokens where * matches zero or more arguments, {a,b} matches any one listed alternative, a token ending in * matches any token with that prefix and any other token matches itself, and shall report a match only when the pattern covers the whole command line."
verification = "`esptool version` matches `esptool version` but not `esptool version --x`; `esptool * chip-id *` matches `esptool chip-id` (zero arguments on both sides) and `esptool --port COM3 chip-id --x`; `espefuse * burn-*` matches `espefuse burn-key` but not `espefuse burn-key k`, which `espefuse * burn-* *` matches; `{merge-bin,image-info}` matches either but not `merge`."
