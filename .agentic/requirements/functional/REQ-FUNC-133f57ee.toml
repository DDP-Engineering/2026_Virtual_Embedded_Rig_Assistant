id = "REQ-FUNC-133f57ee"

title = "Skip documents above the workbench file size limit"

status = "active"

requirement = """
When the document selection finds a document larger than its size limit, docs.maxFileMB (default 100 MiB, at most 500) for PDF and Office and the resolved Maximum text file size (an integer from 1 to 64 MiB, default 20, set per workbench) for text, the indexer shall return it as skipped with reason too-large instead of selecting it, record it as unsupported with reason SIZE_LIMIT without reading it, and leave it out of the selected document count and bytes.
"""

verification = "Core test over a temporary workbench: with maxFileMB 25 a 30 MB PDF is returned as skipped (too-large) and recorded unsupported/SIZE_LIMIT while a 1 MB PDF is selected; without maxFileMB a 30 MB PDF is selected and a PDF of 100 MiB + 1 byte is skipped; with maxFileMB 150 that PDF is selected; with textFileMB 1 a 2 MiB text file is skipped and maxFileMB does not change the text limit; a file exactly at the limit is selected; the volume counts only the selected files."

