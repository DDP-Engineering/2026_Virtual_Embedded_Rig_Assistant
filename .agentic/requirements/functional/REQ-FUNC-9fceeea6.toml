title = "Install indexes, cores and libraries only on an explicit install with exact versions"

status = "active"

requirement = """
When install names an index, a core VENDOR:ARCH@VERSION or a library NAME@VERSION, the arduino-tool helper shall install exactly that item into the VERA Arduino environment without post-install scripts and without library dependencies, accepting only https index URLs and refusing a missing or non-exact version with exit 2.
"""

verification = "The fake arduino-cli receives `core install arduino:avr@1.8.8 --skip-post-install` and `lib install Servo@1.2.2 --no-deps`; `install core arduino:avr`, `install library Servo@latest` and `install index --index-url http://x` are refused with exit 2 before arduino-cli runs; the real install of arduino:avr 1.8.8 and arduino:samd 1.8.14 succeeds."

