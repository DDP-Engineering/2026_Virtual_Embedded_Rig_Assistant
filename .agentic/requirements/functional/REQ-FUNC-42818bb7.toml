id = "REQ-FUNC-42818bb7"
title = "Capture a serial console until a stop condition"
status = "active"
requirement = "When the serial-monitor script runs with capture, it shall open the port (a device, a simulator's pseudo-terminal, or a socket:// or rfc2217:// address) at the given baud rate (with --baud auto the usual rate at which the largest share of the bytes it hears is text) and frame format with RTS released and DTR released once the port is open, copy every byte it reads to standard output as it arrives (with --hex as a dump of offset, bytes and printable text, with --timestamps with the seconds since reading began before each line), stop at the first of the duration elapsing, a line matching the until expression (a matching line that has not ended is first read to its line break or until 0.2 seconds pass without bytes) or the byte limit being reached, and print one summary line naming the reason to standard error."
verification = "Fake pyserial delivering a recorded ESP32 boot log in chunks: capture --until main_task stops after the chunk holding that line, stdout holds the bytes up to it, stderr's summary names until, and the fake recorded open at 115200 with dtr True and rts False followed by dtr False. A line anchored with $ matches although the device ends it with CR LF. Boundaries: --max-bytes 10 stops after exactly 10 bytes (max-bytes); a silent port stops after --duration 0.3 (duration); a match inside a line split across chunks still stops."
affected_paths = ["05_Software/plugins/serial-monitor/scripts/serial_monitor.py", "05_Software/tests/fixtures/serial-monitor/esp32s3-boot.log", "05_Software/tests/fixtures/serial-monitor/fake-pyserial/serial/__init__.py", "05_Software/tests/fixtures/serial-monitor/fake-pyserial/serial/tools/__init__.py", "05_Software/tests/fixtures/serial-monitor/fake-pyserial/serial/tools/list_ports.py"]
