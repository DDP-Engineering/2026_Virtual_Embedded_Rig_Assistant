title = "Share resource leases between VERA processes"

status = "active"

requirement = """
The runner shall reserve each claimed identity key for the run's lifetime in a lease file that every VERA process of the same user on the machine checks, so that the desktop app and the CLI refuse a resource held by the other with BUSY before any I/O, and shall remove its lease files when the run ends.
"""

verification = "A leases test acquires a key in one ResourceLeases instance and expects BUSY from a second instance with the same root; an integration test holds a lease in a separate Node process and expects BUSY in the test process, then success after that process exits; lease files are gone after release."

