title = "Preview the documents a selection indexes"

status = "active"

requirement = """
When asked to preview a documentation selection for a chosen folder, VERA shall return the number and total bytes of the documents that the indexer's document selection selects for that folder and its include, exclude, gitignore and maxFileMB settings (ignore rules, document kinds, ordinary files and size limits included), plus the number of matched legacy Office and RTF documents (.doc, .ppt, .xls, .rtf) that are not indexed, bounded only by a 5-second time limit, with a truncation flag that is true exactly when that limit stopped the count.
"""

verification = "Core tests: on the IDX-01 .gitignore fixture the preview count equals the indexed rows with the switch on and off; on the IDX-02 fixture with maxFileMB 25 it counts the 25 MB and small documents and not the 30 MB or 100 MiB + 1 byte PDFs, as indexed; a deeply nested document below 8 levels is counted; a legacy .xls is reported as not indexed; an exclude pattern removes matches; an invalid glob gives INVALID; an elapsed time limit sets truncated, a finished preview never does."

