title = "Check luminaire catalog items against the photometry"

status = "active"

requirement = """
When a luminaire type names an order code and the request names a catalog, lighting_design shall find that item in the industrial catalog, check its category luminaire, its photometry attribute against the type's file and its cited luminousFlux and activePower against the photometry within 10 %, and record the outcome as a catalog criterion that is unknown when a value is absent or not confirmed.
"""

