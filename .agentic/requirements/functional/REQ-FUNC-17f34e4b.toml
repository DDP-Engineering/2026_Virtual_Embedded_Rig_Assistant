title = "Refuse a download above its approved size"

status = "active"

requirement = """
If a download's response is larger than the size bound in its approval, VERA shall stop the transfer with the size error and save no file.
"""

verification = "Approved at 10 MiB, a 12 MiB response ends with the size error and leaves no file, and the transfer receives the approved budget; approved at 20 MiB, the same response is saved; a transfer port budget of 64 bytes refuses a larger body."

