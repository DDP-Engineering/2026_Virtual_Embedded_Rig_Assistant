title = "Catalog check reports package and reference issues"

status = "active"

requirement = "When the catalog check runs on a catalog source, it shall print one line per issue with its place and code (source files that are missing or invalid, plugin folders that fail the store's import checks or manifest validation including a manifest id that differs from its folder name, and pack, requires, official or reviewed entries that name no plugin or rule) and exit with 1, or exit with 0 when there is no issue."

verification = "Core test on fixture sources: the official plugins folder has no issue; a folder whose manifest id duplicates another plugin's id reports `manifest` with `id`; an invalid plugin.yaml, a missing packs.yaml and a pack naming an unknown plugin each report their code. CLI integration test: `vera catalog check` exits 0 on a clean source and 1 with the issue lines on a broken one."

