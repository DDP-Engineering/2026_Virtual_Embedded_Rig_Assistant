title = "Skip background compaction when it is off"

status = "active"

requirement = """
While the resolved Background compaction switch is off for a session's workbench or application, VERA shall not start a summary after a turn ends, and shall compact at the next request when needed.
"""

verification = "With the switch off and a finished turn above the trigger, no summary request runs after the turn; the next request compacts before it is sent. With the switch on, the summary runs after the turn."

