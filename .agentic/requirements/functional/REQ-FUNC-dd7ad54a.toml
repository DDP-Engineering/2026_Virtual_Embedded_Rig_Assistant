title = "Export the BOM and the 2D layout of a stored panel result"

status = "active"

requirement = """
When asked to export a stored panel result, VERA shall return, without writing anything, the BOM as CSV (one line per equipment and terminal strip, fields quoted where needed, formula-like cells neutralised) or the 2D layout as SVG drawn in millimetres (plate, zones, ducts, rails and each placed equipment with its tag; unplaced tags listed), and shall refuse a result of another producer.
"""

