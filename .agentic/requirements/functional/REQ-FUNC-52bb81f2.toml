title = "Compute average power from voltage and current with a stated sign convention"

status = "active"

requirement = """
When a request declares an average-power measurement, the helper shall integrate voltage times current over the window and divide by its length, state the sign convention, and never report the peak of the instantaneous power as the average.
"""

verification = "A resistor driven by a 50 % square wave through a sense source gives the analytic average power 7.058 W (positive, absorbed), different from the 14.116 W peak; the supply's own v x i over the same window is negative, -7.129 W (delivered)."

