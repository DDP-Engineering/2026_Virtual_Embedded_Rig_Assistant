title = "Install a plugin from a folder"
status = "active"
requirement = "When the user installs a plugin from a folder whose name equals the manifest id, the plugin store shall copy every file of the folder to <userData>/plugins/installed/<id>/, write install.json with format 1, the version, tier local, the source kind and path, the integrity hash, the install time and an empty program version map, and list the plugin as valid from a new store instance."
verification = "Install the fixture plugin folder, then construct a second PluginStore on the same root (a restart) and assert list() returns the plugin with no issues, install.json holds the recorded fields and hash, and the copied files equal the source bytes; a folder whose name differs from the manifest id is refused with INVALID."
