title = "Run one transfer, and several steps on one configured bus"
status = "active"
requirement = "When transfer runs, bus-tool shall send the given bytes and read the given count in exactly one data request framed for the mode (I2C address with a restart before reads, SPI chip select around it) and report the written and read bytes and the duration; on a UART it shall send the bytes in one data request and take the bytes the adapter passes on by itself until the count arrived, the line fell silent for 0.3 seconds or the timeout passed, passing with the warning short-read when fewer arrived and ending fail (no-response) when none did. When write-register runs it shall send the register's bytes followed by the value in one data request, and when sequence runs it shall run its read, write, transfer and delay steps in order between one configuration and one final state, ending at the first step that fails."
verification = "Simulated I2C EEPROM write then read, SPI flash status read and UART echo peer: pass with the bytes; one data request each. A UART peer that answers 4 of 16 bytes: pass with short-read; no answer: exit 1 no-response. write-register on the EEPROM: one data request with address, register and value. A sequence of read, write, delay, read, transfer, read: one configuration and one release on the wire, five data requests; a sequence whose first read is not acknowledged: one data request, nack."
