title = "Run arduino-cli only with VERA's own Arduino environment and an offline configuration outside install"

status = "active"

requirement = """
The arduino-tool helper shall run every arduino-cli command with a generated configuration whose directories lie under the VERA Arduino environment root and, for every operation except install, a dead loopback proxy, so that no operation other than install reads or writes the Arduino IDE's folders or reaches the network.
"""

verification = "A fake arduino-cli records its argv and the configuration it receives: every call carries --config-file naming directories under VERA_ARDUINO_HOME and, except install, network.proxy http://127.0.0.1:9; with the real arduino-cli, `core update-index` under the offline configuration fails while compile of an installed core succeeds."

