requirement = "When run-task runs, pi-tool shall first send the project's new and changed files and install changed requirements, then the remote helper shall start the declared task through a detached supervisor that records a handle, the task's PID, process start time and boot id, the budget and output limit, and pi-tool shall pass the task's output on while it runs, wait for its end and report exit code or signal, duration and the stdout and stderr logs, showing all of a short log and the beginning and end of a long one."

verification = "run-task of the fixture task passes with exit 0, a PID, the handle and logs holding its output; after an edit of app.py one run-task call reports the file applied and prints the new output, which also arrives on stderr; a task exiting 3 ends fail with exit code 3; a task ended at its budget keeps what it had printed."

