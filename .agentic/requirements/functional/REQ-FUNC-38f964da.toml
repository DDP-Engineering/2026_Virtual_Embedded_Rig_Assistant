title = "Give a script program the resolved path of a sibling program it uses"

status = "active"

requirement = """
When VERA resolves a program that declares `uses`, it shall also resolve each used program of the same plugin and give the run its absolute path as `VERA_PROGRAM_<NAME>`, and the program shall not resolve when a used program does not.
"""

verification = "A fixture plugin with a script program using a found program receives VERA_PROGRAM_<NAME> with that path in its environment; with the used program missing the script program resolves to nothing."

