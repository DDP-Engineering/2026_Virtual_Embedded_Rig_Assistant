title = "Refuse a terminal above the resolved Terminals per workbench"

status = "active"

requirement = """
When the user or a chat command block opens a terminal while the open workbench already has the resolved Terminals per workbench number of terminals (an integer from 1 to 16, default 8, set for the application), VERA shall refuse the new terminal with BUSY and disable the Terminal tab's New terminal button, keeping every terminal already open.
"""

verification = "Desktop main test: with the default the ninth create is refused with BUSY; with the application value 2 the third is refused; lowering it to 1 with two open leaves both open and refuses a new one; with 12 a ninth opens. Renderer test: New terminal is disabled at the resolved count. Inspection: the terminal.list IPC response and the agent read schema allow 16 terminals."

