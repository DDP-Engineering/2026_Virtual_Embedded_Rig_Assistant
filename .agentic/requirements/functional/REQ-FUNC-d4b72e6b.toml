title = "Report the physical state of a supervised run"

status = "active"

requirement = """
When a run with resource leases ends, the runner shall report its physical state as `confirmed`, `unchanged` or `unknown` in the run result and the run log, record `unknown` for each claimed key, and clear a recorded `unknown` when the program reports the state confirmed.
"""

