title = "Reopen the current workbench in place"

status = "active"

requirement = "When the user opens the workbench that is already current, the desktop app shall reopen it in place without closing its sessions or user terminals, so that its active turns, program runs, terminals and session service continue."
verification = "Registry test: opening the current folder calls open on the same runtime without draining its sessions, creates no new runtime and releases nothing; repeated navigation A, B, A, B reuses the retained runtime of each folder. Main test with real runtimes: reopening A while its turn is held keeps the same session service and the turn completes. SessionsHost test: the service is kept unless the reopen replaced the database handle. Native e2e: A's terminal is still listed after reopening A."
affected_paths = ["05_Software/src/apps/desktop/src/main/workbench-runtimes.ts", "05_Software/src/apps/desktop/src/main/sessions.ts", "05_Software/src/apps/desktop/src/main/index.ts", "05_Software/src/libraries/core/src/workbench/service.ts"]
