title = "Retain a busy workbench in the background during navigation"

status = "active"

requirement = "When the user opens or creates another workbench while the current workbench has owned work (queued session operations, active turns, undecided approvals or background compaction), the desktop app shall keep the previous workbench open in the background with its own session service, database handle, write queue, lock, indexing and plugin program runs, so that its turns continue and complete in that workbench."
verification = "Main test with real WorkbenchService and SessionsHost runtimes and a replay gateway held at a gate: start a turn in A, open B, observe A's lock file and session service still in place and its program runs not stopped, release the gate and observe A's turn end with stopReason end and its final assistant reply persisted in A's database; boundary: the registry keeps A only while its host reports owned work."
