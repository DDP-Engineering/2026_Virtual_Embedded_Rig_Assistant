title = "Announce session activity changes"

status = "active"

requirement = "When a session's turn starts or ends, an approval is requested or decided, a session's title or status changes, or a workbench runtime is opened, kept in the background, brought back or released, the desktop app shall emit the application event session.activity."

verification = "Core test: over a replay turn with an approval and a later rename, the session host's activity observer is called exactly once per published turn.started, turn.done, approval.requested, approval.decided and session.updated with a title or status, and not for the turn's message deltas. Registry test: every lifecycle change, a failed open included, and a settled release call the change observer. Shared schema test accepts the session.activity app event without a payload."

