title = "Pause automatic compaction for a session"

status = "active"

requirement = """
While a session's Automatic compaction switch is off, VERA shall make no new summary for that session's requests, keep using a summary already adopted, and fail a request that no longer fits with the context-limit error.
"""

verification = "Turn the switch off in a session above the trigger: the next request sends full history without a summary request; a request over the budget ends with CONTEXT_LIMIT; turning the switch on compacts at the next request."

