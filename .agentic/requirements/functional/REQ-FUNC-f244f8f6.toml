title = "Install a reviewed catalog plugin with its tier"

status = "active"

requirement = "When the user installs a catalog plugin with the integrity hash its review returned, the catalog shall re-verify the kept zip against the index entry, install it bound to that hash with the entry's tier and source `catalog` naming the zip URL, and remove the kept zip, refusing with CONFLICT when the kept zip is missing or changed."

