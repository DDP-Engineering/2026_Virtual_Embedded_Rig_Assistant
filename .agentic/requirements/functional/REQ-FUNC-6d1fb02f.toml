title = "Copy the selected document text from the menu"

status = "active"

requirement = "When the engineer chooses Copy in a document's context menu, the desktop app shall copy the text that was selected in the document when the menu opened to the system clipboard; while no text inside the document is selected, Copy shall be shown disabled."

verification = "Renderer test: with 'uart 5' selected in a log, Copy runs the copy command on that selection after the menu took focus; with nothing selected, or a selection outside the document, Copy is aria-disabled and does nothing; native e2e: selecting a cited log line and choosing Copy puts its text on the system clipboard."

