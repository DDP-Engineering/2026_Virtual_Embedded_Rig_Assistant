title = "Compute conduction loss from an RMS or pulsed current"

status = "active"

requirement = """
When a `losses` model takes a current descriptor, the script shall use an RMS value as given for the whole period, or derive RMS `peak*sqrt(duty)` and average `peak*duty` from a pulse, and return the resistive loss `I_rms^2 * R`.
"""

verification = "`resistor` and `mosfet` with `{rms: 2 A}` and 50 mΩ give 0.2 W; a 4 A pulse at duty 0.25 gives the same 0.2 W with results `currentRms` 2 A and `currentAverage` 1 A; `voltageRms` 1 V across 5 Ω gives 0.2 W; `{dc: 2 A}` gives 0.2 W."

