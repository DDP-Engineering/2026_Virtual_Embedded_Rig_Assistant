title = "Run power captures as HIL steps"

status = "active"

requirement = """
When a HIL plan uses the steps power.identify or power.capture, the executor shall run them through the power-profile program with the meter reserved, power.capture may run in the background, and a later lab-validate.compare source may name a power.capture step, which binds to the step's capture folder.
"""

