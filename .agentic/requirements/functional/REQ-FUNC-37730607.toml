id = "REQ-FUNC-37730607"
title = "Prepare a library set from a pinned bundle for one firmware major version"
status = "active"
requirement = "When prepare-libraries runs with library names, a CircuitPython major version and a bundle tag, circuitpython-tool shall take the Adafruit bundle zips of that tag for the py platform and that major version's .mpy platform, resolve every dependency named in the bundle's requirements, copy only those libraries' files into the run folder and write a library-set manifest with the bundle zips' and every file's SHA-256, without accessing any CircuitPython volume."
verification = "Fixture bundle with adafruit_bme280 requiring adafruit_bus_device and adafruit_register: prepare-libraries --library adafruit_bme280 --circuitpython 9 --bundle-tag 20261110 writes library-set.json listing the three libraries (two with requiredBy adafruit_bme280), their 9.x-mpy files with hashes, the zip hashes and platform 9.x-mpy; no other library is copied; the simulated volumes are unchanged."
affected_paths = ["05_Software/plugins/circuitpython/scripts/circuitpython_support/bundle.py", "05_Software/plugins/circuitpython/scripts/circuitpython_support/conventions.py"]
linked_tests = ["05_Software/tests/integration/circuitpython.test.ts"]
