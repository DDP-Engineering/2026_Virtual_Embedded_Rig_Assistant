title = "Install a plugin's programs on the user's request"
status = "active"
requirement = "When the renderer requests plugins.provision for an installed plugin without issues, the desktop shall install every program of the plugin that is not ready, one install at a time with one deadline per program, record each version as soon as it is probed and return the resulting statuses, answering NOT_FOUND for an id that is not installed and INVALID for a plugin with issues."
verification = "Provisioner tests: two programs install one after the other (the second uv spawn starts after the first exits) and the statuses come back ready; an unknown id is NOT_FOUND, a plugin whose files changed is INVALID; closing the provisioner kills a running uv, rejects the install and keeps the version recorded before it; channel schema and mock tests cover plugins.provision."
