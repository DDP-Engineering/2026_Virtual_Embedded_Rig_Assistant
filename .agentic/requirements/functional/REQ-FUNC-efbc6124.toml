id = "REQ-FUNC-efbc6124"
title = "Compose launcher arguments before the command"
status = "active"
requirement = "When a program has a launcher, the runner shall start the launcher's executable with its fixed arguments followed by command tokens in argv mode or one platform-quoted command string in string mode, with Bash backslashes escaped and PowerShell using literal backslashes and a generated call operator before the quoted executable."
verification = "launcherArgs argv appends tokens; Linux string quotes each token and doubles backslashes; Windows string quotes each token with literal backslashes and prefixes a generated call operator. Spaced and empty arguments stay exact in both transports. Official EIM 0.20.1 activation probes on Windows and Ubuntu validate the parser contract."
affected_paths = ["05_Software/src/libraries/core/src/plugins/launcher.ts"]
linked_tests = ["05_Software/src/libraries/core/src/plugins/launcher.test.ts"]
