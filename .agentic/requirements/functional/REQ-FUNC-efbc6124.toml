title = "Compose launcher arguments before the command"
status = "active"
requirement = "When a program has a launcher, the runner shall start the launcher's executable with the launcher's arguments followed by the command tokens, and in one-string mode followed by one argument holding each command token wrapped in double quotes, separated by spaces, with trailing backslashes doubled."
verification = "launcherArgs([run], [idf.py, build], argv) is [run, idf.py, build]; in string mode it is [run, '\"idf.py\" \"build\"']; a token `C:\\dir\\` becomes `\"C:\\dir\\\\\"`; an empty token becomes `\"\"`."
