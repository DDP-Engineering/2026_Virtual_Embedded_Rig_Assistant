title = "Order the sessions of a workbench as the user arranged them"

status = "active"

requirement = "When the user moves a non-archived session of the active workbench up or down, VERA shall persist the resulting order of that workbench's session ids in the user settings and list its sessions in that order, with sessions absent from the stored order first, newest first, and ids of deleted sessions dropped."

verification = "Main/core test: with three sessions, moving the oldest up twice lists it first; a session created afterwards is listed first; deleting a session removes its id from the stored order on the next move; archived sessions keep their own group and are not moved; the order is kept per workbench."

