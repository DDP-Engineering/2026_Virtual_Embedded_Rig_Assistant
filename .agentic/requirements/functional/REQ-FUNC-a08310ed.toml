title = "Accept a parameter as evidence only under the conditions a constraint names"

status = "active"

requirement = """
When parts-compare checks a constraint that names conditions, it shall accept a parameter value as evidence only when the value is stated under conditions that satisfy them, and never a value of another parameter.
"""

verification = "For 24 V / 5 A with a 3.3 V gate drive, RDS(on) stated only at VGS 10 V together with VGS(th) 0.9 V gives `unknown` with the reasons; RDS(on) stated at VGS 2.5 V within the limit gives `pass`."

