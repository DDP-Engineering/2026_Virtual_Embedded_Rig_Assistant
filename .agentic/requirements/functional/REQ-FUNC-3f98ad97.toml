schema = 1
id = "REQ-FUNC-3f98ad97"
title = "Bind a CIRCUITPY volume to a serial port only by matching UID"
status = "active"
requirement = "When a CIRCUITPY volume's boot_out.txt names a UID that equals, ignoring letter case, the USB serial number of exactly one serial port, circuitpython-tool shall report that port as the volume's bound port and use the port's identity key as the volume's identity key; otherwise it shall report the volume unbound and key it as circuitpy-uid:<UID>, or volume-serial:<file-system serial> without a UID."
verification = "Bench: volume UID E6614C31 and port serial e6614c31 -> bound, identity usb:239a:80f4:e6614c31 (the port's key); a volume without a matching port -> unbound, circuitpy-uid:...; a volume whose boot_out.txt has no UID -> volume-serial:<serial>, stable false; a UID that two ports report -> unbound."
affected_paths = ["05_Software/plugins/circuitpython/scripts/circuitpython_support/volumes.py"]
