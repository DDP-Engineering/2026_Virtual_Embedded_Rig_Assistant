title = "Group supplier offers of one manufacturer part number into one device"

status = "active"

requirement = """
When suppliers return offers whose manufacturer part numbers are equal and whose manufacturers share their first word, the host shall list them as offers of one device, and offers of different manufacturer part numbers as separate devices.
"""

verification = "A fixture with a cut-tape and a reel offer of one MPN from two suppliers (`INFINEON` and `Infineon Technologies`) gives one device with two offers; two MPNs that differ only in a pinout suffix give two devices; the same MPN from manufacturers with different first words gives two devices."

