id = "REQ-FUNC-25254fe8"
title = "Report timed-out model requests as timeouts"
status = "active"
requirement = """
If a model request reaches its response-header wait or its no-model-output timeout, then the session engine shall end the request with a PROVIDER error of reason timeout whose localized message names the limit in seconds.
"""
verification = "Gateway test with a fetch that never answers: custom connections with a 45 second and a default header wait and an OpenAI model yield PROVIDER reason timeout with seconds 45, 300 and 30, not OFFLINE; a caller abort during the header wait yields aborted and no timeout. Timed gateway test: a stalled stream yields PROVIDER reason timeout with the limit's seconds. The en, ro, de and fr catalogs contain provider.timeout with the seconds placeholder."
