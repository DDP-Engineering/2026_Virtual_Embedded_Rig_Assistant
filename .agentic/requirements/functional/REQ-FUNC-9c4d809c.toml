requirement = """
When an edit is saved, the helper shall run kicad-cli DRC on the candidate with zones refilled, and with schematic parity when the candidate folder holds the board's schematic, and set the objectives to fail with the new violations listed when DRC reports an error-severity violation that the DRC after open did not report or more unconnected items than after open, and to pass otherwise.
"""

