id = "REQ-FUNC-1219a1e4"

title = "Mark the user message at the reading position"

status = "active"

requirement = """
While the conversation scrolls, VERA shall mark as current the last user message whose start lies at or above scrollTop + min(80, clientHeight / 4), or the first one when none does, using the measured positions without re-measuring every message on each scroll.
"""

verification = "Unit tests check the reading line, before-first and after-last cases; browser tests scroll manually and check aria-current, and a 500-message run checks that scrolling does not re-measure anchors."

