schema = 1

id = "REQ-NFR-4721c12f"

title = "Calibrate the request token count from provider-reported usage"

status = "active"

requirement = """
When provider token counts are enabled, the context policy shall use the same model's accepted session ratio or, on the first request of a fresh session, the most recently saved ratio for that provider and model in the same application data folder, applying the configured margin (10% by default) and capping the result at the conservative estimate. A cold model, or a different model selected in an existing session, shall count at half the conservative estimate until that model reports usage.
"""

verification = "Measure an accepted normal request, then start a fresh session using the same application data folder and model and verify the first dispatch uses ceil(estimate x ratio x 1.1), capped at the conservative estimate. With a different model, connection or data folder, a cold request uses ceil(estimate x 0.5). A report below 0.12 and a corrupt or unavailable cache leave the cold count. Disabled provider counts use the conservative estimate, cold or measured. A first request of 30 000 bytes, refused by the conservative estimate, fits a 32K model cold. A second CLI invocation dispatches a warm request that a cold 32K session refuses."

