id = "REQ-NFR-4721c12f"

title = "Calibrate the request token count from provider-reported usage"

status = "active"

requirement = """
When provider token counts are enabled, the context policy shall use the same model's accepted session ratio or, on the first request of a fresh session, the most recently saved ratio for that provider and model in the same application data folder, applying the configured margin (10% by default) and capping the result at the conservative estimate, with conservative counting for a cold model or a switch to a different model in an existing session.
"""

verification = "Measure an accepted normal request, then start a fresh session using the same application data folder and model and verify the first dispatch uses ceil(estimate x ratio x 1.1), capped at the conservative estimate. With a different model, connection or data folder, a cold request uses the conservative estimate. A report below 0.12, corrupt or unavailable cache and disabled provider counts introduce no scale. A second CLI invocation dispatches a warm plugin-heavy request that a cold 32K session refuses."

