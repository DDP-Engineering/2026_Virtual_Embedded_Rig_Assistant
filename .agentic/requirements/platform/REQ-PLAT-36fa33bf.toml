title = "Run chat code blocks in a Constrained Language PowerShell terminal"

status = "active"

requirement = """
When the user runs a PowerShell chat code block in a pristine PowerShell terminal whose language mode is
Constrained Language (as under a host application control policy), the desktop shall show the initial prompt
and run the block's exact text once at that prompt, as it does in a Full Language terminal.
"""

verification = "Native e2e on a Windows host whose PowerShell runs in Constrained Language: Run a three-line block that writes 'Știință 🧪' and 'second line' to result.txt; the Terminal tab opens, result.txt holds the two lines once and the terminal is no longer eligible; a second Run into another pristine terminal appends them once more. Unit: the startup script keeps the Full Language branch and prompts outside Full Language with allowed cmdlets behind a distinct private marker; for a terminal that reported that marker the dispatched line decodes back to the exact text, including surrogate pairs and quotes, while a Full Language terminal still receives the base64 line."

affected_paths = [
  "05_Software/src/apps/desktop/src/main/terminal-command-prompt.ts",
  "05_Software/src/apps/desktop/src/main/terminals.ts",
]

