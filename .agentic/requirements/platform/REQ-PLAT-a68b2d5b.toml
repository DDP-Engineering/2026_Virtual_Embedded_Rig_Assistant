id = "REQ-PLAT-a68b2d5b"
title = "Sign configured Windows distributions and expose build identity"
status = "active"
requirement = """
When Windows signing credentials are supplied, the packaging pipeline shall require Authenticode signing of the executable and NSIS distribution, while builds without credentials remain permitted and report their unsigned state through app.info; instrumented identity is visibly labelled in the product name (VERA Test) and the app identifier, and the About page shall show the same application identity without build or signing labels.
"""
verification = "Assert signing configuration and compiled identity; inspect actual unsigned executable/installer when credentials absent and the app.info signing value through ordinary IPC; component test confirms About shows name, version, platform, architecture, portable and locale in all supported languages with no build or signing row. A requested signing failure aborts; supplied-credential acceptance verifies actual Authenticode status."
