requirement = """
Where the host has tshark with Npcap on Windows or dumpcap capture permissions on Linux, when the user approves a bounded live tshark capture, VERA shall run it and save the captured packets to the requested workbench capture file.
"""

verification = "With VERA_TSHARK_LIVE_INTERFACE naming a loopback interface, run the opt-in test: an ask session waits for the device-read approval without starting tshark, then after approval captures three self-sent UDP datagrams to captures/live.pcapng and reads them back; record the host and output. A denied approval starts no process (covered by the sample-capture test)."

