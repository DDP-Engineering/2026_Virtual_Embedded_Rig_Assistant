title = "Refuse a duty cycle combined with an RMS current"

status = "active"

requirement = """
If a current descriptor gives `duty` together with `rms` or `dc`, mixes two forms, or gives an average above its RMS, then the script shall refuse the request with code `contradiction`, and exit 2.
"""

verification = "`{rms: 2 A, duty: 0.5}` gives `contradiction` on the current field with a message that an RMS value already covers the whole period; `{rms: 1 A, average: 2 A}` and `{dc: 1 A, shape: pulse, peak: 1 A, duty: 0.5}` are refused with `contradiction`."

