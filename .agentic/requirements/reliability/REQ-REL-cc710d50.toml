title = "Refuse a model change when the file changed after preparation"

status = "active"

requirement = """
If the electrical model file changed between the preparation and the application of an electrical_model_change, then VERA shall refuse the write as a conflict and leave the file as it is.
"""

verification = "Core unit tests: two changes prepared on the same model; the first applies, the second fails with a conflict and the file holds only the first change; a change prepared before the file was created fails when another change created it."

