title = "Refuse an owned workbench database in another schema before writes"

status = "active"

requirement = """
When an owned workbench database fails current-schema or identity validation, core shall fail INVALID or CONFLICT, release the lock it acquired for that open, and leave the database and WAL bytes unchanged while another connection keeps the database open.
"""

verification = "Owned database whose meta schema_version is 0/2/99/text with a live WAL: openDb fails INVALID with vera.db and vera.db-wal hashes unchanged. WorkbenchService.open of a workbench with schema_version 99 and a dead owner lock: INVALID, vera.db unchanged, no lock or WAL left, recents unchanged, the previous workbench stays open."

