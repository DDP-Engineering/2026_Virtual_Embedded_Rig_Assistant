title = "Bound live capture duration and cumulative volume"
status = "active"
requirement = "When accepting a capture, VERA shall enforce finite host bounds on elapsed capture time (30 seconds by default, 3600 at most), packet snapshot length, cumulative bytes (16 MiB by default, 64 MiB at most) and rolling segment count, and shall return a capture's ID at once instead of waiting when it rotates, is asked to run in the background or lasts longer than 60 seconds."
verification = "Assert compiled native and runner limits at their boundaries and their defaults, observe deadline and volume expiry with stand-ins and bounded loopback proof, and start a 600-second capture that returns its ID while dumpcap runs."
