title = "Mark incomplete supplier answers as partial"

status = "active"

requirement = """
If a supplier answers with errors next to results, or some of its items cannot be read, then the host shall return the readable items and report that supplier with status `partial`.
"""

verification = "A Mouser fixture with an Errors entry and two parts gives two items and `partial`; a fixture item without a part number is left out and the supplier is `partial`; an answer with errors and no parts gives `failed`."

