title = "Refuse a routed session request whose workbench changed"

status = "active"

requirement = "If the workbench runtime a session request was routed to no longer has the same workbench open (ID, folder and database) when the request's turn on its session host comes, the desktop app shall answer CONFLICT without running the request."

verification = "Router test: route a request to a runtime, then replace that runtime's open workbench before its queued slot runs; the request answers CONFLICT and its operation never runs; boundary: an unchanged runtime runs it."

