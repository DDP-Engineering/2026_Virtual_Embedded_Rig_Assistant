title = "Refuse a compile whose core is missing or whose named core or library is missing or in another version"

status = "active"

requirement = """
If a compile's platform is not installed or differs from a --core version the request names, or a library the request names with --library is not installed or not in its named version, then the arduino-tool helper shall refuse with exit 2 and a diagnostic naming the install command, without installing anything and without compiling.
"""

verification = "With the fake arduino-cli reporting arduino:avr 1.8.6 installed, `compile --core arduino:avr@1.8.8` exits 2 with core-version naming `arduino-tool install core arduino:avr@1.8.8` and no compile call; an uninstalled platform gives core-missing and a --library absent from lib list gives library-missing; no install call appears in the recorded argv and no run folder is written."

affected_paths = ["05_Software/plugins/arduino-cli/scripts/arduino_support/compile.py"]

linked_tests = ["05_Software/tests/plugins/arduino-cli.test.ts"]


