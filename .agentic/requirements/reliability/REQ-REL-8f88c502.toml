title = "Report incomplete data, other product kinds and uncovered conditions as unknown or not evaluated"

status = "active"

requirement = """
If a value, band, tolerance, operating time, condition or product kind needed by a criterion is absent, only extracted, outside the requested conditions or of another capacity kind, then VERA shall report that criterion unknown or not-evaluated with the reason and shall never report pass for it; a candidate passes its selection only when every criterion passes, and the run is completed only when every criterion is pass or fail.
"""

