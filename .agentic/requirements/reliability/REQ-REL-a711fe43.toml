title = "Record missing samples and overflow explicitly in a capture"

status = "active"

requirement = """
When the driver delivers a sample-id skip or NaN samples in any channel, or a sample exceeds the active range limit, the capture shall record those samples as missing (empty cells, a gap list for the current and per-channel missing counts) or as overflow flags, never as zero, and its status shall be incomplete.
"""

