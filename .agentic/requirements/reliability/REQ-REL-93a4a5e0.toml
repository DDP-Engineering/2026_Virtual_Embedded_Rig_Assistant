id = "REQ-REL-93a4a5e0"

title = "Snapshot a foreign workbench database asynchronously"

status = "active"

requirement = """
When VERA opens a workbench read-only, core shall query an asynchronously made private copy of its vera.db and WAL, and shall fail BUSY when the source changes during both the copy and one retry or the copy is refused with EBUSY or EPERM.
"""

verification = "Live foreign owner with WAL rows: read-only open sees the WAL rows, refuses writes, and the source DB/WAL/SHM bytes stay unchanged; a source whose WAL changes during each copy attempt fails BUSY after two attempts; a copy rejected with EBUSY fails BUSY."

