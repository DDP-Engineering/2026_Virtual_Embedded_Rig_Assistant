title = "Suspend auto-follow after a message jump"

status = "active"

requirement = """
When the user jumps to a message, VERA shall stop following the end of the conversation until the user explicitly returns to the end by scrolling, dragging or End, so that a reply that is still streaming or a jump near the end does not pull the view back.
"""

verification = "Browser tests jump into history while a mock reply streams and check the view stays; jump to a message near the end; then return to the end and check that following resumes."

