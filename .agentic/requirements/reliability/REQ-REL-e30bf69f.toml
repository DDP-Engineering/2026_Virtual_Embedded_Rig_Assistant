title = "Refuse an edit of a candidate that changed since it was checked"

status = "active"

requirement = """
If the request's candidate hash or the candidate file's hash differs from the hash in state.json, or the candidate's in-memory board text differs from the text recorded after the last save, then the helper shall refuse the edit with exit 2 and the problem `changed`, changing nothing.
"""

verification = "Offline: a request with an older candidate hash and a candidate file edited on disk each exit 2 with problem changed and no connection attempt. Real KiCad: after a move made without saving through a second API client in the candidate window, the edit exits 2 with problem changed and that move stays unsaved in the window."

