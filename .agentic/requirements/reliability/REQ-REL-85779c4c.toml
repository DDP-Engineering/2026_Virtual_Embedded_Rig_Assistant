title = "Name authentication, network and API failures distinctly with their remote state"

status = "active"

requirement = """
If wokwi-cli fails to connect with HTTP 401 or 403, fails to connect otherwise, loses its connection or reports an API error, then wokwi-tool shall end with outcome auth-failed, network-error (both remote not-started), connection-lost (incomplete) or api-error (error, remote unknown) respectively.
"""

