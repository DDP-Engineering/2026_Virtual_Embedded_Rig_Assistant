id = "REQ-REL-52212fce"

title = "Recover leases left by a lost process"

status = "active"

requirement = """
If a lease file names a process that no longer runs, then the next claim of that key shall remove the stale lease and, when the lost run could actuate the resource, record the resource's physical state as unknown.
"""

verification = "A leases test writes a lease for a dead pid with actuates true and false: the claim succeeds, the actuating one leaves an unknown state marker naming the lost run and the read-only one none; a lease of a live process stays BUSY; a corrupt lease file is BUSY, never deleted."

