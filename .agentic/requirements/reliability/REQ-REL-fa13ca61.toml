title = "Leave no process or partial state after Stop, timeout or failure"

status = "active"

requirement = """
When an arduino-tool run is stopped, times out or fails, VERA's runner shall end the helper's whole process tree, the sketch and the installed cores and libraries shall be unchanged, a run folder already created shall hold a result with status incomplete, and the next clean shall remove the leftover staging folder.
"""

verification = "A real runner run of arduino-tool compile against a fake arduino-cli that sleeps is stopped: the fake, its parent and the helper process (pid from the staging owner.json) end, the sketch hashes are unchanged, the run folder's result.json has status incomplete with error interrupted, the staging folder remains until `arduino-tool clean` removes it; clean keeps a folder whose owner runs, a fresh folder without owner.json and the cache while a folder is in use, and never removes data, downloads or user."

