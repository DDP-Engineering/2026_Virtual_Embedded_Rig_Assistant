title = "Open an owned workbench database in place"

status = "active"

requirement = """
When VERA opens a workbench whose lock it holds, core shall open that workbench's vera.db in place, without copying the database or its WAL, and shall validate the current schema on that connection with query_only ON before any pragma or write.
"""

verification = "Create and close an owned database with data, reopen it with openDb while mkdtemp/mkdtempSync are observed: open succeeds, the data is readable and writable, and no vera-storage-* folder is made; an empty or missing database still initializes. Opt-in VERA_OPEN_TIMING_MB times WorkbenchService.open."

