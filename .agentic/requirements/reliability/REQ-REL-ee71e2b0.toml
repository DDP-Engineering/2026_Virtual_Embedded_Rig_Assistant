title = "Report refused supplier credentials as an authentication failure"

status = "active"

requirement = """
If a supplier answers 401 or 403, then the host shall report that supplier with status `auth` and a message to check its credential, after one token refresh for suppliers that use access tokens.
"""

verification = "Fixture 401 and 403 answers give `auth` for Mouser, Farnell and Rutronik with one request; for DigiKey and TME a 401 causes one new token and one repeated search, and a second 401 gives `auth`."

