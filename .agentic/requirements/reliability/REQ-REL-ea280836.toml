title = "Keep the candidate consistent when an operation is stopped"

status = "active"

requirement = """
If an edit is stopped or times out, then the helper's process tree shall end with nothing saved after the last completed save, so that the next edit of the run completes from the last saved candidate or is refused with `changed` or `binding`.
"""

verification = "Real KiCad: a process-tree kill of an edit paused by a test hook inside its commit, after its move, leaves state.json and the candidate file unchanged; the next edit of the run exits 0 or 2 with problem changed or binding (then the file is still the last save), and the stopped request's move never appears in the saved candidate."

