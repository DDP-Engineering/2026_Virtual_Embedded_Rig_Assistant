title = "Keep open workbenches unchanged when a target open fails"

status = "active"

requirement = "If opening or creating a target workbench fails, then the desktop app shall keep the current workbench, its user terminals included, and every background workbench open and unchanged and discard the runtime prepared for the target."
verification = "Registry test: a scripted open of B that rejects with INVALID leaves the foreground runtime and its sessions untouched (no drain, no release, no program stop) and keeps the retained set; a later open of B creates a fresh runtime. Main test with real runtimes: opening a folder without a workbench returns NOT_FOUND while A's held turn continues and completes. Native e2e: after that failed open, A's terminal is still listed."
affected_paths = ["05_Software/src/apps/desktop/src/main/workbench-runtimes.ts", "05_Software/src/apps/desktop/src/main/sessions.ts", "05_Software/src/apps/desktop/src/main/index.ts"]
