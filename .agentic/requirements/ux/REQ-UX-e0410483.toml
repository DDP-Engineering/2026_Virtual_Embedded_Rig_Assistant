title = "Reorder document tabs by dragging"

status = "active"

requirement = "When the user drags a document tab and drops it on another document tab, or on the tab strip after the last tab, the desktop app shall move it before that tab or to the end, keep the Chat tab first and keep the selected tab selected."

verification = "Renderer test with Chat, a.md, board.txt and a.html: dropping a.html on a.md gives Chat, a.html, a.md, board.txt; dropping a.html on the strip end moves it last; the selected tab stays selected; boundary: the Chat tab is not draggable and a drop on Chat moves nothing; native e2e: a real drag of the last citation tab onto the first document tab moves it there."

