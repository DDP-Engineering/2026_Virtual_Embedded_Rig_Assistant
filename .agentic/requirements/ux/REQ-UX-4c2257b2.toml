schema = 1

id = "REQ-UX-4c2257b2"

title = "Refuse invalid file size and file count input"

status = "active"

requirement = """
If the "Maximum file size (MB)" field holds zero, a negative number or text that is not a number, or the "Maximum indexed files" field holds anything but a positive whole number, then the Documents & RAG section shall mark that field invalid with a localized alert and Save and Create shall stay disabled until it is corrected.
"""

verification = "Renderer test: entering 0, -3 or a non-number in the size field, or 0, empty or 2.5 in the count field, sets aria-invalid and shows the alert, and the editor's Save stays disabled; correcting the value removes the alert and enables Save."

