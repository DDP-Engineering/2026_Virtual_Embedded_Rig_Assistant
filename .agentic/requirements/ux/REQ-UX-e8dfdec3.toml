requirement = "When the user turns the wheel with Ctrl held or presses Ctrl+= or Ctrl+- in a PDF tab, the desktop app shall zoom the PDF in or out in steps between 50% and 200% keeping the page in view, and Ctrl+0 shall reset it to 100%."

verification = "Renderer test: Ctrl+= from 100% gives 125%, Ctrl+- gives 100% again, ten Ctrl+- stop at 50%, Ctrl+0 gives 100%, a Ctrl+wheel up zooms in; the page indicator keeps the same page; boundary: a wheel without Ctrl scrolls and does not zoom."

