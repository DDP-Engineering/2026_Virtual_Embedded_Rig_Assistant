requirement = """
When the user edits an Advanced setting at a scope, VERA shall show the inherited value when the field is empty, offer Reset to clear the scope's value, show when the change applies with an icon whose tooltip names the timing, and refuse an out-of-range entry with a localized message before saving.
"""

