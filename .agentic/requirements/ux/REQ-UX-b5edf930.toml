id = "REQ-UX-b5edf930"

title = "Attach a Docs tree entry to the chat"

status = "active"

requirement = "When the user chooses Attach as context for a Docs tree item, the desktop app shall add the item as a chip above the message box of the chat it shows - the active session's, or a new or reused empty session's when no session is active, opening the chat when it is not shown - and shall disable the item for entries VERA ignores, in a read-only workbench and while 20 entries are attached."

verification = "App-level renderer test with the mock API: on the workbench page, Attach as context on docs/a.pdf shows the active session's chat with an a.pdf chip; attaching it again keeps one chip; the ignored node_modules/pkg/README.md shows the item disabled and choosing it adds nothing; with no session, a session is created and shows the chip; App-level read-only test: the item is disabled and attaches nothing; unit test: the 21st distinct entry is not added; tree test with a stub context: a full chat or no chat disables the item."

