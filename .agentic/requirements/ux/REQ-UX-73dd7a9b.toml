title = "Show the reserved resources in the program approval"

status = "active"

requirement = """
When a run_program request names a declared resource, the approval card and the CLI approval prompt shall show each reserved resource's alias, kind and declared resource name together with the registry file's path and SHA-256, and a registry that changes between approval and start shall end the call with CONFLICT without starting the program.
"""

