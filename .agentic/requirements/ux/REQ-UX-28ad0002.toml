title = "Navigate citations in an accessible offline document viewer"
status = "active"
requirement = """
When the user activates a valid assistant citation, the interface shall open a keyboard-accessible localized viewer at its PDF page or page-range start with cited snippet highlights and page navigation, zoom and text search, Markdown/HTML heading anchor, numbered text range with cited lines highlighted, or current session artifact, preserving inert invalid warning chips, load/error/retry and focus restoration within 1024x640 in every supported language, theme and text size.
"""
