title = "Move focus into and back from a document tab"

status = "active"

requirement = "When a document opens in a tab, the desktop app shall move keyboard focus into the tab's document (its cited unit when there is one), select Chat and return focus to the control that opened the document when the user presses Escape there (to the Chat tab when that control is gone or hidden), and focus the PDF text search when the user presses Ctrl+F in a PDF tab."

verification = "Renderer test: opening from a citation-like opener focuses the document, Escape selects Chat and focuses the opener; when the opener is removed or hidden Escape focuses the Chat tab; a Files row opener gets focus back on Escape; browser and native e2e check Ctrl+F focusing the PDF search field and Escape focus return."

