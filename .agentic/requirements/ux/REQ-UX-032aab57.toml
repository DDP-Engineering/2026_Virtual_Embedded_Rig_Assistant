schema = 1

id = "REQ-UX-032aab57"

title = "Save Settings pages only with the header Save"

status = "active"

requirement = """
On the Appearance, Command shell, Keyboard shortcuts, Updates, Data and privacy and Advanced Settings pages, VERA shall show Cancel and Save at the top right of the page, keep every change in a page draft until Save writes the whole draft at once, restore the saved values on Cancel, disable both buttons while the page has no changes and Save while a value is invalid, and keep the draft with the error shown when saving fails, while actions such as Check for updates, Download and Restart to update run at once.
"""

verification = "On each listed page: change a value, assert nothing is written and Save/Cancel are enabled; Cancel restores the saved value; change again and Save writes one settings update; with no change both buttons are disabled; an invalid value keeps Save disabled; a failing save keeps the draft and shows the error; Check for updates runs without Save."

