title = "Mark Bypass selections and show the full access warning"

status = "active"

requirement = """
When a user selects Bypass in a session or workbench permission selector without suppressing its notice, VERA shall retain a visibly marked red/bold full-access selection and display a localized warning that enabled tools can modify files outside the workbench without confirmations and damage files or configurations, dismissible through Close, X or Escape.
"""

