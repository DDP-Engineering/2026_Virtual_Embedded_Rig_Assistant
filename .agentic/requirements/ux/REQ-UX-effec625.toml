title = "Offer the Bookmarks tab as an opt-in right-panel tab"

status = "active"

requirement = """
When the engineer edits a workbench's Interface > Right-panel tabs, the workbench editor shall offer a localized Bookmarks option after Plan that is unchecked for a new workbench and after Restore defaults, save it per workbench and show the tab in that workbench's sessions only while it is checked.
"""

verification = "Shared schema test: a parsed workbench without interface lists the seven earlier tabs and not bookmarks, and bookmarks sits right after plan in the tab ids. Renderer test (en/ro/de/fr): the editor shows Bookmarks unchecked with its localized label, Restore defaults leaves it unchecked, and checking it saves bookmarks after plan. Mock e2e: the tab is absent in a new workbench, appears after Plan once checked and saved, and unchecking hides it while the message bookmark stays set."

