title = "Ask before leaving Settings with unsaved changes"

status = "active"

requirement = """
When the user switches to another Settings page, chooses Back to workbenches or leaves Settings by any other navigation while the current page has unsaved changes, VERA shall ask to discard the changes, staying on the page with the draft when the user declines and discarding the draft and continuing when the user confirms, and shall not ask when there are no changes.
"""

verification = "With a changed Command shell or Notifications draft, switch to Updates. Declining keeps the page and the draft, confirming switches and drops it, and without changes no prompt appears. Check Back to workbenches with a changed Command shell draft."

