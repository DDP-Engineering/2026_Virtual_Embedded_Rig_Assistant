title = "Preview a user message from its marker"

status = "active"

requirement = """
When a message marker gets hover or keyboard focus, VERA shall show a plain-text preview with the message number and at most 140 normalized characters (a localized label for an empty message, marked when pending) inside the window, closing on Escape and staying while the pointer is over it.
"""

verification = "Unit tests check normalization and the 140-character cut by code point; component tests check hover and focus previews, empty and pending labels, Escape and pointer moves onto the preview; a browser test checks the preview stays inside a small window."

