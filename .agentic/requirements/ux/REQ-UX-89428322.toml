requirement = "When the user activates a document tab's close button, presses Delete on a focused document tab or middle-clicks the tab, the desktop app shall remove that tab and select the tab to its right, otherwise the tab to its left, otherwise Chat."

verification = "Renderer test with three document tabs: closing the selected middle tab selects the right one; closing the last tab selects its left neighbour; closing the only document tab selects Chat; a middle click and Delete on a focused tab close it; boundary: closing an unselected tab keeps the selection and Delete on Chat does nothing."

