title = "Jump to a user message from its marker"

status = "active"

requirement = """
When the user activates a message marker or a group selector entry, VERA shall scroll that message to about 16 px below the top of the transcript (or the native end), highlight it for about 1.5 s, announce the navigation briefly and keep focus on the navigator.
"""

