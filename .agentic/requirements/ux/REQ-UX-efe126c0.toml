title = "Configuration section on the plugin page"

status = "active"

requirement = """
When the expanded card of an installed plugin declares settings, the plugin page shall show a Configuration section with each parameter's description and state - secrets stored or missing with add, replace and remove (MQTT credentials, Wokwi tokens and parts search supplier keys through their existing forms), workbench files present and valid, missing, invalid or not checked for the open workbench, and values read-only - in English, Romanian and German, and App settings shall have no MQTT, Wokwi or Parts search page.
"""

