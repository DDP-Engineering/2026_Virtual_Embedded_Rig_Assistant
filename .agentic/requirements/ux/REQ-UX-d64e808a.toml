id = "REQ-UX-d64e808a"

title = "Warn about a large selection while choosing documentation folders"

status = "active"

requirement = "While the Documents section preview counts more files or more bytes than the resolved Document volume warning (an integer from 500 to 100000 files, default 2000, and from 512 to 51200 MiB, default 2048, set per workbench or application), or its bounded scan stopped early, the desktop app shall show a volume warning next to the preview statement on the New Workbench page and in the workbench editor, stating the counted files (as a minimum when the scan stopped early) and size without claiming that indexing is running."

verification = "Shared test: documentVolumeLimitFor resolves the workbench docVolumeFiles 5000 over the application docVolumeMB 1024, and exceedsDocumentVolume applies that limit. Renderer test with the mock API: a preview of 2,001 files or 2 GiB + 1 byte shows the warning beside the statement, a truncated preview of 12 files shows it with 'at least 12', a preview of exactly 2,000 files and 2 GiB shows none, a volume limit of 5,000 files keeps the 2,001-file preview quiet, and the preview text does not say indexing continues."

