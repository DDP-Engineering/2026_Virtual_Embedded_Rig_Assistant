id = "REQ-UX-d64e808a"

title = "Warn about a large selection while choosing documentation folders"

status = "active"

requirement = "While the Documents section preview counts more than 2,000 files or more than 2 GiB, or its bounded scan stopped early, the desktop app shall show a volume warning next to the preview statement on the New Workbench page and in the workbench editor, stating the counted files (as a minimum when the scan stopped early) and size without claiming that indexing is running."

verification = "Renderer test with the mock API: a preview of 2,001 files or 2 GiB + 1 byte shows the warning beside the statement, a truncated preview of 12 files shows it with 'at least 12', a preview of exactly 2,000 files and 2 GiB shows none, the preview text does not say indexing continues, and the warning disappears after the selection shrinks below the threshold."

affected_paths = ["05_Software/src/apps/desktop/src/renderer/components/workbench-documents.tsx", "05_Software/src/apps/desktop/src/renderer/components/documents/volume-warning.tsx", "05_Software/src/apps/desktop/src/renderer/locales/en.json", "05_Software/src/apps/desktop/src/renderer/locales/ro.json", "05_Software/src/apps/desktop/src/renderer/locales/de.json"]

