title = "Offer a context menu on Docs tree items"

status = "active"

requirement = "When the user right-clicks a Docs tree item or presses Shift+F10 or the context menu key on it, the desktop app shall show a menu with Open, Attach as context, Open in, Show in Explorer, Copy and Properties, operable with arrow keys, Enter and Escape that returns focus to the item, and the tree rows shall show no buttons."

verification = "Renderer test: right-clicking docs/a.pdf shows Open, Attach as context, Open in, Show in Explorer, Copy and Properties; Open on a file opens it in Source and on a folder expands it; Shift+F10 and the context menu key open the menu with focus on its first item; ArrowDown and ArrowUp wrap, Escape and Tab close it and Escape focuses the row; a press outside closes it; rows contain no buttons."

