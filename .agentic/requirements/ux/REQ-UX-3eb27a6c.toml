requirement = "When the user presses Ctrl+F in a PDF tab, the desktop app shall show a find field that moves through the case-insensitive matches of the extracted page text across pages with Enter and Shift+Enter, wrapping, scrolls each match's page into view with the match marked, shows the current match number of the total, and closes on Escape."

verification = "Renderer test: a 3-page PDF with 'reset' on pages 1 and 3: typing reset shows 1 of 2 on page 1; Enter scrolls page 3 into view and shows 2 of 2; Enter wraps to 1 of 2; Escape closes the field; native e2e: Ctrl+F in a cited PDF finds text on another page; boundary: no match shows 0 of 0."

