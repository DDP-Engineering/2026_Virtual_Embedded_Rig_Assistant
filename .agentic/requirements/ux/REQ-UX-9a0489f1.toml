title = "Show localized last activity date and time in session rows"
status = "active"
requirement = "Each session row shall display the date and time of its latest recorded update in the current interface locale and local timezone and, while the session is running or awaiting approval, a status icon, with that status stated in the row's accessible name; runtime status continues to govern action availability."
verification = "Verify en/ro/de formatted date and time uses updatedAt rather than createdAt and remains unchanged by selection; verify a running row and an awaiting-approval row each show their icon and state the localized status in the row's accessible name while idle and error rows show no icon; verify running/approval/read-only action guards and compact native/browser layout. A separately recorded last access, new ordering and date filters are outside this change."
