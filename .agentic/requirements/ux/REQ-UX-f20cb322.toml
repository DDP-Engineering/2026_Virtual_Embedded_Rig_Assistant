schema = 1

id = "REQ-UX-f20cb322"

title = "Keep the composer draft and show capacity at the turn limit"

status = "active"

requirement = """
When a send is refused with TURN_LIMIT, the chat composer shall keep its text, its attachments and keyboard focus in the message box and show that the turn limit is reached and that the user can wait for a running turn or stop one from the sidebar, and when capacity becomes available it shall show that a turn can start.
"""

verification = "Renderer test: a TURN_LIMIT send returns false, the alert names the limit and the two ways forward, the composer text remains and the session gains no item (attachments are cleared only on the same successful-send path as the text); a session.capacity event with active below the limit replaces the alert with the capacity-free status. Native e2e: at a limit set by keyboard in Settings > Advanced the refused draft stays with focus in the message box, a sidebar Stop shows the capacity-free status and the resent draft starts a turn."

