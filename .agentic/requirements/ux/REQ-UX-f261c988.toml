title = "Offer file actions in a document tab's menu"

status = "active"

requirement = "When the user opens the context menu of a workbench file's document tab, the desktop app shall offer, below the tab actions, the Files tree's file actions for that file (Attach as context, Open in, Show in Explorer, Copy and Properties), and for a downloaded PDF's tab Show in Explorer only, leaving them out for artifact tabs."

verification = "Renderer test with the mock API: the docs/a.md tab menu has Open in with Default app, Show in Explorer, Copy and Properties (and Attach where a chat takes entries), and Properties shows the file's properties; a download tab offers Show in Explorer only; an artifact tab offers only the tab actions; boundary: code files, managed downloads and artifacts opened by path have no Default app item, like their Files rows."

