schema = 1

id = "REQ-SEC-450de6ab"

title = "Refuse a job whose files changed after it was prepared"

status = "active"

requirement = """
If any job file's size or SHA-256 differs from job.json, a file of the job's fixed layout is missing, job.json or send/ holds another entry, or send/wokwi.toml differs from the configuration prepare-job generates when run-scenario starts, then wokwi-tool shall end blocked with code job-changed and exit 2 without reading the credential or starting wokwi-cli.
"""

verification = "Helper test: changing one byte of send/firmware.hex, deleting send/diagram.json and adding send/extra.bin each give job-changed exit 2 and the fake CLI log stays empty; with a stdin line of scope mqtt (which would end credential-missing if read) the result is still job-changed, so the check precedes the read; a hand-written job whose hashes all match but whose wokwi.toml points outside send/ or adds a chip, or that lists an extra file, gives job-changed; malformed assertions, outputs or board give job-invalid."

affected_paths = ["05_Software/plugins/wokwi/scripts/wokwi_support/job.py", "05_Software/plugins/wokwi/scripts/wokwi_support/run.py"]

linked_tests = ["05_Software/tests/plugins/wokwi.test.ts"]


