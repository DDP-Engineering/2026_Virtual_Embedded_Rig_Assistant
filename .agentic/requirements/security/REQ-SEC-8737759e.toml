title = "Act only on an instrument that matches its declared profile"

status = "active"

requirement = """
Before any operation other than identify, the scpi helper shall query the identity, require the manufacturer, model and firmware pattern of the entry's profile and the declared serial number when present, and on a mismatch or an unknown profile shall stop as blocked without sending any further command.
"""

