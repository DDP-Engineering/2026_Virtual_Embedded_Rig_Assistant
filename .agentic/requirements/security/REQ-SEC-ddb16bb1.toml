schema = 1

id = "REQ-SEC-ddb16bb1"

title = "Store supplier credentials in the credential store with explicit consent for unprotected storage"

status = "active"

requirement = """
When the user saves a supplier credential and the operating system offers no protected storage, the host shall store it only after the user consents to unprotected storage.
"""

verification = "With protected storage the save stores the credential; without it the save answers `consent-required` and stores nothing until it is repeated with consent, after which the snapshot shows the storage as unprotected."

