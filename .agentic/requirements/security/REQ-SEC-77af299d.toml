schema = 1

id = "REQ-SEC-77af299d"

title = "Choose the upload's port, refuse one that is absent or carries another identity, and warn of a board it cannot confirm"

status = "active"

requirement = """
When an upload names no port, the arduino-tool helper shall use the port that carries --identity, else the sketch.yaml's default port, else the one port whose identified board is the build's, else the one USB serial port, else the only serial port. If the named port is absent or carries another identity than a given --identity, a given identity is on no port or on several, or no single port can be chosen, then the arduino-tool helper shall refuse with exit 2 before uploading. If the chosen port identifies as another board than the build's or identifies no board, then the arduino-tool helper shall upload and report the warning board-mismatch or board-unverified.
"""

verification = "With fake ports: one Uno port and no --port uploads to it with no warning; --port COM9 gives port-missing naming where the identity is; a named identity on another port gives identity-mismatch; --identity alone finds its port; two boards of the build's model give port-required with both ports; an identity on two CH340 ports gives identity-ambiguous; --port on a CH340 uploads with warning board-unverified and board.bridge WCH CH340; a single CH340 is chosen by itself; a Leonardo port for an arduino:avr:uno build uploads with warning board-mismatch; no port gives port-required."

affected_paths = ["05_Software/plugins/arduino-cli/scripts/arduino_support/upload.py", "05_Software/plugins/arduino-cli/scripts/arduino_support/boards.py"]

linked_tests = ["05_Software/tests/plugins/arduino-cli.test.ts"]


