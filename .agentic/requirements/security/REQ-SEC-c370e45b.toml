title = "Confine tool paths"
status = "active"
requirement = "Outside explicitly selected Bypass filesystem scope, the file path guard shall accept workbench-relative paths and canonicalize absolute paths inside the workbench. It shall refuse foreign drive, UNC and device paths, NUL, root escapes, ignored targets and symlinks escaping a granted canonical root. On Windows it shall also identify paths case-insensitively and refuse Windows path aliases."
verification = "Use temporary roots for canonical paths, drive paths, redirects, and ignored aliases. Native Windows checks identity and Windows alias rejection. POSIX verifies admitted ordinary names containing colons, reserved Windows names and trailing dots."
