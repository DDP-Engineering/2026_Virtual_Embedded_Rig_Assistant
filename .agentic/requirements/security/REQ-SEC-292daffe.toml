title = "Bind asynchronous plan feedback operations to the originating workbench"

status = "active"

requirement = "When a plan feedback operation spans asynchronous workbench or session navigation, VERA shall keep its request, completion and revised plan bound to the captured owning workbench and session, rejecting a replaced workbench context with CONFLICT rather than dispatching into the replacement."

verification = "Delay draft save, review preparation, acknowledgement and model completion across session and workbench switches; include colliding session IDs in separate databases and assert either originating-session effects or CONFLICT with zero replacement-session changes or gateway routing."

