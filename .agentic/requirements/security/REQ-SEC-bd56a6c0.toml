title = "Generate a catalog signing key pair without overwriting"

status = "active"

requirement = """
When `vera catalog keygen --private <file> --public <file>` runs, it shall write a new Ed25519 private key (PKCS#8 PEM) and its public key (SPKI PEM), and if either file already exists, it shall write nothing and exit 1.
"""

verification = "Core catalog-source test: keygen into a temporary folder writes two PEM files whose keys sign and verify each other; a second keygen to the same paths fails and leaves the first private key unchanged."

