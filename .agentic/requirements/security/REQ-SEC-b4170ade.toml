schema = 1

id = "REQ-SEC-b4170ade"

title = "Disable native inference telemetry before initialization"

status = "active"

requirement = """
When creating a local inference host, VERA shall disable ONNX Runtime native telemetry in the real parent process environment before any inference worker can initialize the native runtime.
"""

verification = "Focused parent/worker startup regression and actual release process-tree traces with local CPU inference; ambient enabled telemetry cannot retain an uploader. On Windows, while the release smoke indexes with local embeddings, logman shows ONNX Runtime's logging ETW provider in at least one of the app's Node utility processes (where the Indexer embeds) and its Microsoft-telemetry provider in none; the harness gives the app no ORT_* variable. The bundled ONNX Runtime libraries still carry the switch each platform reads."

