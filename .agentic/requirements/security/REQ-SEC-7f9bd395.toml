id = "REQ-SEC-7f9bd395"

title = "Read only permitted target memory"

status = "active"

requirement = """
When gdb-debug reads target memory for variables, locals or the stacked frame, GDB shall be limited to the profile's RAM and flash regions and the fixed System Control Block fault registers (`mem` regions with inaccessible-by-default), and a `--read` whose address range lies outside the profile's RAM or exceeds 256 bytes shall be reported refused without reading it.
"""

verification = "Integration tests check the mem commands sent from the profile (flash and RAM read-only, the SCB fault registers), a --read of a RAM variable returned with address, size, type and bytes, and a --read resolving to 0x40020014 (peripheral) or of 640 bytes reported refused with no -data-read-memory-bytes sent for it; a variable whose read GDB refuses is reported with its error."

affected_paths = ["05_Software/plugins/gdb-debug/scripts/gdb_support/operations.py", "05_Software/plugins/gdb-debug/scripts/gdb_support/profiles.py"]

linked_tests = ["05_Software/tests/plugins/gdb-debug.test.ts"]


