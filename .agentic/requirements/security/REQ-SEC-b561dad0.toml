title = "Refuse a volume operation whose volume is missing or shows another identity"
status = "active"
requirement = "If a volume operation's --volume is not a mounted CIRCUITPY volume, or the volume's identity key differs from --identity, then circuitpython-tool shall refuse the operation with status blocked and code volume-missing or identity-mismatch before it reads or writes any file of that volume other than boot_out.txt."
verification = "Bench: deploy --volume <unlisted folder> is blocked volume-missing; --volume <listed> with another identity is blocked identity-mismatch; the volume's files are unchanged and the fake console records no open."
