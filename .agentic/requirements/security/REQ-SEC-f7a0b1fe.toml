title = "Refuse operations that leave the board outline"

status = "active"

requirement = """
If, after the operations, the bounding box that KiCad reports for a placed footprint or a created item extends beyond the bounding box of the board outline, then the helper shall revert the candidate to its last save and refuse the request with exit 2 and the problem `outline`.
"""

