title = "Confine project paths and run folders to the working directory"

status = "active"

requirement = """
If `--project` or `--results-dir` leaves the working directory by its text or through a link, names a network or device path or another drive, or the run folder would be inside `.vera`, then the helper shall refuse with exit 2 and a `path` problem before reading the project, with the same path rules as `elec-calc`.
"""

verification = "The path cases of `elec-calc` (parent traversal, absolute path elsewhere, `\\\\host\\share`, `NUL`, another drive, a link out, `.vera/x`) give `path` refusals for `--project` and `--results-dir`; the shared path module is byte-identical in both plugins."

