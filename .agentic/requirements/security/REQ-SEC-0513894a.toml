schema = 1

id = "REQ-SEC-0513894a"

title = "Authenticate only with a key held by the system SSH agent"

status = "active"

requirement = "pi-tool shall authenticate by public key through the system SSH agent only (SSH_AUTH_SOCK, else Pageant or the OpenSSH agent pipe on Windows), offering only the key whose fingerprint the entry names in agentKey when it names one, never a password, keyboard-interactive, GSS or a key file, and shall end blocked with agent-unavailable, agent-key-missing or auth-failed when the agent cannot be reached, lacks the key or the server refuses it, unless the board's host key is not pinned, which is reported first."

verification = "Test agent and server: identify passes the host key and the agent log shows one sign request with the user key; an agentKey the agent lacks gives agent-key-missing; an unknown agent path gives agent-unavailable; a user the server does not accept gives auth-failed; every public-key attempt the server logs carries the user key; Inspection: ssh.connect passes password_auth, kbdint_auth and gss_host off and client_keys from the agent only."

affected_paths = ["05_Software/plugins/raspberry-pi-linux/scripts/pi_support/ssh.py"]

linked_tests = ["05_Software/tests/plugins/raspberry-pi-linux.test.ts"]


