schema = 1

id = "REQ-SEC-0513894a"

title = "Authenticate with a key of the SSH agent or of ~/.ssh, never a password"

status = "active"

requirement = "pi-tool shall authenticate by public key only, offering the keys of the system SSH agent when one answers (SSH_AUTH_SOCK, else the OpenSSH agent pipe on Windows) and then the private keys of ~/.ssh that load without a passphrase, at most six, or only the agent key whose fingerprint the entry names in agentKey; it shall never use or ask for a password, a passphrase, keyboard-interactive or GSS, and shall end blocked with no-key, agent-unavailable, agent-key-missing or auth-failed when no key is usable, the named agent key cannot be had or the server refuses the keys, naming the command that authorizes a key on the board, unless the board's host key is not the trusted one, which is reported first."

verification = "Test agent and server: identify passes and the agent log shows one sign request with the user key; with no agent and the key as a file in the folder standing in for ~/.ssh identify passes; with neither it ends no-key naming ssh-keygen; an agentKey the agent lacks gives agent-key-missing and without an agent agent-unavailable; a user the server does not accept gives auth-failed naming authorized_keys; every public-key attempt the server logs carries the user key; Inspection: ssh.connect passes password_auth, kbdint_auth and gss_host off."

affected_paths = ["05_Software/plugins/raspberry-pi-linux/scripts/pi_support/ssh.py"]

linked_tests = ["05_Software/tests/plugins/raspberry-pi-linux.test.ts"]


