id = "REQ-SEC-93d5fc98"

title = "Classify every arduino-tool operation at its effective risk and expose no excluded operation"

status = "active"

requirement = """
The arduino-cli plugin shall classify arduino-tool queries, inspect, report and clean as safe, boards list and compile as device-read, install and upload as device-write, shall refuse search text, FQBN parts, core and library names that start with '-', and shall offer no operation for the daemon, the interactive monitor, burning a bootloader, fuses or network (OTA) upload.
"""

verification = "classifyCommand over plugin.yaml gives safe for `arduino-tool inspect --sketch Blink` and `arduino-tool boards details --fqbn arduino:avr:uno`, device-read for `arduino-tool compile ...` and `arduino-tool boards list`, device-write for `arduino-tool install core arduino:avr@1.8.8` and `arduino-tool upload ...`; `arduino-tool --help` lists no daemon, monitor, burn-bootloader or OTA operation and an unknown --protocol option is refused; `libraries search -- --log-file=outside.log`, `cores search -- -v`, `boards search -- --log-file=...`, `install library -- -x@1.0.0`, `install core -- -x:avr@1.0.0` and `--fqbn=-x:avr:uno` exit 2 with no arduino-cli call and no file written."

