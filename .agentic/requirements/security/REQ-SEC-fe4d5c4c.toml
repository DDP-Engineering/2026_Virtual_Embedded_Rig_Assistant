requirement = "When a credential changes, the main-process store shall atomically persist its safeStorage-encrypted base64 value in schemaVersion 1 credentials.json through serialized read-modify-write, returning the original credential on read and rejecting invalid content, including any other schemaVersion, with INVALID before decryption and preserving existing bytes on invalid or failed writes."
