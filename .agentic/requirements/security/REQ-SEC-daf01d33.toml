id = "REQ-SEC-daf01d33"

title = "Sign the channel indexes of a catalog release"

status = "active"

requirement = """
When `vera catalog sign --release <dir> --key <private.pem>` runs, it shall write next to each channel index a `<index>.sig` file holding the base64 Ed25519 signature of the index bytes, and if `--public <public.pem>` is given and does not match the private key, it shall write nothing and exit 1.
"""

verification = "Core catalog-source test and CLI test: signing a built release with a throwaway key writes index-stable.json.sig and index-pre-release.json.sig that verify with Node crypto against the public key; signing with --public of another key pair exits 1 and writes no .sig file."

