title = "Classify STM32_Programmer_CLI commands from the parsed command line"

status = "active"

requirement = """
When the agent submits an STM32_Programmer_CLI command line, VERA shall classify every command on it at the highest risk: help, version, output settings, command modifiers, host-file tools and board-free probe listings safe; connecting, other listings, reading, verifying, resets, core control, -ob displ and other displays device-read; writing, erasing, filling, running code, core-register writes and wireless-stack start or delete device-write; and an unknown command, a word before the first command, or any spelling the help does not list (extra dashes, inner parts, spaces) device-write together with every command that spelling could mean.
"""

verification = "Classify each command family in help, mixed-case and long spellings, several commands on one line, numeric arguments (-1), board-free and other listings, and spellings the help does not list (--ob, --c, -file-checksum, -x-rst, -ob=displ) as device-write at least."

