title = "Offer the electrical tools only to hosts that enable them, never the change tool read-only"

status = "active"

requirement = """
VERA shall offer electrical_model and electrical_model_change only while a plugin of the electrical or automation ecosystem is loaded, each of industrial_catalog, electrical_network, protection_coordination and motor_drives only while its own plugin (by plugin ID) is loaded, and shall never offer electrical_model_change, electrical_network, protection_coordination or motor_drives in a read-only session.
"""

verification = "Session tests with a replay gateway and its default context window: with electrical-network loaded the ask-mode catalog holds electrical_model, electrical_model_change and electrical_network but not the other plugin tools; the read-only catalog with all four plugins holds electrical_model and industrial_catalog and no write tool, and the run leaves no change row; with no plugin none is offered; electricalToolOffered maps each plugin tool to its plugin ID; desktop tests: the host lists the IDs of loaded electrical or automation plugins and not electronics ones."

