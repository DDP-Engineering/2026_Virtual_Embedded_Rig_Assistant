title = "Offer the electrical tools only to hosts that enable them, never the change tool read-only"

status = "active"

requirement = """
VERA shall offer electrical_model and electrical_model_change only while a plugin of the electrical or automation ecosystem is loaded, each of industrial_catalog, electrical_network, protection_coordination, motor_drives, power_quality, lighting_design, qelectrotech, qelectrotech_change, qelectrotech_check, panel_engineering, panel_engineering_check, electrical_documentation, electrical_documentation_check, electrical_documentation_export, eplan, eplan_change and eplan_check only while its own plugin (by plugin ID) is loaded, and shall never offer electrical_model_change, electrical_network, protection_coordination, motor_drives, power_quality, lighting_design, qelectrotech_change, qelectrotech_check, panel_engineering_check, electrical_documentation_check, electrical_documentation_export, eplan_change or eplan_check in a read-only session.
"""

verification = "Session tests with a replay gateway and its default context window: with electrical-network loaded the ask-mode catalog holds electrical_model, electrical_model_change and electrical_network but not the other plugin tools; the read-only catalog with every electrical plugin holds electrical_model and industrial_catalog and no write tool, and the run leaves no change row; with no plugin none is offered; electricalToolOffered maps each plugin tool to its plugin ID; desktop tests: the host lists the IDs of loaded electrical or automation plugins and not electronics ones."

