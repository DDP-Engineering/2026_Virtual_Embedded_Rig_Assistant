title = "Never install programs while resolving"
status = "active"
requirement = "The resolver shall resolve only programs that are already installed or found on the machine, without downloading, installing or synchronising anything, so a pip, script or download program that is not installed stays unavailable to run_program."
verification = "Unit test: resolving a pip, a script and a download program before install spawns nothing, calls no fetch and returns undefined for each, and their statuses are missing; the CLI test without VERA_TEST_NODE shows run_program of an unresolved program ending with the not-available message."
