schema = 1

id = "REQ-SEC-2ccecd75"

title = "Keep supplier credentials out of results, errors, logs, settings and request text"

status = "active"

requirement = """
The host shall keep supplier keys, secrets, client ids, tokens and request URLs that carry a key out of tool results, error messages, logs, settings, the parts settings snapshot, the workbench configuration and process arguments.
"""

verification = "With known fixture credentials, the results, error messages, request bodies, settings, settings file, credential file, snapshot, logged lines and rendered Settings page are searched for each key, secret, client id and token and contain none; keys travel only in the supplier's documented place (Mouser, Farnell and Rutronik query, DigiKey token form and headers, TME Basic header); a supplier answer that echoes a key is redacted."

affected_paths = ["05_Software/src/libraries/core/src/parts/http.ts", "05_Software/src/libraries/core/src/parts/configured.ts", "05_Software/src/apps/desktop/src/main/parts-access.ts", "05_Software/src/apps/cli/src/parts-env.ts"]

