id = "REQ-SEC-b3fe3c10"
title = "Classify esptool commands that write the flash as device-write"
status = "active"
requirement = "The esp32-esptool rules shall classify the esptool commands write-flash, erase-flash and erase-region, in either spelling, as device-write with a note that they overwrite firmware or data stored on the chip, and load-ram as device-write with a note that it runs code from RAM instead of the firmware."
verification = "classifyCommand: [--port, COM7, write-flash, 0x10000, build/app.bin], [write_flash, ...], [erase-flash] and [erase_region, 0x9000, 0x6000] are device-write with exactly the overwrite note and confirm null; [load-ram, build/ram.bin] is device-write with the RAM note. Boundary: an unknown command [frobnicate] is device-write by the platform default with no note."
affected_paths = ["05_Software/plugins/esp32-esptool/plugin.yaml"]
linked_tests = ["05_Software/tests/integration/esp32-esptool.test.ts"]
