requirement = "While a run has no key-file, the CLI shall take the provider key from OPENAI_API_KEY for the openai provider only, send no environment key to a custom provider, and name --key-file on stderr when a custom provider runs with OPENAI_API_KEY set or the openai provider has no key."

verification = "CLI unit test with a fictional key: the openai provider receives the environment key; the custom provider receives none and gets a note that names --key-file and does not contain the key; openai without a key gets a note naming OPENAI_API_KEY and --key-file; a custom provider without the variable and a replay run get neither key nor note."

