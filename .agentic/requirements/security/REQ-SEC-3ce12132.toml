title = "Confine agent access to run logs to read operations"

status = "active"

requirement = """
When an agent accesses a managed program log outside Bypass, the file tools shall admit direct read, search and parsing of the ordinary log without extending write or sibling-file authority. Verified line citations shall open the same guarded sources.
"""

