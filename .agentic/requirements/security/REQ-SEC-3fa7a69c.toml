requirement = """
When the agent submits a tshark command, VERA shall classify it from tshark's parsed option roles at the highest matching risk: reading a capture file and information-only commands (help, version, reports and interface listing) safe, any live capture (an interface, monitor-mode, link-type or timestamp-type option, or no capture file to read) device-read, and an unrecognised or ambiguous option device-write.
"""

verification = "Classify every rule row with short, grouped, long, abbreviated-long and equals spellings, option values that look like options, a filter-only command line with no -r, -r combined with -i, and an unknown option; each must take the highest matching risk."

