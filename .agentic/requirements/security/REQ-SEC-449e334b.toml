title = "Refuse a catalog zip with a wrong size or hash"

status = "active"

requirement = "If a downloaded catalog zip's size differs from its index entry's bytes or its SHA-256 differs from the entry's sha256, then the catalog shall refuse it with INVALID `plugins.catalogError.sha256`, keep none of its bytes and leave the installed plugins unchanged."

verification = "Core catalog test with a loopback server serving an index whose sha256 is wrong for its zip: review fails with INVALID plugins.catalogError.sha256, `<userData>/plugins/catalog` holds no zip and no plugin is installed; a zip one byte longer than bytes fails the same way."

