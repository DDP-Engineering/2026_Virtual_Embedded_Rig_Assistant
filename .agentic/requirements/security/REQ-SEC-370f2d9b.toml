title = "Re-check approved file hashes right before the program starts"
status = "active"
requirement = "When a program run whose approved request names workbench files is about to start, the runner shall hash those files again after opening the run log and immediately before spawning, and if any hash differs from the approved request it shall fail with CONFLICT without starting a process."
verification = "Runner unit test: a beforeSpawn check that throws CONFLICT after the log opened rejects the start and the host's spawn is never called; program-tools test: a file rewritten after consume and before spawn ends the tool with a changed-after-approval error, nothing spawns and the run log says the program did not start; an unchanged file starts the process."
