id = "REQ-SEC-371cdb26"

title = "Block actuation while the physical state is unknown"

status = "active"

requirement = """
While the recorded physical state of an instrument is unknown, the scpi helper shall refuse `configure` and `output` for it as blocked without sending any command, and shall allow identify, read, capture, status and close, whose confirmed readback clears the state.
"""

verification = "The integration test leaves an unknown marker, runs `scpi output` (blocked, exit 2, transcript without commands), then `scpi close` (confirmed) and `scpi output` again (runs)."

