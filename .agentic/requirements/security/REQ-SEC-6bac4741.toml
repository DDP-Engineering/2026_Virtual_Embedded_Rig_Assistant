title = "Re-check plan files before every operation"

status = "active"

requirement = """
If the plan file, the firmware or an operation's bound files differ from the approved hashes when that operation is about to start, then the HIL run shall end with status `error` and problem `changed` without starting that operation.
"""

verification = "A test approves a plan, changes the firmware while an earlier step runs, and expects the following flash step not to start, status error and problem changed."

