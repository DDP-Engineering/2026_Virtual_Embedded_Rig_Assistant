title = "Validate the bus profile before touching the adapter"
status = "active"
requirement = "When an operation names a bus profile, bus-tool shall refuse as blocked (profile-invalid) a profile that names no bus mode, is not format 1 when it gives a format, has unknown fields, declares a logic voltage outside 1200 to 5000 mV, a speed outside its mode's range, a UART parity other than none or even, an I2C address outside 0x08 to 0x77, a register writing more than 4 bytes or reading more than 64 bytes, or limits above the helper's caps, before opening any port."
verification = "One case each (no bus mode, logicMv 900, odd parity, I2C speed 2 MHz, address 0x78, register write of 5 bytes, maxReadBytes 4096, an unknown key, format 2): exit 2 profile-invalid, no open. A profile holding only the bus mode and one device is accepted with the defaults."
affected_paths = ["05_Software/plugins/bus-tools/scripts/bus_support/profile.py"]
linked_tests = ["05_Software/tests/plugins/bus-tools.test.ts"]
