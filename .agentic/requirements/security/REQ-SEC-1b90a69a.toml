title = "Refuse project inputs the tool does not support"

status = "active"

requirement = """
If wokwi.toml has a key or table other than version, firmware and elf, the firmware has an unsupported extension, or a job has no board or more than one board, then wokwi-tool shall end blocked with code unsupported-input naming the input, and a firmware whose content does not match its form shall end firmware-invalid.
"""

verification = "Helper test: wokwi.toml with [[chip]], with [[sdcard]] and with gdbServerPort each give unsupported-input at prepare-job with no run folder; firmware.exe gives unsupported-input; a .hex that is not Intel HEX and an --elf without the ELF magic give firmware-invalid; a diagram with two boards gives unsupported-input."

