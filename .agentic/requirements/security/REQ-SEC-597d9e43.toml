title = "Contact only fixed supplier endpoints without redirects"

status = "active"

requirement = """
The host shall send parts search requests only to the fixed supplier endpoints, without following redirects, and shall refuse an answer larger than 4 MiB or slower than 30 s.
"""

verification = "A request for another path or with user information is refused before any fetch; every fetch asks redirect: error and a refused redirect is `unavailable`; a declared and a streamed body over 4 MiB are `unavailable`; a body that stalls past the (shortened) deadline is `timeout`."

