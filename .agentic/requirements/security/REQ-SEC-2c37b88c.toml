id = "REQ-SEC-2c37b88c"

title = "Refuse an invalid or unknown plan step before any I/O"

status = "active"

requirement = """
If a plan has an unknown key, an unknown `use`, a parameter outside its bounds, `retries`, `repeat` or `background` on an adapter without that capability, an alias missing from `lab/resources.json` or a blocked operation, then VERA shall refuse it (`check` exit 2 naming the problem path, `run` without an approval) before any process starts.
"""

verification = "Tests give one plan per refusal (unknown use, retries on probe-rs.flash, a missing scope alias, an option-like parameter, an out-of-range timeout) and expect the problem, no spawn and no approval."

