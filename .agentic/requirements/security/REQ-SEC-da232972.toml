id = "REQ-SEC-da232972"

title = "Refuse a host key that is not pinned before authenticating"

status = "active"

requirement = "When the SSH server presents a host key whose SHA-256 fingerprint is not among the registry entry's hostKeys, pi-tool shall end blocked with code host-key-changed (host-key-unpinned when the list is empty), naming the presented fingerprint, without authenticating or sending any request."

verification = "Test SSH server with a second host key: identify ends host-key-changed exit 2 naming the new fingerprint, also when no agent is reachable, and the server log has no authentication attempt and no exec; with hostKeys [] check-host-key ends host-key-unpinned; known_hosts is a callable returning no key and config=None, so no ~/.ssh file is consulted."

affected_paths = ["05_Software/plugins/raspberry-pi-linux/scripts/pi_support/ssh.py"]

linked_tests = ["05_Software/tests/plugins/raspberry-pi-linux.test.ts"]


