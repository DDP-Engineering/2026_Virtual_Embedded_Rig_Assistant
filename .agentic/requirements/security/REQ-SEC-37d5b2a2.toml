title = "Fail a compile that used an undeclared index library"

status = "active"

requirement = """
If a compile used a library from the environment's library folder that the request did not declare with its version, then the arduino-tool helper shall report status fail with an undeclared-library error naming the library and version, and shall report an ambiguous library choice as a warning.
"""

