title = "Accept only a strictly valid protection request and read only named catalog parameters"

status = "active"

requirement = """
When protection_coordination is called, VERA shall accept only a request that satisfies the format-1 protection request of the spec (network run, catalog, breaking-capacity basis, 1..16 circuits with 1..8 catalog candidates each, at most 16 candidates in all, optional settings, disconnection times, RCD, coordination and starter entries) and shall refuse any other request, an unknown circuit, protection or catalog item, with an error before anything is prepared.
"""

verification = "Core unit tests: a valid request evaluates; an unknown key, more than 16 candidates, a circuit that is not a circuit of the model, an item missing from the catalog a protection object that does not protect the circuit and a coordination pair whose upstream circuit does not feed the downstream one each throw a named error and prepare nothing."

