title = "Store the concurrent-turn limit as an application Advanced setting"

status = "active"

requirement = """
The application settings shall store the Concurrent turns limit as the application-scope Advanced setting concurrentTurns, an integer from 1 to 16 with default 4, in the settings format version 1, and refuse a save with a value outside that range or at workbench or session scope.
"""

verification = "Shared advanced-settings test: the app patch schema accepts 1 and 16 and refuses 0, 17 and a fraction; the workbench and session patch schemas refuse the key; resolution without a stored value is 4 (default) and a stored 5 resolves to 5 (app)."

