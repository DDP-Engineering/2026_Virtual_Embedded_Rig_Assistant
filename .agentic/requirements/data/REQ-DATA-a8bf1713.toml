title = "Accept only a strictly valid format-1 panel file"

status = "active"

requirement = """
VERA shall read a panel file electrical-automation-panels/<id>.json only when it is strictly valid format 1 (kind vera-panel, file name equal to its id, no unknown keys, unique tags across equipment, terminal strips, rails, ducts, zones and rules, every referenced rail, zone, host, supply, scenario tag and source existing, quantities with units of their property's dimension), and shall otherwise refuse it with `Invalid panel file <id>:` and at most 20 problems with their JSON paths.
"""

