id = "REQ-DATA-3b6664f9"

title = "Save a session's document tabs in localStorage"

status = "active"

requirement = "When a session's document tabs change (open, close, move, pin, unpin or select) or a document's place changes, the desktop app shall store in localStorage under `vera.tabs.<workbenchId>.<sessionId>.<JSON folder>` a version 1 record with the tabs' targets in order, the selected tab key, each tab's place and its optional true pin flag, at most every 500 ms and when the page is hidden, prioritizing pins within the 200-tab limit."

verification = "Renderer test with a fake storage: opening two documents, moving one and selecting the other writes a version 1 record with both targets in the new order, the selected key and persisted pins; scrolling a text tab to a new first visible line writes that line place after the throttle; boundary: a session without an id writes nothing and a storage that throws leaves the tabs working. Check the pin at the cap and independent records in copied folders with matching IDs."

affected_paths = ["05_Software/src/apps/desktop/src/renderer/App.tsx", "05_Software/src/apps/desktop/src/renderer/components/documents/viewer-context.tsx", "05_Software/src/apps/desktop/src/renderer/lib/document-tabs-store.ts"]

