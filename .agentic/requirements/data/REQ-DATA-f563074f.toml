title = "Record each plugin program run next to its log"

status = "active"

requirement = "When a plugin program run starts, the program runner shall write .vera/runs/<run id>.json with the plugin, program, agent arguments, session, background flag and start time, and when the run ends shall add its end (exited, stopped or timed out), exit code, start error and duration; pruning deletes a run's record together with its log."

verification = "Runner unit test with a fake process host: a started run's record parses with its plugin, program, arguments, session and start time and no end; after exit 3 it records exited, exitCode 3 and a duration; a stopped run records stopped; a run that cannot start records its error; with logsKept 2 and three runs the oldest .log and .json are both deleted."

