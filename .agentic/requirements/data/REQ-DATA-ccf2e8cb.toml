title = "Store the models offered from each provider"

status = "active"

requirement = """
When the user saves model ticks on Settings > Providers, the desktop shall store the ticked model IDs per provider (the OpenAI connection, the ChatGPT subscription and each API or local connection) in the application settings, and a provider with no stored list shall offer all of its models.
"""

