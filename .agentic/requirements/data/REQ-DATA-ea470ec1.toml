title = "Declare a debug probe in the bench registry by its serial"

status = "active"

requirement = """
The bench registry `lab/resources.json` shall accept an entry of kind `probe` with an alias, a probe resource `VID:PID:SERIAL` naming the probe's serial and a profile id, and shall give it the identity keys `probe:<vid>:<pid>:<serial>` and `probe:<vid>:<pid>` in lower case.
"""

verification = "Tests validate a probe entry, its keys for upper- and lower-case spellings, and refuse an entry without a serial, with a non-hexadecimal VID/PID or with an unknown field."

