title = "Declared download size"

status = "active"

requirement = """
When a manifest download entry declares `bytes`, the provisioner shall treat a transfer longer than that size as a hash mismatch (`sha256`) and keep nothing of it, and an entry without `bytes` shall stay valid.
"""

verification = "Core provisioning test: a download declared with bytes smaller than the served file reports problem sha256 and leaves no download folder; shared schema test: bytes accepts a positive integer, rejects 0, and is optional."

