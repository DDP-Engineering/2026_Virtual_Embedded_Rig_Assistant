id = "REQ-DATA-634d35da"
title = "bus-tool contract: operations, bus profile, registry fields, results and exit codes"
status = "active"
requirement = "The program bus-tool of the bus-tools plugin shall accept exactly the operations, options, bus profile document and registry fields of its spec and shall print one JSON result document of format 1 (kind bus-tool-result) per call, also written as result.json and report.md into a new run folder under arduino-iot-results/<run-id>/ for every operation except devices and capabilities once its request checks pass (a call refused by the registry, profile or request checks writes no folder), and shall exit 0 for pass, 1 for fail, 2 for blocked before any data request (before any bus effect, except a byte limit found in the configuration read-back) and 3 for incomplete or error."
verification = "Integration tests parse the printed document of each operation (format, kind, operation, status, errors), find the same document in the run folder, and see exit 0 (register read), 1 (NACK), 2 (unknown register) and 3 (no response); a --run-id whose folder exists is refused run-exists."
affected_paths = ["05_Software/plugins/bus-tools/scripts/bus_support/cli.py", "05_Software/plugins/bus-tools/scripts/bus_support/report.py", "05_Software/plugins/bus-tools/scripts/bus_support/profile.py", "05_Software/plugins/bus-tools/scripts/bus_support/__init__.py", "05_Software/plugins/bus-tools/scripts/bus_support/workspace.py"]
linked_tests = ["05_Software/tests/plugins/bus-tools.test.ts"]
