title = "ble-tool contract: operations, device profile, registry fields, results and exit codes"

status = "active"

requirement = "The program ble-tool of the ble-tools plugin shall accept exactly the operations, options, device profile document and registry fields of its spec and shall print one JSON result document of format 1 (kind ble-tool-result) per call, also written as result.json and report.md into a new run folder under arduino-iot-results/<run-id>/ for every operation except capabilities once its request checks pass (a call refused by them writes no folder), and shall exit 0 for pass, 1 for fail, 2 for blocked and 3 for incomplete or error."

verification = "Integration tests parse the printed document of each operation (format, kind, operation, status, errors), find the same document in the run folder, and see exit 0 (read), 1 (profile-mismatch), 2 (not-found) and 3 (disconnected); a --run-id whose folder exists is refused run-exists and an unknown operation is refused arguments."

affected_paths = ["05_Software/plugins/ble-tools/scripts/ble_support/cli.py", "05_Software/plugins/ble-tools/scripts/ble_support/report.py", "05_Software/plugins/ble-tools/scripts/ble_support/profile.py", "05_Software/plugins/ble-tools/scripts/ble_support/__init__.py", "05_Software/plugins/ble-tools/scripts/ble_support/workspace.py", "05_Software/plugins/ble-tools/scripts/ble_tool.py"]

