title = "Refuse units that are unknown or belong to another dimension"

status = "active"

requirement = """
If a quantity in the model or in a result uses a unit outside the electrical unit table, or a known property uses a unit of another dimension, then VERA shall refuse the document as invalid, naming the path, the unit and the units the property accepts.
"""

