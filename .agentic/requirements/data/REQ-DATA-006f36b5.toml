title = "Keep an unknown quantity unknown and never zero"

status = "active"

requirement = """
The electrical model shall represent an unknown quantity as value null with its unit and basis, keep it null through reading and writing, and report it as unknown, never as zero.
"""

verification = "Core unit tests: a motor quantity whose value is null (efficiency in the fixture) round-trips with null and its unit; the objects view returns null for the unknown rated current; a value 0 stays 0 and is distinct from null; a quantity without the value key is refused rather than defaulted."

