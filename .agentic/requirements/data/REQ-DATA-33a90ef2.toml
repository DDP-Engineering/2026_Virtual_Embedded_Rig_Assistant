title = "Ignore invalid stored Advanced values"

status = "active"

requirement = """
If a stored Advanced value is unknown, outside its allowed range or stored at a scope the setting does not list, VERA shall ignore that value and use the next scope or the default, keep loading the rest of the settings, workbench or session, and log the ignored key.
"""

verification = "Write an out-of-range pilot value and an unknown key into settings.json, workbench.yaml and a session event: the settings, workbench and session still load, the pilot resolves from the next valid scope, and the log names each ignored key without its value. An application-only value in workbench.yaml (delegations 8 over an application 2) and a workbench key in a session event are ignored and named the same way."

