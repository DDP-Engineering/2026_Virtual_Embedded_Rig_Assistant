requirement = "When loading a structurally bounded UTF-8 JSON definition of at most1MiB, decode_register shall accept register widths of 1 to 64 bits, source references to lines, pages or headings of workbench documents, and optional description, reset and access notes on a register, and shall reject invalid schemaVersion1 data, duplicate keys, nonunique register or field names, overlapping or out-of-width fields, invalid source refs, more than512 registers or64 fields per register, notes over256 characters and more than256 duplicate or out-of-field enum values as INVALID with a stable reason and a message that names each problem and its place."
verification = "Before the YAML pass refuse30000-key and10000-depth JSON using a linear structural preflight; mutate one valid definition per boundary; assert INVALID and stable invalid_definition, duplicate_keys, invalid_utf8 or file_too_large reasons; decode a 24-bit and a 10-bit register cited by PDF page; assert the message names an unknown key, a width and a source reference by path."
