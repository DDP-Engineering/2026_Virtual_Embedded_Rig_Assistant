title = "Declare BLE devices as registry entries of kind ble-device keyed by address"

status = "active"

requirement = "The lab registry shall accept entries of kind ble-device with an alias, a Bluetooth address of six hex octets, an addressType public or random (random only when static, its first octet's two most significant bits set), a profile id and the optional serial, adapter (hci0 to hci99) and note, refusing unknown fields, and shall key each such entry `ble:<address lower-case>`."

verification = "lab-resources tests validate an entry, see the key ble:c4:7f:51:00:12:34 for C4:7F:51:00:12:34, and see a resolvable private random address, an unknown field and a malformed address refused."

