title = "Refuse relations that break endpoint types, cardinalities or a radial feed"

status = "active"

requirement = """
If a relation joins object types its relation type does not allow, exceeds the relation type's cardinality, joins an object to itself, or closes a cycle of feeds relations, then VERA shall refuse the model as invalid and name the relation.
"""

