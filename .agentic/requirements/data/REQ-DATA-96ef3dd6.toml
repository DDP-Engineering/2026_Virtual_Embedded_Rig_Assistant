title = "Store Advanced settings per application, workbench and session"

status = "active"

requirement = """
When the user saves an Advanced setting, VERA shall store an application value in the settings.json advanced block, a workbench value in the workbench.yaml advanced block and a session value as a durable session event, keep each across application restart, and refuse a value outside the setting's allowed range or choices, of the wrong type for the setting (a switch takes true or false), for an unknown key or for a key the scope does not list with INVALID and no change.
"""

verification = "Save the pilot at each scope, restart the settings service, reopen the workbench and restart the session database: the three values are read back; saving 9, 501, a non-integer or an unknown key returns INVALID and leaves stored values unchanged; the application patch refuses 15 for Rows per page, whose choices are 10, 20 and 50; clearing a value removes it so the scope inherits again."

