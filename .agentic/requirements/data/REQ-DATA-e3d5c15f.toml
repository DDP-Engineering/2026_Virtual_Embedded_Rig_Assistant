title = "Carry a structured logical connection and interlock scheme in the electrical result"

status = "active"

requirement = """
When an electrical result carries assemblies, VERA shall accept them only as a strict list of at most 16 assemblies each naming a model motor and circuit, a method, a conditional flag, at most 16 devices (tag, role, catalog item or null, order code or null, optional setting), at most 32 power or control connections and at most 8 mechanical, electrical or sequence interlocks, and the report shall list them.
"""

verification = "Core unit tests: a result with an assembly validates and its report lists devices, connections and interlocks; an unknown key, a connection kind other than power or control and a 17th device are refused with the path."

