title = "Mark an absent, unconfirmed or off-condition catalog value unknown"

status = "active"

requirement = """
When an item has no value for a required parameter, only values marked extracted, or no value whose conditions cover the requested conditions, the industrial catalog selection shall mark that requirement unknown with the reason and shall not count the item as eligible or treat the value as zero.
"""

verification = "Core unit tests: a breaking-capacity requirement on a contactor and a requirement on a null value are unknown with reason absent; an extracted value gives unknown with reason unconfirmed; a breaking capacity asked at 1000 V is unknown with reason conditions; such an item is ranked after eligible items with outcome unknown."

