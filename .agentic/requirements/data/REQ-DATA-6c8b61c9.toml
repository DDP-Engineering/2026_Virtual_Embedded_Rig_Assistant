id = "REQ-DATA-6c8b61c9"

title = "Declare a Raspberry Pi as a linux-board registry entry keyed by host and port"

status = "active"

requirement = "The lab registry shall accept entries of kind linux-board with an alias, a host name or IP address and a user other than root, and optionally a port (22 when absent), 0 to 4 SHA-256 host-key fingerprints, an agent-key fingerprint, an expected identity of serial, machine id and model, an absolute remote root and a note, refusing unknown fields, and shall key each such entry `ssh:<host lower-case>:<port>`."

verification = "lab-resources tests validate a full entry and an entry of alias, kind, host and user alone and see the keys ssh:pi.local:22 and ssh:raspberrypi.local:22, and refuse user root, a relative, `..` or one-segment root, a fingerprint without SHA256:, a malformed serial and an unknown field; pi-tool's own registry check refuses user root and a relative root with code registry."

affected_paths = ["05_Software/src/libraries/shared/src/lab-resources.ts", "05_Software/src/libraries/core/src/plugins/resource-registry.ts", "05_Software/plugins/raspberry-pi-linux/scripts/pi_support/registry.py"]

