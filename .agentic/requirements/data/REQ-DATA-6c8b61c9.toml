title = "Declare a Raspberry Pi as a linux-board registry entry keyed by host and port"

status = "active"

requirement = "The lab registry shall accept entries of kind linux-board with an alias, a host name or IP address, a port, a user other than root, 0 to 4 SHA-256 host-key fingerprints, an optional agent-key fingerprint, an expected identity of at least a serial or a machine id with an optional model, an absolute remote root and an optional note, refusing unknown fields, and shall key each such entry `ssh:<host lower-case>:<port>`."

verification = "lab-resources tests validate an entry and see the key ssh:pi.local:22, and refuse user root, a relative, `..` or one-segment root, a fingerprint without SHA256:, an entry without serial and machine id and an unknown field; pi-tool's own registry check refuses user root and a relative root with code registry."

