title = "Define the kicad-tool command line and result documents"

status = "active"

requirement = """
When the agent runs `kicad-tool` with one of the operations `inspect`, `erc`, `drc`, `bom`, `netlist`, `export` or `review-report` and `--project FILE`, the helper shall print one format-1 JSON document with the operation, the tool and KiCad versions, the run id, start and end, the project files with role, size and SHA-256, the operation's summary, warnings, limits, artifacts and the path of the complete `result.json` in a new run folder.
"""

verification = "Each operation on the fixture project prints a document with exactly these fields and status `completed`; `result.json` in the named run folder holds the same header and the complete lists; `--version` prints `kicad-tool 1.0.0`; an unknown operation, an abbreviated option, a repeated option and a repeated `--refill-zones` are `usage` refusals with exit 2."

