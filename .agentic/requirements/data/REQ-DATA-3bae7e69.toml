title = "Refuse invalid file size and file count settings"

status = "active"

requirement = """
If a workbench configuration or patch gives docs.maxFileMB a value that is zero, negative, above 500 or not a finite number, or gives docs.maxFiles a value that is not a positive integer, then the workbench schema shall reject it.
"""

